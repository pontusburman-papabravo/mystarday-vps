name: RC-1 release gate

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Deploy base URL (HTTPS origin)'
        required: true
      expected_sha:
        description: 'Expected /health git_sha'
        required: true
      expected_cache:
        description: 'Expected sw.js CACHE_NAME (e.g. stjarndag-v753)'
        required: true
      skip_device:
        description: 'Skip iOS/Android mobile matrix (browser only)'
        type: boolean
        default: false

jobs:
  prepare-qa-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: rc1-prod-smoke
    outputs:
      family_id: ${{ steps.prep.outputs.family_id }}
      pin_fingerprint_match: ${{ steps.prep.outputs.pin_fingerprint_match }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --include=dev

      - name: Prepare RC-1 QA fixture
        id: prep
        env:
          DATABASE_URL: ${{ secrets.RC1_QA_DATABASE_URL }}
          RC1_QA_EMAIL: ${{ secrets.RC1_QA_EMAIL }}
          RC1_QA_PASSWORD: ${{ secrets.RC1_QA_PASSWORD }}
          RC1_CHILD_PIN: ${{ secrets.RC1_CHILD_PIN }}
          RC1_PARENT_PIN: ${{ secrets.RC1_PARENT_PIN }}
          RC1_PIN_FINGERPRINT_KEY: ${{ secrets.RC1_PIN_FINGERPRINT_KEY }}
          RC1_QA_FAMILY_ID: ${{ secrets.RC1_QA_FAMILY_ID }}
        run: |
          set -euo pipefail
          OUT=$(node scripts/rc1-qa-family-prepare.js)
          echo "$OUT"
          FAMILY_ID=$(echo "$OUT" | tail -1 | jq -r .family_id)
          FP=$(echo "$OUT" | tail -1 | jq -r .pin_fingerprint)
          echo "family_id=$FAMILY_ID" >> "$GITHUB_OUTPUT"
          node -e "
          const { pinFingerprintsMatch } = require('./src/lib/rc1-pin-fingerprint');
          const ok = pinFingerprintsMatch(process.env.RC1_PARENT_PIN, process.env.RC1_PIN_FINGERPRINT_KEY, '$FP');
          if (!ok) { console.error('prep_pin_fingerprint_matches_runner=false'); process.exit(1); }
          console.log('prep_pin_fingerprint_matches_runner=true');
          " 
          echo "pin_fingerprint_match=true" >> "$GITHUB_OUTPUT"

  browser-smoke:
    needs: prepare-qa-fixture
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: rc1-prod-smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --include=dev

      - name: Handoff diagnostic 1/1
        env:
          RC1_SMOKE_BASE_URL: ${{ inputs.base_url }}
          RC1_EXPECTED_SHA: ${{ inputs.expected_sha }}
          RC1_EXPECTED_CACHE: ${{ inputs.expected_cache }}
          RC1_QA_EMAIL: ${{ secrets.RC1_QA_EMAIL }}
          RC1_QA_PASSWORD: ${{ secrets.RC1_QA_PASSWORD }}
          RC1_CHILD_USERNAME: ${{ secrets.RC1_CHILD_USERNAME }}
          RC1_CHILD_PIN: ${{ secrets.RC1_CHILD_PIN }}
          RC1_PARENT_PIN: ${{ secrets.RC1_PARENT_PIN }}
          RC1_QA_FAMILY_ID: ${{ needs.prepare-qa-fixture.outputs.family_id }}
          RC1_PIN_FINGERPRINT_KEY: ${{ secrets.RC1_PIN_FINGERPRINT_KEY }}
          RC1_SMOKE_FILTER: handoff
          RC1_HANDOFF_DEBUG_RUNS: '1'
        run: npm run test:e2e:rc1-prod-smoke

      - name: Handoff diagnostic 3/3
        env:
          RC1_SMOKE_BASE_URL: ${{ inputs.base_url }}
          RC1_EXPECTED_SHA: ${{ inputs.expected_sha }}
          RC1_EXPECTED_CACHE: ${{ inputs.expected_cache }}
          RC1_QA_EMAIL: ${{ secrets.RC1_QA_EMAIL }}
          RC1_QA_PASSWORD: ${{ secrets.RC1_QA_PASSWORD }}
          RC1_CHILD_USERNAME: ${{ secrets.RC1_CHILD_USERNAME }}
          RC1_CHILD_PIN: ${{ secrets.RC1_CHILD_PIN }}
          RC1_PARENT_PIN: ${{ secrets.RC1_PARENT_PIN }}
          RC1_QA_FAMILY_ID: ${{ needs.prepare-qa-fixture.outputs.family_id }}
          RC1_PIN_FINGERPRINT_KEY: ${{ secrets.RC1_PIN_FINGERPRINT_KEY }}
          RC1_SMOKE_FILTER: handoff
          RC1_HANDOFF_DEBUG_RUNS: '3'
        run: npm run test:e2e:rc1-prod-smoke

      - name: Full browser smoke 5/5 x2
        env:
          RC1_SMOKE_BASE_URL: ${{ inputs.base_url }}
          RC1_EXPECTED_SHA: ${{ inputs.expected_sha }}
          RC1_EXPECTED_CACHE: ${{ inputs.expected_cache }}
          RC1_QA_EMAIL: ${{ secrets.RC1_QA_EMAIL }}
          RC1_QA_PASSWORD: ${{ secrets.RC1_QA_PASSWORD }}
          RC1_CHILD_USERNAME: ${{ secrets.RC1_CHILD_USERNAME }}
          RC1_CHILD_PIN: ${{ secrets.RC1_CHILD_PIN }}
          RC1_PARENT_PIN: ${{ secrets.RC1_PARENT_PIN }}
          RC1_QA_FAMILY_ID: ${{ needs.prepare-qa-fixture.outputs.family_id }}
          RC1_PIN_FINGERPRINT_KEY: ${{ secrets.RC1_PIN_FINGERPRINT_KEY }}
          RC1_REQUIRE_HANDOFF: 'true'
          RC1_SMOKE_RUNS: '2'
        run: npm run test:e2e:rc1-prod-smoke

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc1-browser-smoke-artifacts
          path: artifacts/rc1-prod-smoke/
          if-no-files-found: ignore

  device-matrix:
    needs: browser-smoke
    if: ${{ inputs.skip_device != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        profile: [ios, android]
    environment: rc1-prod-smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --include=dev

      - name: RC-1 device QA (${{ matrix.profile }})
        env:
          RC1_SMOKE_BASE_URL: ${{ inputs.base_url }}
          RC1_QA_EMAIL: ${{ secrets.RC1_QA_EMAIL }}
          RC1_QA_PASSWORD: ${{ secrets.RC1_QA_PASSWORD }}
          RC1_CHILD_USERNAME: ${{ secrets.RC1_CHILD_USERNAME }}
          RC1_CHILD_PIN: ${{ secrets.RC1_CHILD_PIN }}
          RC1_DEVICE_PROFILE: ${{ matrix.profile }}
          RC1_DEVICE_QA_MODE: full
        run: npm run rc1:device-qa

      - name: Upload device QA artifacts (${{ matrix.profile }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc1-device-qa-${{ matrix.profile }}
          path: artifacts/rc1-device-qa/
          if-no-files-found: ignore

  release-summary:
    needs: [prepare-qa-fixture, browser-smoke, device-matrix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: RC-1 gate summary
        run: |
          echo "## RC-1 automated gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- QA family_id: ${{ needs.prepare-qa-fixture.outputs.family_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- prep_pin_fingerprint_matches_runner: ${{ needs.prepare-qa-fixture.outputs.pin_fingerprint_match }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- browser-smoke: ${{ needs.browser-smoke.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- device-matrix: ${{ needs.device-matrix.result }}" >> "$GITHUB_STEP_SUMMARY"
