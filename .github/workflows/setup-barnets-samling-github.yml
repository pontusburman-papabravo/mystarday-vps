name: Setup Barnets samling GitHub

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  setup:
    name: Milestone + Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup milestone, project, blockers
        env:
          GH_TOKEN: ${{ secrets.BARNETS_SAMLING_SETUP_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./scripts/setup-barnets-samling-github.sh
          ./scripts/setup-barnets-samling-github.sh
