name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: stjarndag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/stjarndag_test
      REQUIRE_EMAIL_VERIFICATION: 'false'
      JWT_SECRET: test-secret-at-least-32-chars-long-for-ci # pragma: allowlist secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Migrate
        run: npm run migrate

      - name: Test
        run: npm run test:gate

      - name: Migration rollback gate (G3c)
        run: node --test test/migration-rollback-gate.test.js

  landing-browser:
    name: Landing mobile browser QA
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: stjarndag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/stjarndag_test
      REQUIRE_EMAIL_VERIFICATION: 'false'
      JWT_SECRET: test-secret-at-least-32-chars-long-for-ci # pragma: allowlist secret
      EMAIL_ENABLED: 'false'
      NODE_ENV: development

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Migrate
        run: npm run migrate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start server and run landing mobile smoke
        run: |
          npm run dev &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/health >/dev/null && break
            sleep 1
          done
          BASE=http://127.0.0.1:3000 HEADLESS=1 node scripts/smoke-landing-mobile.mjs
