name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: stjarndag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/stjarndag_test
      REQUIRE_EMAIL_VERIFICATION: 'false'
      JWT_SECRET: test-secret-at-least-32-chars-long-for-ci # pragma: allowlist secret
      NODE_ENV: test
      TEST_SKIP_MIGRATE: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --include=dev

      - name: Build Tailwind CSS
        run: npm run css:build

      - name: Verify committed CSS matches build
        run: git diff --exit-code public/css/tailwind.build.css public/sw.js

      - name: Verify ambient objects pack is in sync
        run: npm run check:ambient-objects

      - name: Lint
        run: npm run lint

      - name: Lint public client JS
        run: npm run lint:public

      - name: Migrate
        run: npm run migrate

      - name: Test
        run: npm run test:gate

      - name: Migration rollback gate (G3c)
        run: node --test test/migration-rollback-gate.test.js
