name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: stjarndag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/stjarndag_test
      TEST_DB_DESTRUCTIVE_CONFIRM: '1'
      REQUIRE_EMAIL_VERIFICATION: 'false'
      JWT_SECRET: test-secret-at-least-32-chars-long-for-ci # pragma: allowlist secret
      NODE_ENV: test
      TEST_SKIP_MIGRATE: '1'
      RATE_LIMIT_ENABLED: 'false'
      GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --include=dev

      - name: Build Tailwind CSS
        run: npm run css:build

      - name: Verify committed CSS matches build
        run: git diff --exit-code public/css/tailwind.build.css public/sw.js

      - name: Credential leak guard
        run: npm run check:credentials

      - name: Verify ambient objects pack is in sync
        run: npm run check:ambient-objects

      - name: Lint
        run: npm run lint

      - name: Lint public client JS (budget ratchet)
        run: npm run lint:public
        # Budget: config/lint-public-budget.json — lower with npm run lint:public:sync-budget

      - name: Migrate
        run: npm run migrate

      - name: Assert test database schema matches branch
        run: node scripts/assert-disposable-database.mjs

      - name: Classify PR test routing
        id: route
        if: github.event_name == 'pull_request'
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TEST_ROUTING_MANUAL_RISK: ${{ contains(github.event.pull_request.labels.*.name, 'risk:high') && 'HIGH' || contains(github.event.pull_request.labels.*.name, 'risk:medium') && 'MEDIUM' || contains(github.event.pull_request.labels.*.name, 'risk:low') && 'LOW' || '' }}
        run: node scripts/ci-test-route.mjs --json

      - name: Run L1 focused contract tests
        if: github.event_name == 'pull_request' && steps.route.outputs.l1_required == 'true'
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TEST_ROUTING_MANUAL_RISK: ${{ contains(github.event.pull_request.labels.*.name, 'risk:high') && 'HIGH' || contains(github.event.pull_request.labels.*.name, 'risk:medium') && 'MEDIUM' || contains(github.event.pull_request.labels.*.name, 'risk:low') && 'LOW' || '' }}
        run: node scripts/ci-run-routed-tests.mjs --level L1

      - name: Run L2 domain regression tests
        if: github.event_name == 'pull_request' && steps.route.outputs.l2_required == 'true'
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TEST_ROUTING_MANUAL_RISK: ${{ contains(github.event.pull_request.labels.*.name, 'risk:high') && 'HIGH' || contains(github.event.pull_request.labels.*.name, 'risk:medium') && 'MEDIUM' || contains(github.event.pull_request.labels.*.name, 'risk:low') && 'LOW' || '' }}
        run: node scripts/ci-run-routed-tests.mjs --level L2

      - name: Test
        if: github.event_name != 'pull_request' || steps.route.outputs.l3_required == 'true'
        run: npm run test:gate

      - name: Test (PR skipped L3 — classifier determined full gate not required)
        if: github.event_name == 'pull_request' && steps.route.outputs.l3_required != 'true'
        run: echo "L3 skipped — automatic risk ${steps.route.outputs.final_risk} does not require full gate"

      - name: Migration rollback gate (G3c)
        run: node -r ./test/helpers/apply-test-database-env.js --test test/migration-rollback-gate.test.js
