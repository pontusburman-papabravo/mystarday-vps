name: RC-1 web release gate

# Browser + mobile-browser emulation only — not native iOS/Android (see docs/rc1-native-device-automation-plan.md).

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target URL for smoke tests'
        required: true
      expected_sha:
        description: 'Expected /health git_sha (must match checked-out main commit)'
        required: true
      expected_cache:
        description: 'Expected sw.js CACHE_NAME (e.g. stjarndag-v753)'
        required: true
      run_prepare:
        description: 'Run QA DB prepare (requires main + rc1-qa-db-prepare environment)'
        type: boolean
        default: false
      skip_mobile_browser:
        description: 'Skip mobile-browser matrix (browser smoke only — diagnostic)'
        type: boolean
        default: false

concurrency:
  group: rc1-web-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  enforce-release-context:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce main + SHA
        env:
          RC1_ENFORCE_MAIN: '1'
          RC1_EXPECTED_SHA: ${{ inputs.expected_sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/rc1-assert-release-gate-context.js

  prepare-qa-fixture:
    needs: enforce-release-context
    if: ${{ inputs.run_prepare == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: rc1-qa-db-prepare
    outputs:
      family_id: ${{ steps.prep.outputs.family_id }}
      child_username: ${{ steps.prep.outputs.child_username }}
      fixture_verified: ${{ steps.prep.outputs.fixture_verified }}
      prep_pin_verified: ${{ steps.prep.outputs.prep_pin_verified }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --include=dev

      - name: Prepare RC-1 QA fixture
        id: prep
        env:
          DATABASE_URL: ${{ secrets.RC1_QA_DATABASE_URL }}
          RC1_QA_EMAIL: ${{ secrets.RC1_QA_EMAIL }}
          RC1_QA_PASSWORD: ${{ secrets.RC1_QA_PASSWORD }}
          RC1_CHILD_PIN: ${{ secrets.RC1_CHILD_PIN }}
          RC1_PARENT_PIN: ${{ secrets.RC1_PARENT_PIN }}
          RC1_QA_FAMILY_ID: ${{ secrets.RC1_QA_FAMILY_ID }}
        run: |
          set -euo pipefail
          OUT=$(node scripts/rc1-qa-family-prepare.js)
          echo "$OUT" | head -n -1 || true
          JSON_LINE=$(echo "$OUT" | tail -1)
          echo "family_id=$(echo "$JSON_LINE" | jq -r .family_id)" >> "$GITHUB_OUTPUT"
          echo "child_username=$(echo "$JSON_LINE" | jq -r .child_username)" >> "$GITHUB_OUTPUT"
          echo "fixture_verified=$(echo "$JSON_LINE" | jq -r .fixture_verified)" >> "$GITHUB_OUTPUT"
          echo "prep_pin_verified=$(echo "$JSON_LINE" | jq -r .prep_pin_verified_against_database)" >> "$GITHUB_OUTPUT"

  resolve-fixture-context:
    needs: [enforce-release-context, prepare-qa-fixture]
    if: always() && needs.enforce-release-context.result == 'success'
    runs-on: ubuntu-latest
    environment: rc1-prod-smoke
    outputs:
      family_id: ${{ steps.out.outputs.family_id }}
      child_username: ${{ steps.out.outputs.child_username }}
    steps:
      - name: Resolve family + child username
        id: out
        env:
          PREP_FAMILY: ${{ needs.prepare-qa-fixture.outputs.family_id }}
          PREP_CHILD: ${{ needs.prepare-qa-fixture.outputs.child_username }}
          SECRET_FAMILY: ${{ secrets.RC1_QA_FAMILY_ID }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.run_prepare }}" = "true" ]; then
            if [ "${{ needs.prepare-qa-fixture.result }}" != "success" ]; then
              echo "prepare required but failed"; exit 1
            fi
            FAMILY="$PREP_FAMILY"
            CHILD="$PREP_CHILD"
          else
            FAMILY="$SECRET_FAMILY"
            CHILD="rc1qachild"
          fi
          if [ -z "$FAMILY" ]; then
            echo "missing family_id (run prepare or set RC1_QA_FAMILY_ID secret)"; exit 1
          fi
          if [ -n "${{ secrets.RC1_CHILD_USERNAME }}" ] && [ "${{ secrets.RC1_CHILD_USERNAME }}" != "$CHILD" ]; then
            echo "RC1_CHILD_USERNAME secret must match fixture child_username ($CHILD)"; exit 1
          fi
          echo "family_id=$FAMILY" >> "$GITHUB_OUTPUT"
          echo "child_username=$CHILD" >> "$GITHUB_OUTPUT"

  browser-smoke:
    needs: resolve-fixture-context
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: rc1-prod-smoke
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --include=dev

      - name: Handoff diagnostic 1/1
        env:
          RC1_SMOKE_BASE_URL: ${{ inputs.base_url }}
          RC1_EXPECTED_SHA: ${{ inputs.expected_sha }}
          RC1_EXPECTED_CACHE: ${{ inputs.expected_cache }}
          RC1_QA_EMAIL: ${{ secrets.RC1_QA_EMAIL }}
          RC1_QA_PASSWORD: ${{ secrets.RC1_QA_PASSWORD }}
          RC1_CHILD_USERNAME: ${{ needs.resolve-fixture-context.outputs.child_username }}
          RC1_CHILD_PIN: ${{ secrets.RC1_CHILD_PIN }}
          RC1_PARENT_PIN: ${{ secrets.RC1_PARENT_PIN }}
          RC1_QA_FAMILY_ID: ${{ needs.resolve-fixture-context.outputs.family_id }}
          RC1_REQUIRE_HANDOFF: 'true'
          RC1_SMOKE_FILTER: handoff
          RC1_HANDOFF_DEBUG_RUNS: '1'
        run: npm run test:e2e:rc1-prod-smoke

      - name: Handoff diagnostic 3/3
        env:
          RC1_SMOKE_BASE_URL: ${{ inputs.base_url }}
          RC1_EXPECTED_SHA: ${{ inputs.expected_sha }}
          RC1_EXPECTED_CACHE: ${{ inputs.expected_cache }}
          RC1_QA_EMAIL: ${{ secrets.RC1_QA_EMAIL }}
          RC1_QA_PASSWORD: ${{ secrets.RC1_QA_PASSWORD }}
          RC1_CHILD_USERNAME: ${{ needs.resolve-fixture-context.outputs.child_username }}
          RC1_CHILD_PIN: ${{ secrets.RC1_CHILD_PIN }}
          RC1_PARENT_PIN: ${{ secrets.RC1_PARENT_PIN }}
          RC1_QA_FAMILY_ID: ${{ needs.resolve-fixture-context.outputs.family_id }}
          RC1_SMOKE_FILTER: handoff
          RC1_HANDOFF_DEBUG_RUNS: '3'
        run: npm run test:e2e:rc1-prod-smoke

      - name: Full browser smoke 5/5 x2
        env:
          RC1_SMOKE_BASE_URL: ${{ inputs.base_url }}
          RC1_EXPECTED_SHA: ${{ inputs.expected_sha }}
          RC1_EXPECTED_CACHE: ${{ inputs.expected_cache }}
          RC1_QA_EMAIL: ${{ secrets.RC1_QA_EMAIL }}
          RC1_QA_PASSWORD: ${{ secrets.RC1_QA_PASSWORD }}
          RC1_CHILD_USERNAME: ${{ needs.resolve-fixture-context.outputs.child_username }}
          RC1_CHILD_PIN: ${{ secrets.RC1_CHILD_PIN }}
          RC1_PARENT_PIN: ${{ secrets.RC1_PARENT_PIN }}
          RC1_QA_FAMILY_ID: ${{ needs.resolve-fixture-context.outputs.family_id }}
          RC1_REQUIRE_HANDOFF: 'true'
          RC1_SMOKE_RUNS: '2'
        run: npm run test:e2e:rc1-prod-smoke

      - name: Upload browser smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc1-browser-smoke-artifacts
          path: artifacts/rc1-prod-smoke/
          if-no-files-found: ignore

  mobile-browser-matrix:
    needs: [browser-smoke, resolve-fixture-context]
    if: ${{ inputs.skip_mobile_browser != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        profile: [ios, android]
    environment: rc1-prod-smoke
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --include=dev

      - name: RC-1 mobile browser QA (${{ matrix.profile }})
        env:
          RC1_SMOKE_BASE_URL: ${{ inputs.base_url }}
          RC1_QA_EMAIL: ${{ secrets.RC1_QA_EMAIL }}
          RC1_QA_PASSWORD: ${{ secrets.RC1_QA_PASSWORD }}
          RC1_CHILD_USERNAME: ${{ needs.resolve-fixture-context.outputs.child_username }}
          RC1_CHILD_PIN: ${{ secrets.RC1_CHILD_PIN }}
          RC1_MOBILE_PROFILE: ${{ matrix.profile }}
          RC1_MOBILE_BROWSER_QA_MODE: full
        run: npm run rc1:mobile-browser-qa

      - name: Upload mobile-browser artifacts (${{ matrix.profile }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc1-mobile-browser-qa-${{ matrix.profile }}
          path: artifacts/rc1-mobile-browser-qa/
          if-no-files-found: ignore

  gate-verdict:
    needs:
      - enforce-release-context
      - prepare-qa-fixture
      - resolve-fixture-context
      - browser-smoke
      - mobile-browser-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: RC-1 web gate verdict
        env:
          RUN_PREPARE: ${{ inputs.run_prepare }}
          SKIP_MOBILE: ${{ inputs.skip_mobile_browser }}
          PREP_RESULT: ${{ needs.prepare-qa-fixture.result }}
          BROWSER_RESULT: ${{ needs.browser-smoke.result }}
          MOBILE_RESULT: ${{ needs.mobile-browser-matrix.result }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_CACHE: ${{ inputs.expected_cache }}
          FIXTURE_VERIFIED: ${{ needs.prepare-qa-fixture.outputs.fixture_verified }}
        run: |
          set -euo pipefail
          fail() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }

          echo "## RC-1 web release gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- tested_sha: $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- tested_cache: $EXPECTED_CACHE" >> "$GITHUB_STEP_SUMMARY"
          echo "- fixture_verified: ${FIXTURE_VERIFIED:-from_secret}" >> "$GITHUB_STEP_SUMMARY"
          echo "- browser_smoke: $BROWSER_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "- mobile_browser_matrix: $MOBILE_RESULT" >> "$GITHUB_STEP_SUMMARY"

          if [ "$RUN_PREPARE" = "true" ] && [ "$PREP_RESULT" != "success" ]; then
            fail "BLOCK: QA prepare did not succeed"
          fi
          if [ "$BROWSER_RESULT" != "success" ]; then
            fail "BLOCK: browser smoke failed"
          fi
          if [ "$SKIP_MOBILE" = "true" ]; then
            echo "- **verdict: BROWSER-ONLY DIAGNOSTIC PASS** (mobile-browser skipped)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$MOBILE_RESULT" != "success" ]; then
            fail "BLOCK: mobile-browser matrix failed"
          fi
          echo "- **verdict: RC-1 AUTOMATED WEB PASS**" >> "$GITHUB_STEP_SUMMARY"
          echo "Native iOS/Android Capacitor gate is separate (RC-1 NATIVE DEVICE PASS)." >> "$GITHUB_STEP_SUMMARY"
