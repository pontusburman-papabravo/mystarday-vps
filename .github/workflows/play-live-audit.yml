name: Google Play live audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Read-only Play listing audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --include=dev

      - name: Compare Play listings with the repo
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: node scripts/play-live-audit.js --out artifacts/play-live-audit.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-live-audit
          path: |
            artifacts/play-live-audit.json
            artifacts/play-live-audit.md
          if-no-files-found: error
