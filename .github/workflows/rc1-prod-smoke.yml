name: RC-1 prod browser smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Deploy base URL (required)'
        required: true
      expected_sha:
        description: 'Expected /health git_sha'
        required: true
      expected_cache:
        description: 'Expected sw.js CACHE_NAME (e.g. stjarndag-v748)'
        required: true
      smoke_runs:
        description: 'Consecutive full runs (use 2 before device QA)'
        required: true
        default: '2'

jobs:
  rc1-prod-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: rc1-prod-smoke

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --include=dev

      - name: RC-1 prod browser smoke
        env:
          RC1_SMOKE_BASE_URL: ${{ inputs.base_url }}
          RC1_EXPECTED_SHA: ${{ inputs.expected_sha }}
          RC1_EXPECTED_CACHE: ${{ inputs.expected_cache }}
          RC1_SMOKE_RUNS: ${{ inputs.smoke_runs }}
          RC1_REVIEW_EMAIL: ${{ secrets.RC1_REVIEW_EMAIL }}
          RC1_REVIEW_PASSWORD: ${{ secrets.RC1_REVIEW_PASSWORD }}
          RC1_CHILD_USERNAME: ${{ secrets.RC1_CHILD_USERNAME }}
          RC1_CHILD_PIN: ${{ secrets.RC1_CHILD_PIN }}
          RC1_PARENT_PIN: ${{ secrets.RC1_PARENT_PIN }}
          RC1_REQUIRE_HANDOFF: 'true'
        run: npm run test:e2e:rc1-prod-smoke

      - name: Upload smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rc1-prod-smoke-artifacts
          path: artifacts/rc1-prod-smoke/
          if-no-files-found: ignore
