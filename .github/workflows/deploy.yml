name: Deploy to VPS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: 'Git commit SHA to deploy (40 hex chars)'
        required: true
        type: string

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main to VPS
    runs-on: ubuntu-latest
    environment: vps
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )

    steps:
      - name: Resolve deploy SHA
        id: sha
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_SHA="${{ github.event.inputs.deploy_sha }}"
          else
            TARGET_SHA="${{ github.event.workflow_run.head_sha }}"
          fi
          if ! [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid deploy SHA: $TARGET_SHA"
            exit 1
          fi
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying exact CI-tested SHA: $TARGET_SHA"

      - name: Checkout repository (deploy script only)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 1

      - name: Deploy exact revision over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_SSH_PORT || 22 }}
          command_timeout: 15m
          script_stop: true
          envs: DEPLOY_SHA,VPS_APP_PATH,VPS_RESTART_CMD,VPS_HEALTH_URL,VPS_SERVICE
          script: |
            set -Eeuo pipefail
            export DEPLOY_SHA="${{ steps.sha.outputs.sha }}"
            if [ -z "${VPS_APP_PATH:-}" ]; then
              echo "VPS_APP_PATH variable is not set"
              exit 1
            fi
            cd "$VPS_APP_PATH"
            git fetch --depth 1 origin "$DEPLOY_SHA"
            git show "$DEPLOY_SHA:scripts/vps-deploy-revision.sh" > /tmp/vps-deploy-revision.sh
            chmod +x /tmp/vps-deploy-revision.sh
            bash /tmp/vps-deploy-revision.sh
        env:
          DEPLOY_SHA: ${{ steps.sha.outputs.sha }}
          VPS_APP_PATH: ${{ vars.VPS_APP_PATH }}
          VPS_RESTART_CMD: ${{ vars.VPS_RESTART_CMD }}
          VPS_HEALTH_URL: ${{ vars.VPS_HEALTH_URL }}
          VPS_SERVICE: ${{ vars.VPS_SERVICE }}
