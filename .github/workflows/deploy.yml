name: Deploy to VPS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main to VPS
    runs-on: ubuntu-latest
    environment: vps
    # Only deploy after green CI on main, or manual dispatch
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_SSH_PORT || 22 }}
          command_timeout: 15m
          script_stop: true
          envs: VPS_APP_PATH,VPS_RESTART_CMD,VPS_HEALTH_URL
          script: |
            set -eo pipefail

            if [ -z "${VPS_APP_PATH:-}" ]; then
              echo "VPS_APP_PATH variable is not set"
              exit 1
            fi

            cd "$VPS_APP_PATH"

            echo "→ Fetch latest main"
            git fetch origin main
            git reset --hard origin/main

            echo "→ Node 20"
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            # Do not source nvm.sh over SSH — it may call exit 3 in non-interactive shells.
            shopt -s nullglob
            for node_bin in "$NVM_DIR"/versions/node/v20*/bin; do
              if [ -x "$node_bin/node" ]; then
                export PATH="$node_bin:$PATH"
                break
              fi
            done
            shopt -u nullglob
            if ! command -v node >/dev/null 2>&1; then
              echo "node not found — på VPS som deploy: nvm install 20"
              exit 1
            fi
            echo "node $(node -v) npm $(npm -v)"

            echo "→ npm install"
            export NPM_CONFIG_MIN_RELEASE_AGE=0
            if [ -f package-lock.json ]; then
              npm ci --include=dev || npm install --include=dev
            else
              npm install --include=dev
            fi

            echo "→ migrate"
            npm run migrate

            echo "→ restart app"
            if [ -n "${VPS_RESTART_CMD:-}" ]; then
              eval "$VPS_RESTART_CMD"
            else
              sudo systemctl restart mystarday
            fi

            echo "→ health check (on server)"
            sleep 3
            HEALTH_URL="${VPS_HEALTH_URL:-http://127.0.0.1:3000/health}"
            for i in 1 2 3 4 5; do
              if curl -fsS "$HEALTH_URL" >/dev/null; then
                echo "OK: $HEALTH_URL"
                exit 0
              fi
              echo "waiting for app… ($i/5)"
              sleep 3
            done
            echo "health check failed: $HEALTH_URL"
            exit 1
        env:
          VPS_APP_PATH: ${{ vars.VPS_APP_PATH }}
          VPS_RESTART_CMD: ${{ vars.VPS_RESTART_CMD }}
          VPS_HEALTH_URL: ${{ vars.VPS_HEALTH_URL }}
