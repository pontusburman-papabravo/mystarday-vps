# Room Blueprint — RBS Template (WORLD_BIBLE Part III)
# Authority: Part III RBS → denna fil → Entity / Animation / Audio Bibles → LWES pack
# Copy to <room_id>.yaml (or <production_number>_<room_id>.yaml) — fill ALL sections.
# Unknown = TBD with comment — never omit a section.

production_number: 000          # Optional catalog number (100-series home rooms)
room_id: TBD                    # Stable snake_case; matches scenes.json scene_id
display_name: TBD               # Swedish child-facing name
status: draft                   # draft | review | approved | shipped

rulebook_gates:                 # Optional pipeline gates
  constitution: false
  topology_checklist: false
  sds_pass: false
  rbs_complete: false
  progression_hooks: false
  simulation_hooks: false
  ecology_checklist: false
  pipeline_approved: false

rbs_version: "1.0"
constitution_check: pending     # pass | fail | pending

# --- Room Identity ---
room_identity:
  id: TBD                        # Pack-unique scene_id
  display_name: TBD              # Child-facing Swedish
  description: TBD               # What place is this?
  primary_emotion: TBD           # Comfort | Safety | Wonder | Curiosity | Pride | Calm | Joy | Creativity | Belonging | Peace | Adventure
  secondary_emotion: TBD         # Max one; must not contradict primary
  theme_support:
    - house
    - castle
    - treehouse
    - space
    - pirate
    - wizard
  unlock_condition: TBD          # always | WDB/progression key

# --- Emotional Contract ---
emotional_contract:
  primary: TBD
  constitution_pillar: TBD       # capability | ownership | comfort | curiosity | imagination
  first_five_seconds: TBD        # Sight + sound on enter; no UI chrome
  open_questions:                # ≥1 unanswered
    - TBD
  pretend_affordances:           # LWES Appendix J
    - TBD

# --- Spatial Contract ---
spatial_contract:
  layout: TBD                    # e.g. wide_2_5d_interior
  entrance:
    id: TBD
    from_scene: TBD
    landmark_label_sv: TBD
    camera_on_enter: TBD
  landmark:
    id: TBD
    description: TBD
  walking_area:
    id: TBD
    description: TBD
  interaction_zones:
    - id: TBD
      accepts: []
  ambient_zones:
    - id: TBD
      description: TBD
  future_build_zones:
    - id: TBD
      description: TBD
  camera_anchor:
    id: TBD
    description: TBD

# --- Hero Object (exactly one) ---
hero_object:
  id: TBD
  description: TBD
  story_purpose: TBD
  interaction_level: TBD         # inspect_primary | activate | open | navigate

# --- Supporting Objects ---
supporting_objects:
  - id: TBD
    description: TBD
    story_role: TBD

# --- Ambient Objects ---
ambient_objects:
  - id: TBD
    description: TBD
    budget_tier: subtle          # subtle | medium | rare

# --- Interactive Objects (LWES §22 only) ---
interactive_objects:
  - id: TBD
    interaction_type: TBD        # Inspect | Open | Place | Collect | Feed | Pet | Talk | Move | Activate | Navigate
    target_scene: TBD
    landmark_label_sv: TBD
    build_slot: TBD
    progression_key: TBD

# --- Build Slots ---
build_slots:
  - id: TBD
    location: TBD
    required_part: TBD
    theme_variant: TBD
    unlock: TBD

# --- Navigation (explicit — never infer) ---
navigation:
  edges:
    - nav_id: TBD
      direction: in              # in | out
      from_scene: TBD
      to_scene: TBD
      transition_profile: TBD
      landmark_label_sv: TBD
  return_anchor: TBD
  comfort_zone: false

# --- NPC Contract ---
npc_contract:
  present: false
  npcs: []
  rules:
    - No guilt dialogue for absence
    - No quest giver behavior
    - Celebrate real wins only (G-01)

# --- Pet Contract ---
pet_contract:
  allowed: false
  pets: []

# --- Camera Contract (config only) ---
camera_contract:
  profile_id: TBD
  type: fixed_2_5d
  child_eye_height: true
  pan_on_enter: TBD
  pan_speed: slow
  bounds: scene_rect
  reduced_motion_fallback: static_frame

# --- Lighting Contract ---
lighting_contract:
  profile_id: TBD
  primary_source: TBD
  secondary_source: TBD
  time_variants: []
  weather_reactive: true

# --- Audio Contract ---
audio_contract:
  profile_id: TBD
  night_variant_id: TBD
  master_gain_max: 0.65
  duck_on_interact: true
  layers_ref: TBD

# --- Ambient Runtime ---
ambient_runtime:
  director_scene_key: TBD
  calmness_target: 75
  max_visual_density: 0.65
  opening_grace_ms: 10000
  silence_min_after_hero_ms: 15000
  ambient_ids: []
  rare_events: []

# --- Story Anchors ---
story_anchors:
