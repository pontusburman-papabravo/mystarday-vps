# World Production Contracts — machine-readable executable spec
# Authority: docs/world/WPC.md (canonical)
# Validate: npm run check:wpc

wpc:
  version: "1.0"
  status: canonical
  authority: absolute
  applies_to:
    - room
    - entity
    - feature
    - animation
    - interaction

  spatial:
    SPC-001: { every_room_has_entrance: true }
    SPC-002: { physical_connections_required: true, menus_replace_navigation: false }
    SPC-003: { landmark_required: true, count: 1 }
    SPC-004: { min_empty_space_percent: 30 }
    SPC-005: { build_slots_pre_exist_visually: true }

  interaction:
    INC-001: { use_lwes_pipeline: true }
    INC-002: { modify_rendering_directly: false }
    INC-003: { ends_in_calm: true }
    INC-004: { punishment_surprises: false }
    INC-005: { understandable_without_reading: true }

  progression:
    PRG-001: { stars_spent_on_building: false }
    PRG-002: { build_parts_purchaseable: false }
    PRG-003: { progress_always_visible: true }
    PRG-004: { meaningful_things_disappear: false }
    PRG-005: { real_life_precedes_digital: true }

  memory:
    MEM-001: { named_pets_lose_names: false }
    MEM-002: { memories_permanent: true }
    MEM-003: { world_remembers_meaningful_events: true }
    MEM-004: { child_loses_meaningful_progress: false }

  simulation:
    SIM-001: { world_always_breathing: true }
    SIM-002: { pressures_player: false }
    SIM-003: { weather_affects_difficulty: false }
    SIM-004: { randomness_for_own_sake: false }

  pet:
    PET-001: { can_die: false }
    PET-002: { can_become_sick: false }
    PET-003: { creates_guilt: false }
    PET-004: { happy_to_see_child: true }
    PET-005: { personality_via_statistics: false }

  audio:
    AUD-001: { sound_requires_physical_source: true }
    AUD-002: { silence_valid: true }
    AUD-003: { music_replaces_emotion: false }

  animation:
    ANI-001: { motion_for_existence_not_show: true }
    ANI-002: { believable_weight: true }
    ANI-003: { snapping_allowed: false }
    ANI-004: { easing_required: true }

  art:
    ART-001: { decorative_only_assets: false }
    ART-002: { lighting_defines_emotion: true }
    ART-003: { materials_consistent: true }
    ART-004: { perspective_changes: false }

  accessibility:
    ACC-001: { essential_depends_on_color: false }
    ACC-002: { reduced_motion_supported: true }
    ACC-003: { depends_on_reaction_speed: false }

  performance:
    PERF-001: { target_fps: 60 }
    PERF-002: { visible_loading: false }
    PERF-003: { streaming_invisible: true }
    PERF-004: { optimization_changes_gameplay: false }

  architecture:
    ARC-001: { room_specific_engine_logic: false }
    ARC-002: { duplicated_systems: false }
    ARC-003: { reusable_becomes_component: true }
    ARC-004: { configurable_becomes_data: true }
    ARC-005: { persistent_in_world_state: true }

  ai:
    AI-001: { invent_mechanics: false }
    AI-002: { invent_interaction_types: false }
    AI-003: { create_new_emotions: false }
    AI-004: { follow_lwes_before_implement: true }
    AI-005: { on_doc_conflict_stop_for_human: true }

contract_ids:
