# Husdjursstugan — RBS place contract
# Human spec: docs/world/specs/140-pet_house.md

status: draft
catalog_number: 140
schema_version: "1.0"
wpt_version: "1.0"

room:
  id: pet_house
  display_name_sv: Husdjursstugan
  pack_scene_id: pet_house
  description: >
    En varm stuga för djur som behöver omsorg — halm, mjuk lampa, vattenskål.
    Platsen där barnet lär sig försiktig tillhörighet utan Tamagotchi-skuld.
  primary_emotion: Comfort
  secondary_emotion: Curiosity
  theme_support: [house, castle, treehouse, space, pirate, wizard]
  unlock_condition: progression.pet_home.unlock

purpose:
  summary: >
    Husdjursstugan speglar omsorg utan skuld — djur väntar varmt men straffar aldrig frånvaro.
    Mid-game unlock (W-02), inte dag ett.
  failure_impact: Känns som Tamagotchi, zoo eller tom dekoration — omsorgsfantasin bryts.
  constitution_pillars: [comfort, curiosity]

emotional_contract:
  primary_emotion: Comfort
  secondary_emotion: Curiosity
  stress_level: lowest
  activity_level: calm
  music_density: low
  ambient_density: medium
  light_temperature: warm
  constitution_pillar: comfort
  calmness_target: 86
  first_five_seconds: >
    Mjukt ljus, halm som rör sig lätt. Djur sover eller tittar nyfiket.
    Ingen modal — ingen "du glömde mata".

first_impression:
  duration_ms: 5000
  forbidden: [popup, dialog, reward_toast, tutorial_overlay, paywall, guilt_message]
  sequence:
    - at_ms: 0
      beat: warm_lamp_pool
    - at_ms: 2000
      beat: animal_breathing_subtle
    - at_ms: 4000
      beat: water_bowl_gleam

room_story:
  identity: Rescue-stuga — djur som "behövde ett hem", inte köpta loot-box-djur.
  lived_in: true
  patina_level: subtle
  inhabitants: [rescue_animals, child_caregiver]
  open_questions:
    - who_was_here_before_me
    - will_a_new_friend_arrive_soon
    - does_the_rabbit_like_the_carrot_corner

hero_object:
  id: rescue_bed_nook
  description: >
    Mjuk bädd med halm och filt — plats där ett rescue-djur vilar.
    Varm lampa ovan, vattenskål nära.
  story_purpose: "Här är det tryggt för dem." — omsorg utan prestation.
  interaction_level: inspect_primary

landmark:
  id: warm_lamp_post
  description: Gammal ladugårdslampa som kastar varm pool — igenkännbart landmärke.

theme_hero_variants:
  house: { hero_id: rescue_bed_nook, landmark_id: warm_lamp_post }
  castle: { hero_id: stable_bed, landmark_id: torch_lamp }
  treehouse: { hero_id: nest_bed, landmark_id: lantern_hanging }
  space: { hero_id: habitat_pod_bed, landmark_id: glow_panel }
  pirate: { hero_id: hammock_pet_bed, landmark_id: oil_lantern }
  wizard: { hero_id: enchanted_bed, landmark_id: floating_lantern }

environmental_storytelling:
  minimum_count: 12
  micro_stories:
    - id: water_bowl_ripple
      description: Vattenskål med lätt ring
    - id: hay_strand_floor
      description: Halmstrån på golv
    - id: name_plaque_blank
      description: Tom namnskylt — barnet namnger
    - id: carrot_bin_corner
      description: Morotshörna för kanin
    - id: feather_on_window
      description: Fjäder på fönsterkarm
    - id: soft_blanket_fold
      description: Vikt filt — omsorg
    - id: paw_print_dirt
      description: Tassavtryck vid dörr
    - id: wind_chime_outside
      description: Vindspel utanför — ljud tease
    - id: garden_gate_view
      description: Grind mot trädgård synlig
    - id: sleeping_animal_breath
      description: Djur andas mjukt
    - id: brush_on_hook
      description: Borste på krok — skötsel
    - id: sanctuary_plaque_ghost
      description: Plakett-plats för sent game

pet_behaviour:
  simulation_driven: true
  states:
    - id: sleep_in_bed
      location: rescue_bed_nook
      trigger: default_calm
    - id: curious_approach_gate
      location: garden_gate_view
      trigger: child_enter
    - id: eat_carrot_quiet
      location: carrot_bin_corner
      trigger: rare_calm
  forbidden: [random_teleport, hunger_timer, guilt_dialogue, sick_punishment]

pet_contract:
  allowed: true
  pets:
    - id: rescue_rabbit
      species: rabbit
      nameable: true
      hunger_timer: false
      sick_state: false
      interact_verbs: [pet, feed_gentle, brush]
    - id: rescue_hedgehog
      species: hedgehog
      nameable: true
      hunger_timer: false
      interact_verbs: [pet]
  note: Separat från dog_companion i hall — rescue fiction

ambient_life:
  always_active: [hay_dust_motes, lamp_glow_pulse]
  sometimes: [animal_soft_sound, wind_chime_outside]

ambient_runtime:
  director_scene_key: pet_house
  calmness_target: 86
  ambient_ids: [hay_dust_motes, lamp_glow_pulse, animal_breathing]

build_progression:
  day_1:
    description: Tom stuga med bädd och lampa — ett djur väntar
    visible_elements: [rescue_bed_nook, warm_lamp_post]
  weeks_later:
    description: Fler bäddar, lekzon, sanctuary plakett
    visible_elements: [second_bed_slot, play_corner, sanctuary_plaque]

build_slots:
  - id: pet_bed_second
    location: zone_second_bed
    required_part: rescue_bed
    unlock: progression.pet_home.second_rescue
  - id: play_corner_toys
    location: zone_play_floor
    required_part: pet_toys
    unlock: progression.pet_home.play_corner
  - id: sanctuary_plaque
    location: zone_entry_wall
    required_part: sanctuary_plaque
    unlock: progression.pet_home.sanctuary_plaque

memory_points:
  - id: first_rescue_arrival
    progression_key: progression.pet_home.first_rescue

story_anchors:
  past:
    - id: rescue_story_implied
      description: Djur kom från "behövde hem"
  present:
    - id: animal_resting_today
      entity: rescue_bed_nook
  future:
    - id: second_rescue_friend
      progression_key: progression.pet_home.second_rescue

navigation:
  edges:
    - nav_id: gate_from_garden
      direction: in
      from_scene: pet_house
      to_scene: garden
      transition_profile: path_gate_small
      landmark_label_sv: Trädgården
    - nav_id: gate_to_pet_house
      direction: in
      from_scene: garden
      to_scene: pet_house
      transition_profile: path_gate_small
      landmark_label_sv: Husdjursstugan
      unlock: progression.pet_home.unlock
  return_anchor: gate_from_garden
  comfort_zone: true

navigation_targets: [garden]

audio_contract:
  profile_id: pet_house_day
  master_gain_max: 0.55
  diegetic_sources: [animal_soft_breath, hay_rustle, wind_chime_distant]
  layers_ref: audio_bible/pet_house_day

weather_support:
  inherit_world: true
  effects:
    - weather: rain
      audio: rain_on_roof_cozy
    - weather: cold
      visual: warmer_lamp_boost

qa:
  acceptance_criteria:
    - id: no_tamagotchi_guilt
      text_sv: Inga "du glömde" meddelanden
    - id: rescue_not_shop
      text_sv: Djur känns rescue, inte köpta
    - id: gentle_care
      text_sv: Omsorg känns mjukt, inte krav
    - id: mid_game_unlock
      text_sv: Inte synlig dag 1 som skuld
    - id: garden_return
      text_sv: Grind till trädgård tydlig

quality_gates:
  designer: pending
  artist: pending
  ai_gen: pending
  engineer: pending

spatial_contract:
  layout: cozy_shed_2_5d_interior
  entrance:
    id: gate_from_garden
    from_scene: garden
    landmark_label_sv: Grinden från trädgården
  landmark:
    id: warm_lamp_post
    description: Varm ladugårdslampa
  walking_area:
    id: straw_floor_center
    description: Halm mellan bäddar
  interaction_zones:
    - id: zone_rescue_bed
      accepts: [Inspect, Pet]
    - id: zone_water_bowl
      accepts: [Inspect, Activate]
    - id: zone_play_corner
      accepts: [Place, Inspect]
  camera_anchor:
    id: pet_house_fixed_2_5d
    description: Barn-ögonhöjd; bädd centrum; lampa övre höger

camera_contract:
  profile_id: pet_house_fixed_2_5d
  type: fixed_2_5d
  child_eye_height: true
  reduced_motion_fallback: static_frame

lighting_contract:
  profile_id: pet_house_warm_lamp
  primary_source: warm_lamp_post
  secondary_source: window_garden_soft
  time_variants:
    - id: morning
      color_temp: warm_gold
    - id: evening
      color_temp: amber_lamp
    - id: night
      color_temp: lamp_pool_only
  weather_reactive: true

npc_contract:
  present: false
  npcs: []
  rules:
    - No guilt dialogue for absence
    - No hunger timers
    - Celebrate real care wins only

interactive_objects:
  - id: rescue_bed_pet
    interaction_type: Pet
    landmark_label_sv: Djurets bädd
  - id: water_bowl_refresh
    interaction_type: Activate
    landmark_label_sv: Vattenskålen
  - id: play_corner_build
    interaction_type: Place
    build_slot: play_corner_toys
    progression_key: progression.pet_home.play_corner
  - id: gate_garden
    interaction_type: Navigate
    target_scene: garden
    landmark_label_sv: Trädgården

supporting_objects:
  - id: water_bowl
    story_role: care
  - id: carrot_bin_corner
    story_role: curiosity
  - id: brush_on_hook
    story_role: capability

ambient_objects:
  - id: hay_dust_motes
    budget_tier: subtle
  - id: lamp_glow_pulse
    budget_tier: subtle

discoveries:
  common:
    - id: feather_inspect
      type: inspect_discovery
  rare:
    - id: new_rescue_arrival
      progression_key: progression.pet_home.second_rescue
  hidden:
    - id: secret_nest_under_hay
      progression_key: progression.pet_home.hidden_nest

seasonal_variants:
  global_sync: true
  variants:
    - season: winter
      overlay_ids: [extra_blanket, warmer_lamp]
    - season: summer
      overlay_ids: [open_door_breeze, bright_garden_window]

theme_variants:
  house: { skin_set: house_pet_shed, landmark_label: Varm lampa }
  castle: { skin_set: castle_stable, landmark_label: Fackla }
  treehouse: { skin_set: treehouse_animal_nest, landmark_label: Hängande lykta }
  space: { skin_set: habitat_pet_pod, landmark_label: Varm panel }
  pirate: { skin_set: ship_animal_hold, landmark_label: Oljelykta }
  wizard: { skin_set: wizard_familiar_hut, landmark_label: Svävande ljus }

accessibility:
  reduced_motion_path: true
  min_touch_target_pt: 44

performance_budget:
  target_fps: 60
  max_interactive_hotspots: 7
  texture_memory_mb: 10

prompt_manifest:
  - id: pet_house_scene_hero
    version: 0.1.0
    art_style: nordic_warm_diorama_2_5d
    catalog_ref: art_prompt_catalog/0023
    positive_prompt: >
      Nordic cozy animal rescue shed interior, 2.5D illustrated diorama, warm lamp glow.
      Soft hay bed with blanket, gentle rabbit or small rescue animal resting peacefully,
      water bowl with ripple, carrot bin, brush on hook, wooden walls, garden visible through open gate,
      warm farmhouse lamp casting golden pool of light, straw on floor, caring atmosphere not zoo.
      Child eye height, Scandinavian lagom warmth, no cages, no guilt, gentle belonging.
      Portrait mobile composition, bed center, lamp upper right, gate to garden background left.
    negative_prompt: >
      No cages, no sad animals, no Tamagotchi UI, no hunger meters, no guilt text,
      no horror, no stock photo, no dirty neglect aesthetic
  - id: rescue_bed_hero
    version: 0.1.0
    catalog_ref: art_prompt_catalog/0023b
    positive_prompt: >
      Hero shot of cozy hay pet bed with soft blanket, warm lamp light,
      small rescue rabbit sleeping peacefully, Nordic gentle illustration.
    negative_prompt: No cages, no sad, no text

ecology:
  cause_effect_chains:
    - cause: care_activities_sustained
      effect: second_rescue_unlock
    - cause: absence_days
      effect: animal_still_warm_welcome_no_guilt

asset_manifest:
  scene_bg: pet_house_bg
  layers: [wood_walls, garden_gate_back, straw_floor, bed_hero, lamp_glow]
  entities: [rescue_bed_nook, warm_lamp_post, water_bowl]
  theme_resolver: pet_house_{theme}

animation_manifest:
  ambient: [hay_dust_motes, lamp_glow_pulse, animal_breathing]
  interaction: [pet_gentle_reaction, water_bowl_ripple]

meta:
  world_id: pet_home
  wdb_world_slug: pet_home
  experience_pack: child_se
  part_i_checklist_ref: specs/140-pet_house.md
  implementation_notes: Mid-game unlock W-02. Separat från dog_companion.

part_i_checklist_ref: specs/140-pet_house.md
