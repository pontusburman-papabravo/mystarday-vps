# Skogen — RBS place contract
# Human spec: docs/world/specs/170-forest.md

status: draft
catalog_number: 170
schema_version: "1.0"
wpt_version: "1.0"

room:
  id: forest
  display_name_sv: Skogen
  pack_scene_id: forest
  description: >
    En nordisk skogsglänta — höga träd, mossa, stig som slingrar djupare in.
    Platsen där nyfikenhet möter stillhet och mod i lagom skala.
  primary_emotion: Curiosity
  secondary_emotion: Wonder
  theme_support: [house, castle, treehouse, space, pirate, wizard]
  unlock_condition: progression.forest.unlock

purpose:
  summary: >
    Skogen expanderar grannskapet bortom trädgården — natur, utforskning,
    sällsynta upptäckter utan skräck eller combat.
  failure_impact: Känns som skräckskog eller tom grön bakgrund — utomhusmagin dör.
  constitution_pillars: [curiosity, imagination]

emotional_contract:
  primary_emotion: Curiosity
  secondary_emotion: Wonder
  stress_level: low
  activity_level: moderate
  music_density: low
  ambient_density: medium
  light_temperature: cool
  constitution_pillar: curiosity
  calmness_target: 78
  first_five_seconds: >
    Träd som rör sig lätt. Stig som försvinner i grönt. Ingen modal —
    naturen andas utan uppdrag.

first_impression:
  duration_ms: 5000
  forbidden: [popup, dialog, reward_toast, tutorial_overlay, paywall]
  sequence:
    - at_ms: 0
      beat: tree_canopy_readable
    - at_ms: 2000
      beat: path_deepens
    - at_ms: 4000
      beat: bird_call_or_squirrel_rare

room_story:
  identity: Svensk barr- och lövskog — lingonris, mossa, sten med lav. Barnstig, inte vildmark.
  lived_in: true
  patina_level: natural
  inhabitants: [forest_creatures_implied]
  open_questions:
    - where_does_the_path_end
    - who_made_the_stack_of_stones
    - will_i_see_the_deer_today

hero_object:
  id: forest_path_deep
  description: >
    Mossig stig som slingrar mellan trädstammar — leder mot sjön och hemliga gläntor.
  story_purpose: "Det finns mer att se om jag vågar gå." — utforskning utan fara.
  interaction_level: navigate_primary

landmark:
  id: ancient_pine_trunk
  description: Grov tallstam med lav — landmärke mitt i gläntan.

theme_hero_variants:
  house: { hero_id: forest_path_deep, landmark_id: ancient_pine_trunk }
  castle: { hero_id: enchanted_forest_path, landmark_id: carved_oak_trunk }
  treehouse: { hero_id: rope_bridge_path, landmark_id: giant_trunk_platform }
  space: { hero_id: bio_dome_forest_path, landmark_id: crystal_trunk }
  pirate: { hero_id: jungle_path, landmark_id: palm_trunk }
  wizard: { hero_id: glowing_mushroom_path, landmark_id: rune_tree_trunk }

environmental_storytelling:
  minimum_count: 12
  micro_stories:
    - id: moss_on_stone
      description: Mossa på sten — mjuk textur
    - id: stack_of_stones_cairn
      description: Stenstapel — någon var här före
    - id: squirrel_nut_cache
      description: Ekorre med kottar — sällsynt
    - id: deer_silhouette_rare
      description: Rådjur i bakgrund — rare, inte skrämmande
    - id: bird_nest_high
      description: Fågelbo högt upp
    - id: mushroom_ring_safe
      description: Svampcirkel — fantasi, inte gift-skylt
    - id: fallen_log_bridge
      description: Omfallen stam som bro
    - id: sunbeam_glade
      description: Ljusstråle i glänta
    - id: pine_cone_ground
      description: Kottar på marken
    - id: berry_bush_lingon
      description: Lingonris med bär
    - id: feather_on_path
      description: Fjäder att plocka upp
    - id: lake_tease_through_trees
      description: Vattenblink mellan träd

pet_behaviour:
  simulation_driven: true
  states:
    - id: sniff_trail
      location: forest_path_deep
      trigger: child_enter
  forbidden: [random_teleport, hunger_timer, guilt_dialogue]

pet_contract:
  allowed: true
  pets:
    - id: dog_companion
      home_anchor: forest_path_deep
      interact_verbs: [pet, call]

ambient_life:
  always_active: [leaf_rustle, tree_sway_subtle]
  sometimes: [bird_call_sparse, squirrel_chatter_rare]

ambient_runtime:
  director_scene_key: forest
  calmness_target: 78
  ambient_ids: [leaf_rustle, tree_sway_subtle, bird_call_sparse]
  rare_events:
    - id: deer_appear
      cooldown_days: 7
    - id: firefly_evening
      cooldown_days: 5
      event_ref: evt_firefly_evening

build_progression:
  day_1:
    description: Stig och glänta — inga byggnader
    visible_elements: [forest_path_deep, ancient_pine_trunk]
  weeks_later:
    description: Fågelmatare, stenstapel, bänk vid glänta
    visible_elements: [forest_bench_slot, bird_feeder_slot]

build_slots:
  - id: forest_bench
    location: zone_sunbeam_glade
    required_part: wooden_bench
    unlock: progression.forest.bench
  - id: bird_feeder_forest
    location: zone_pine_trunk_base
    required_part: bird_feeder
    unlock: progression.forest.bird_feeder

memory_points:
  - id: first_forest_enter
    progression_key: progression.forest.first_visit

story_anchors:
  past:
    - id: garden_path_led_here
      description: Stig från trädgården fortsätter
  present:
    - id: glade_light_today
      entity: sunbeam_glade
  future:
    - id: lake_path_opens
      progression_key: progression.lake.unlock

navigation:
  edges:
    - nav_id: path_from_garden
      direction: in
      from_scene: forest
      to_scene: garden
      transition_profile: path_deep_green
      landmark_label_sv: Trädgården
    - nav_id: path_to_forest
      direction: in
      from_scene: garden
      to_scene: forest
      transition_profile: path_deep_green
      landmark_label_sv: Skogen
      unlock: progression.forest.unlock
    - nav_id: path_to_lake
      direction: out
      from_scene: forest
      to_scene: lake
      transition_profile: path_downhill_water
      landmark_label_sv: Sjön
      unlock: progression.lake.unlock
  return_anchor: path_from_garden
  comfort_zone: false

navigation_targets: [garden, lake]

audio_contract:
  profile_id: forest_day
  night_variant_id: forest_night
  master_gain_max: 0.58
  diegetic_sources: [leaf_rustle, bird_call_sparse, distant_stream_tease]
  layers_ref: audio_bible/forest_day

weather_support:
  inherit_world: true
  effects:
    - weather: rain
      audio: rain_on_leaves
      visual: wet_moss_sheen
    - weather: wind
      audio: wind_in_trees
      visual: branch_sway_up
    - weather: snow
      visual: snow_on_branches_light
    - weather: fog
      visual: mist_between_trees

qa:
  acceptance_criteria:
    - id: not_scary_forest
      text_sv: Spännande men aldrig skrämmande
    - id: path_depth_clear
      text_sv: Stig leder vidare — sjö tease synlig
    - id: nordic_authentic
      text_sv: Känns svensk skog, inte djungel
    - id: rare_animals_kind
      text_sv: Djur flyr inte skrämmande — de passerar
    - id: garden_return
      text_sv: Retur till trädgård möjlig

quality_gates:
  designer: pending
  artist: pending
  ai_gen: pending
  engineer: pending

spatial_contract:
  layout: deep_2_5d_exterior_glade
  entrance:
    id: path_from_garden
    from_scene: garden
    landmark_label_sv: Stigen från trädgården
    camera_on_enter: gentle_pan_forest
  landmark:
    id: ancient_pine_trunk
    description: Grov tall med lav
  walking_area:
    id: moss_glade_floor
    description: Mossa och barr mellan stammar
  interaction_zones:
    - id: zone_forest_path
      accepts: [Navigate, Inspect]
    - id: zone_pine_trunk
      accepts: [Inspect]
    - id: zone_stone_cairn
      accepts: [Inspect, Place]
    - id: zone_sunbeam_glade
      accepts: [Place, Inspect]
  camera_anchor:
    id: forest_fixed_2_5d
    description: Barn-ögonhöjd; stig i förgrund; träd ramar in

camera_contract:
  profile_id: forest_fixed_2_5d
  type: fixed_2_5d
  child_eye_height: true
  pan_on_enter: gentle_pan_forest
  reduced_motion_fallback: static_frame

lighting_contract:
  profile_id: forest_dappled_day
  primary_source: sunbeam_through_canopy
  secondary_source: cool_green_bounce
  time_variants:
    - id: morning
      color_temp: cool_gold_dappled
    - id: evening
      color_temp: amber_long_rays
    - id: night
      color_temp: cool_moon_through_trees
  weather_reactive: true

npc_contract:
  present: false
  npcs: []

interactive_objects:
  - id: forest_path_navigate
    interaction_type: Navigate
    target_scene: lake
    landmark_label_sv: Stigen mot sjön
    unlock: progression.lake.unlock
  - id: pine_trunk_inspect
    interaction_type: Inspect
    landmark_label_sv: Tallen
  - id: stone_cairn_inspect
    interaction_type: Inspect
    landmark_label_sv: Stenstapeln
  - id: feather_pickup
    interaction_type: Inspect
    landmark_label_sv: Fjädern
  - id: path_garden
    interaction_type: Navigate
    target_scene: garden
    landmark_label_sv: Trädgården

supporting_objects:
  - id: stack_of_stones_cairn
    story_role: curiosity
  - id: berry_bush_lingon
    story_role: wonder
  - id: fallen_log_bridge
    story_role: imagination

ambient_objects:
  - id: leaf_rustle
    budget_tier: subtle
  - id: tree_sway_subtle
    budget_tier: subtle
  - id: deer_silhouette_rare
    budget_tier: rare

discoveries:
  common:
    - id: feather_on_path
      type: inspect_discovery
  rare:
    - id: deer_sighting
      type: ambient_discovery
  seasonal:
    - id: firefly_evening
      event_ref: evt_firefly_evening
    - id: snow_forest_quiet
      event_ref: evt_snow_morning
  hidden:
    - id: secret_glade_nook
      progression_key: progression.forest.secret_glade

seasonal_variants:
  global_sync: true
  variants:
    - season: winter
      overlay_ids: [snow_branches, frost_moss]
    - season: summer
      overlay_ids: [bright_green_canopy, berries_red]
    - season: autumn
      overlay_ids: [golden_leaves, mushroom_ring]

theme_variants:
  house: { skin_set: nordic_forest_default, landmark_label: Gammal tall }
  castle: { skin_set: enchanted_forest, landmark_label: Ristad ek }
  treehouse: { skin_set: canopy_forest, landmark_label: Jättestam med plattform }
  space: { skin_set: biodome_forest, landmark_label: Kristallstam }
  pirate: { skin_set: tropical_path_fiction, landmark_label: Palmstam }
  wizard: { skin_set: magic_forest, landmark_label: Runträd med svampar }

accessibility:
  reduced_motion_path: true
  min_touch_target_pt: 44

performance_budget:
  target_fps: 60
  max_interactive_hotspots: 8
  max_particle_systems: 2
  texture_memory_mb: 12

prompt_manifest:
  - id: forest_scene_hero
    version: 0.1.0
    art_style: nordic_warm_diorama_2_5d
    catalog_ref: art_prompt_catalog/0030
    positive_prompt: >
      Nordic Scandinavian forest glade, 2.5D illustrated diorama, dappled sunlight through pine and birch trees.
      Mossy path winding between tree trunks, ancient pine with lichen as landmark center,
      stone cairn, lingonberry bush, fallen log, pine cones on ground, soft green and brown palette,
      cool forest light with warm sunbeams, child eye height, inviting exploration not scary dark forest,
      handcrafted illustration, Swedish nature authenticity, depth with path leading deeper.
      Portrait mobile composition, path foreground center, tall trees framing sides, lake tease light between trees background.
    negative_prompt: >
      No horror dark forest, no scary creatures, no combat, no text, no brand logos,
      no jungle vines, no stock photo, no empty flat green
  - id: ancient_pine_hero
    version: 0.1.0
    catalog_ref: art_prompt_catalog/0030b
    positive_prompt: >
      Hero shot of ancient pine tree trunk with lichen in Nordic forest glade,
      moss at base, dappled light, warm illustrated style, landmark tree.
    negative_prompt: No scary, no text

ecology:
  cause_effect_chains:
    - cause: garden_explore_threshold
      effect: forest_path_opens
    - cause: lake_unlock
      effect: water_glimpse_between_trees
    - cause: kindness_explore
      effect: secret_glade_reveal

asset_manifest:
  scene_bg: forest_bg
  layers: [canopy_back, tree_mid, moss_floor, path_foreground, pine_hero]
  entities: [forest_path_deep, ancient_pine_trunk, stack_of_stones_cairn]
  theme_resolver: forest_{theme}

animation_manifest:
  ambient: [leaf_rustle, tree_sway_subtle, sunbeam_shift, deer_silhouette_rare]
  interaction: [feather_pickup_sparkle, cairn_stone_place]

meta:
  world_id: forest
  wdb_world_slug: forest
  experience_pack: child_se
  part_i_checklist_ref: specs/170-forest.md
  implementation_notes: Nav från garden. Sjö via path_to_lake.

part_i_checklist_ref: specs/170-forest.md
