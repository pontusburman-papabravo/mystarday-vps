# Läshörnan — RBS place contract
# Human spec: docs/world/specs/160-reading_corner.md

status: draft
catalog_number: 160
schema_version: "1.0"
wpt_version: "1.0"

room:
  id: reading_corner
  display_name_sv: Läshörnan
  pack_scene_id: reading_corner
  description: >
    Ett mjukt hörn med lampa, kuddar och bokhylla — platsen där dagen landar
    och barnet kan vara stilla och stolt över uppmärksamhet.
  primary_emotion: Calm
  secondary_emotion: Capability
  theme_support: [house, castle, treehouse, space, pirate, wizard]
  unlock_condition: progression.reading_corner.unlock

purpose:
  summary: >
    Läshörnan stänger dagens loop — kvällsrutiner, lyssna, läsa, andas.
    Fokus som stolthet, inte skolarbete.
  failure_impact: Känns som klassrum eller skärmtid — kvällsankare bryts.
  constitution_pillars: [comfort, capability]

emotional_contract:
  primary_emotion: Calm
  secondary_emotion: Capability
  stress_level: lowest
  activity_level: calm
  music_density: none
  ambient_density: low
  light_temperature: amber
  constitution_pillar: comfort
  calmness_target: 90
  first_five_seconds: >
    Lampa tänd. Kudde inbjudande. Bokryggar synliga. Ingen modal —
    tyst fokus utan deadline.

first_impression:
  duration_ms: 5000
  forbidden: [popup, dialog, reward_toast, tutorial_overlay, paywall, homework_ui]
  sequence:
    - at_ms: 0
      beat: lamp_pool_warm
    - at_ms: 2000
      beat: cushion_invite
    - at_ms: 4000
      beat: book_spine_tease

room_story:
  identity: Kvällshörna — filt fort, staplade sagor, mjukt ljud av sidor. Förälder har läst här.
  lived_in: true
  patina_level: subtle
  inhabitants: [child_protagonist]
  open_questions:
    - which_story_will_open_tonight
    - who_left_the_bookmark
    - is_the_blanket_fort_still_standing

hero_object:
  id: reading_lamp
  description: >
    Mjuk läslampa med varm skärm — kastar pool över kudde och öppen bok.
    Inte skarp skrivbordslampa.
  story_purpose: "Här kan jag vara stilla." — fokus som trygghet.
  interaction_level: inspect_primary

landmark:
  id: book_shelf_wall
  description: Låg bokhylla med färgade ryggar — barn når.

theme_hero_variants:
  house: { hero_id: reading_lamp, landmark_id: book_shelf_wall }
  castle: { hero_id: candle_lamp, landmark_id: tapestry_book_wall }
  treehouse: { hero_id: firefly_lantern, landmark_id: branch_shelf }
  space: { hero_id: soft_panel_lamp, landmark_id: data_crystal_shelf }
  pirate: { hero_id: oil_lamp_reading, landmark_id: map_scroll_shelf }
  wizard: { hero_id: floating_read_lamp, landmark_id: spell_book_shelf }

environmental_storytelling:
  minimum_count: 12
  micro_stories:
    - id: bookmark_ribbon
      description: Bokmärke med band — fortsättning väntar
    - id: blanket_fort_edge
      description: Filttak hörn synligt
    - id: hot_cocoa_mug_ghost
      description: Tom mugg — fredagsmys tease
    - id: slipper_pair
      description: Tofflor vid kudde
    - id: star_projector_subtle
      description: Diskret stjärnprojektor i tak
    - id: page_turn_sound
      description: Sidvändning — audio tease
    - id: night_window_dark
      description: Mörkt fönster — kväll ute
    - id: stuffed_friend_reading
      description: Gosedjur "läser" med
    - id: pencil_for_notes
      description: Blyertspenna för egna ord
    - id: story_relic_shelf
      description: Plats för story relic efter unlock
    - id: soft_rug_texture
      description: Tjock matta — taktil värme
    - id: parent_chair_empty
      description: Tom liten stol — förälder satt här

pet_behaviour:
  simulation_driven: true
  states:
    - id: sleep_on_rug
      location: soft_rug
      trigger: evening_calm
  forbidden: [random_teleport, hunger_timer, guilt_dialogue]

pet_contract:
  allowed: true
  pets:
    - id: dog_companion
      home_anchor: soft_rug
      interact_verbs: [pet]
      note: Sovande vid läsning kvällstid

ambient_life:
  always_active: [lamp_glow_pulse, page_turn_rare]
  sometimes: [distant_owl_soft, rain_window_soft]

ambient_runtime:
  director_scene_key: reading_corner
  calmness_target: 90
  ambient_ids: [lamp_glow_pulse, star_projector_subtle]

build_progression:
  day_1:
    description: Lampa, kudde, tom hylla
    visible_elements: [reading_lamp, book_shelf_wall]
  weeks_later:
    description: Bokryggar, filt, story relic
    visible_elements: [shelf_books, blanket_fort, story_relic]

build_slots:
  - id: shelf_book_spine
    location: zone_book_shelf
    required_part: book_spine
    unlock: progression.reading_corner.book_1
  - id: cushion_upgrade
    location: zone_reading_nook
    required_part: soft_cushion
    unlock: progression.reading_corner.cushion
  - id: story_relic_slot
    location: zone_shelf_display
    required_part: story_relic
    unlock: progression.reading_corner.story_1

memory_points:
  - id: first_evening_read
    progression_key: progression.reading_corner.first_visit

story_anchors:
  past:
    - id: bedtime_routine_stable
      progression_key: progression.reading_corner.unlock
  present:
    - id: lamp_on_tonight
      entity: reading_lamp
  future:
    - id: full_story_relic_chain
      progression_key: progression.reading_corner.story_complete

navigation:
  edges:
    - nav_id: door_bedroom
      direction: out
      from_scene: reading_corner
      to_scene: bedroom
      transition_profile: door_soft
      landmark_label_sv: Sovrummet
    - nav_id: door_reading_corner
      direction: in
      from_scene: bedroom
      to_scene: reading_corner
      transition_profile: door_soft
      landmark_label_sv: Läshörnan
      unlock: progression.reading_corner.unlock
  return_anchor: door_bedroom
  comfort_zone: true

navigation_targets: [bedroom]

audio_contract:
  profile_id: reading_corner_evening
  night_variant_id: reading_corner_night
  master_gain_max: 0.45
  diegetic_sources: [page_turn_soft, lamp_hum, rain_window]
  layers_ref: audio_bible/reading_corner_evening

weather_support:
  inherit_world: true
  effects:
    - weather: rain
      audio: rain_on_window_cozy
      visual: droplets_night_window
    - weather: clear_night
      visual: stars_through_window

qa:
  acceptance_criteria:
    - id: evening_calm
      text_sv: Känns som kvällslandning, inte läxa
    - id: focus_without_pressure
      text_sv: Inga timers eller läxor-UI
    - id: lamp_warm_not_harsh
      text_sv: Lampan mjuk, inte skarp
    - id: bedroom_connection
      text_sv: Naturlig förlängning av sovrum
    - id: story_relic_short
      text_sv: Berättelser max 3 paneler — inte oändlig reader

quality_gates:
  designer: pending
  artist: pending
  ai_gen: pending
  engineer: pending

spatial_contract:
  layout: cozy_nook_2_5d_interior
  entrance:
    id: door_from_bedroom
    from_scene: bedroom
    landmark_label_sv: Dörren från sovrummet
  landmark:
    id: book_shelf_wall
    description: Bokhylla med ryggar
  walking_area:
    id: soft_rug_center
    description: Kudde och filt på matta
  interaction_zones:
    - id: zone_reading_nook
      accepts: [Inspect, Place]
    - id: zone_book_shelf
      accepts: [Inspect, Place]
    - id: zone_lamp
      accepts: [Activate, Inspect]
  camera_anchor:
    id: reading_corner_fixed_2_5d
    description: Låg vinkel; lampa och kudde centrum

camera_contract:
  profile_id: reading_corner_fixed_2_5d
  type: fixed_2_5d
  child_eye_height: true
  reduced_motion_fallback: static_frame

lighting_contract:
  profile_id: reading_corner_amber
  primary_source: reading_lamp_warm
  secondary_source: window_night_cool
  time_variants:
    - id: evening
      color_temp: amber_lamp
    - id: night
      color_temp: lamp_pool_only
  weather_reactive: true

npc_contract:
  present: false
  npcs: []

interactive_objects:
  - id: reading_lamp_activate
    interaction_type: Activate
    landmark_label_sv: Läslampan
  - id: book_shelf_inspect
    interaction_type: Inspect
    landmark_label_sv: Bokhyllan
  - id: story_relic_open
    interaction_type: Open
    build_slot: story_relic_slot
    progression_key: progression.reading_corner.story_1
  - id: door_bedroom
    interaction_type: Navigate
    target_scene: bedroom
    landmark_label_sv: Sovrummet

supporting_objects:
  - id: blanket_fort
    story_role: comfort
  - id: stuffed_friend_reading
    story_role: belonging
  - id: slipper_pair
    story_role: comfort

ambient_objects:
  - id: lamp_glow_pulse
    budget_tier: subtle
  - id: star_projector_subtle
    budget_tier: subtle

discoveries:
  common:
    - id: bookmark_story_tease
      type: inspect_discovery
  rare:
    - id: hidden_story_relic
      progression_key: progression.reading_corner.story_1
  hidden:
    - id: secret_fort_book
      progression_key: progression.reading_corner.secret_book

seasonal_variants:
  global_sync: true
  variants:
    - season: winter
      overlay_ids: [extra_blanket, warmer_lamp]
    - season: summer
      overlay_ids: [late_evening_light, open_window_breeze]

theme_variants:
  house: { skin_set: house_reading_nook, landmark_label: Bokhylla }
  castle: { skin_set: castle_reading_alcove, landmark_label: Gobeläng och böcker }
  treehouse: { skin_set: treehouse_reading_nest, landmark_label: Gren-hylla }
  space: { skin_set: habitat_reading_pod, landmark_label: Kristall-hylla }
  pirate: { skin_set: ship_reading_corner, landmark_label: Kart- och bokrulle }
  wizard: { skin_set: wizard_reading_tower, landmark_label: Trollboks-hylla }

accessibility:
  reduced_motion_path: true
  min_touch_target_pt: 44

performance_budget:
  target_fps: 60
  max_interactive_hotspots: 6
  texture_memory_mb: 9

prompt_manifest:
  - id: reading_corner_scene_hero
    version: 0.1.0
    art_style: nordic_warm_diorama_2_5d
    catalog_ref: art_prompt_catalog/0025
    positive_prompt: >
      Nordic cozy reading corner interior, 2.5D illustrated diorama, warm amber evening lamp light.
      Soft floor cushions and blanket fort edge, low wooden bookshelf with colorful book spines,
      warm reading lamp casting golden pool, stuffed animal reading companion, slippers on rug,
      dark window showing night sky, star projector subtle on ceiling, peaceful focus atmosphere.
      Child eye height low angle, Scandinavian hygge, handcrafted warmth, calm not classroom.
      Portrait mobile composition, lamp and cushion center, bookshelf back wall, night window side.
    negative_prompt: >
      No homework UI, no screens, no harsh desk lamp, no classroom, no text on book covers readable,
      no scary night, no stock photo, no clutter chaos
  - id: reading_lamp_hero
    version: 0.1.0
    catalog_ref: art_prompt_catalog/0025b
    positive_prompt: >
      Hero shot of warm reading lamp over open book and soft cushion,
      amber golden light pool, Nordic cozy evening illustration, calm focus.
    negative_prompt: No harsh light, no text readable

ecology:
  cause_effect_chains:
    - cause: evening_routine_stable
      effect: reading_corner_unlock
    - cause: story_relic_unlock
      effect: book_spine_appears_shelf

asset_manifest:
  scene_bg: reading_corner_bg
  layers: [bookshelf_wall, night_window, rug_floor, cushion_nook, lamp_glow]
  entities: [reading_lamp, book_shelf_wall, blanket_fort]
  theme_resolver: reading_corner_{theme}

animation_manifest:
  ambient: [lamp_glow_pulse, star_projector_subtle, page_turn_rare]
  interaction: [lamp_toggle_warm, story_relic_open_panels]

meta:
  world_id: reading_corner
  wdb_world_slug: reading_corner
  experience_pack: child_se
  part_i_checklist_ref: specs/160-reading_corner.md
  implementation_notes: Evening unlock när kvällsrutiner stabila. Nav från bedroom.

part_i_checklist_ref: specs/160-reading_corner.md
