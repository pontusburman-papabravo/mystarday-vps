<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="860" viewBox="0 0 1180 860" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#475569"/></marker>
    <style>
      .title{font-size:24px;font-weight:700;fill:#0f172a}
      .sub{font-size:12px;fill:#64748b}
      .n{font-size:13px;font-weight:600;fill:#0f172a}
      .d{font-size:11px;fill:#475569}
      .e{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .api{font-size:10px;fill:#15803d;font-style:italic}
      .lbl{font-size:11px;fill:#1e3a8a;font-weight:700}
      .ph{font-size:12px;font-weight:700;fill:#334155;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1180" height="860" fill="#ffffff"/>
  <text x="40" y="40" class="title">Logiskt flödesschema — Barn</text>
  <text x="40" y="60" class="sub">Lila = barn-vy · grön kursiv = API (/api/me/*). All inlösen kräver förälder-godkännande. Vuxenåtgärder kräver förälder-PIN.</text>

  <text x="40" y="96" class="ph">1 · INLOGGNING (PIN)</text>
  <rect x="40" y="106" width="200" height="58" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="55" y="129" class="n">/child-login</text>
  <text x="55" y="147" class="d">profillista (enhet + session)</text>

  <polygon points="290,135 360,106 430,135 360,164" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="360" y="132" text-anchor="middle" class="n">Profil känd?</text>
  <text x="360" y="150" text-anchor="middle" class="d">session/cache</text>

  <rect x="480" y="80" width="200" height="50" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="495" y="101" class="n">Välj barn + PIN</text>
  <text x="495" y="119" class="d">4 siffror</text>

  <rect x="480" y="142" width="200" height="50" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="495" y="163" class="n">Skriv namn + PIN</text>
  <text x="495" y="181" class="d">manuellt (ingen session)</text>

  <line x1="240" y1="135" x2="288" y2="135" class="e"/>
  <line x1="430" y1="120" x2="478" y2="105" class="e"/><text x="440" y="100" class="lbl">ja</text>
  <line x1="430" y1="150" x2="478" y2="167" class="e"/><text x="430" y="182" class="lbl">nej</text>

  <rect x="730" y="106" width="210" height="62" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="745" y="128" class="n">POST /api/auth/child-login</text>
  <text x="745" y="146" class="d">scrypt-PIN · pin_lockout (backoff)</text>
  <text x="745" y="162" class="d">sparar förälder-session</text>
  <line x1="680" y1="120" x2="728" y2="130" class="e"/>
  <line x1="680" y1="167" x2="728" y2="150" class="e"/>

  <polygon points="990,137 1050,108 1110,137 1050,166" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="1050" y="141" text-anchor="middle" class="n">PIN ok?</text>
  <line x1="940" y1="137" x2="988" y2="137" class="e"/>
  <text x="1050" y="186" text-anchor="middle" class="lbl">nej -&gt; lockout/429</text>

  <line x1="1050" y1="166" x2="1050" y2="196" class="e"/>
  <line x1="1050" y1="210" x2="590" y2="210" stroke="#475569" stroke-width="1.6"/>
  <line x1="590" y1="210" x2="590" y2="238" class="e"/>

  <text x="40" y="262" class="ph">2 · BARNVYN — /child/today (tre världar, meny v2)</text>
  <line x1="320" y1="272" x2="860" y2="272" stroke="#cbd5e1" stroke-width="1.4"/>
  <line x1="320" y1="272" x2="320" y2="294" class="e"/>
  <line x1="590" y1="272" x2="590" y2="294" class="e"/>
  <line x1="860" y1="272" x2="860" y2="294" class="e"/>

  <g>
    <rect x="200" y="296" width="240" height="96" rx="9" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="214" y="318" class="n">Idag — schema</text>
    <text x="214" y="336" class="d">Dagsvy (day_sections) eller</text>
    <text x="214" y="351" class="d">Nu / Nästa / Sedan (timeline)</text>
    <text x="214" y="367" class="d">veckonav, foto-kort, delsteg</text>
    <text x="214" y="385" class="api">GET /api/me/daily-log?date=</text>
  </g>
  <g>
    <rect x="470" y="296" width="240" height="96" rx="9" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="484" y="318" class="n">Min värld</text>
    <text x="484" y="336" class="d">Skattkammaren (belöningar)</text>
    <text x="484" y="351" class="d">hus, rum, teman, husdjur,</text>
    <text x="484" y="367" class="d">achievements, samlarobjekt</text>
    <text x="484" y="385" class="api">GET /api/me/universe</text>
  </g>
  <g>
    <rect x="740" y="296" width="240" height="96" rx="9" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="754" y="318" class="n">Mina personer</text>
    <text x="754" y="336" class="d">familjehall</text>
    <text x="754" y="351" class="d">familjeprojekt, minnen</text>
    <text x="754" y="372" class="api">/api/family-hall/*</text>
  </g>

  <line x1="320" y1="392" x2="320" y2="426" class="e"/>

  <text x="40" y="450" class="ph">3 · KÄRNLOOPEN — bocka av, tjäna stjärnor</text>
  <g>
    <rect x="40" y="462" width="220" height="78" rx="9" fill="#ccfbf1" stroke="#0d9488"/>
    <text x="54" y="484" class="n">Bocka av aktivitet</text>
    <text x="54" y="502" class="d">optimistisk animation + kö</text>
    <text x="54" y="518" class="api">PUT /me/daily-log-items/:id/</text>
    <text x="54" y="532" class="api">complete  (offline-queue)</text>
  </g>
  <line x1="260" y1="500" x2="300" y2="500" class="e"/>
  <g>
    <rect x="300" y="462" width="220" height="78" rx="9" fill="#ccfbf1" stroke="#0d9488"/>
    <text x="314" y="484" class="n">Firande + framsteg</text>
    <text x="314" y="502" class="d">confetti, dopamin-burst,</text>
    <text x="314" y="518" class="d">milstolpar 25/50/75%</text>
    <text x="314" y="534" class="d">push + SSE -&gt; förälder</text>
  </g>
  <line x1="520" y1="500" x2="560" y2="500" class="e"/>
  <g>
    <rect x="560" y="462" width="240" height="78" rx="9" fill="#ccfbf1" stroke="#0d9488"/>
    <text x="574" y="484" class="n">Stjärnsaldo (beräknat)</text>
    <text x="574" y="502" class="d">summa completed star_value</text>
    <text x="574" y="518" class="d">+ manuella - inlösta</text>
    <text x="574" y="534" class="d">(ingen separat stjärn-tabell)</text>
  </g>
  <line x1="800" y1="500" x2="840" y2="500" class="e"/>
  <g>
    <rect x="840" y="462" width="300" height="78" rx="9" fill="#fef3c7" stroke="#d97706"/>
    <text x="854" y="484" class="n">Mål &amp; inlösen</text>
    <text x="854" y="502" class="d">POST /me/goal (sätt) / goal/change-request</text>
    <text x="854" y="518" class="d">POST /me/rewards/:id/redeem -&gt; status PENDING</text>
    <text x="854" y="534" class="d">förälder godkänner -&gt; stjärnor dras</text>
  </g>

  <line x1="960" y1="540" x2="960" y2="574" class="e"/>
  <text x="40" y="598" class="ph">4 · GAMIFICATION (universe-engine, lifetime-stjärnor)</text>
  <rect x="40" y="610" width="1100" height="70" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="56" y="633" class="d">Upplåsning efter lifetime_stars: skattkista/butik (0) -&gt; trophy/hylla (10) -&gt; avatar (15) -&gt; story/samlingar (30) -&gt; husdjur (50) -&gt; museum (100).</text>
  <text x="56" y="653" class="d">Teman: slott (0), trädkoja (75), rymd (150).  Achievements: first_completion, completions, redemptions, streak.</text>
  <text x="56" y="672" class="d">PATCH /me/avatar · PATCH /me/house · POST /me/pet · POST /me/collectibles/buy (402 om för få stjärnor)</text>

  <text x="40" y="712" class="ph">5 · TILLBAKA TILL VUXEN</text>
  <rect x="40" y="722" width="340" height="56" rx="9" fill="#fee2e2" stroke="#dc2626"/>
  <text x="54" y="744" class="n">Förälder / Logga ut / Byt barn</text>
  <text x="54" y="762" class="d">ParentalGate -&gt; föräldra-PIN (POST /family/verify-pin)</text>
  <line x1="380" y1="750" x2="430" y2="750" class="e"/>
  <rect x="430" y="722" width="360" height="56" rx="9" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="444" y="744" class="n">restore-parent-session -&gt; /dashboard</text>
  <text x="444" y="762" class="d">eller /child-login (byt barn / ingen session)</text>

  <text x="820" y="712" class="ph">NOTERAT</text>
  <rect x="820" y="722" width="320" height="56" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="834" y="744" class="d">QA-fynd U02: "Load day error" på mobil.</text>
  <text x="834" y="762" class="d">Två "view mode"-begrepp (UI vs schemavy).</text>
</svg>
