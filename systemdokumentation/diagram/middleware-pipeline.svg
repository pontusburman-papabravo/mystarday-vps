<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#475569"/></marker>
    <style>
      .title{font-size:23px;font-weight:700;fill:#0f172a}
      .sub{font-size:12px;fill:#64748b}
      .step{font-size:14px;font-weight:600;fill:#0f172a}
      .desc{font-size:11.5px;fill:#475569}
      .edge{stroke:#475569;stroke-width:1.8;marker-end:url(#a)}
      .gate{font-size:11px;fill:#b91c1c;font-weight:600}
    </style>
  </defs>
  <rect width="900" height="1000" fill="#ffffff"/>
  <text x="40" y="40" class="title">Global middleware-pipeline (app.js)</text>
  <text x="40" y="60" class="sub">Ordningen är säkerhetskritisk. Steg märkta /api gäller bara API-trafik. Avhopp till höger = möjliga svar.</text>

  <rect x="320" y="78" width="260" height="40" rx="20" fill="#0f172a"/>
  <text x="450" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">HTTP-request</text>
  <line x1="450" y1="118" x2="450" y2="140" class="edge"/>

  <g font-family="inherit">
    <rect x="190" y="142" width="520" height="46" rx="9" fill="#fef3c7" stroke="#d97706"/>
    <text x="210" y="165" class="step">1 · request timeout 30s + trust proxy</text>
    <text x="210" y="182" class="desc">varnar långsamma requests; korrekt req.ip bakom proxy</text>
    <line x1="450" y1="188" x2="450" y2="206" class="edge"/>

    <rect x="190" y="208" width="520" height="46" rx="9" fill="#fae8ff" stroke="#a21caf"/>
    <text x="210" y="231" class="step">POST /api/resend/webhook  (monteras FÖRE express.json)</text>
    <text x="210" y="248" class="desc">raw body + egen limiter — undviker att json() konsumerar bodyn</text>
    <line x1="450" y1="254" x2="450" y2="272" class="edge"/>

    <rect x="190" y="274" width="520" height="46" rx="9" fill="#fef3c7" stroke="#d97706"/>
    <text x="210" y="297" class="step">2 · express.json + cookieParser + requestId</text>
    <text x="210" y="314" class="desc">JSON-body, cookies, X-Request-ID på svaret</text>
    <line x1="450" y1="320" x2="450" y2="338" class="edge"/>

    <rect x="190" y="340" width="520" height="46" rx="9" fill="#fef3c7" stroke="#d97706"/>
    <text x="210" y="363" class="step">3 · restoreParentSession + optionalAuth</text>
    <text x="210" y="380" class="desc">återställer förälder-cookie, sätter req.user om giltig JWT (annars anonym)</text>
    <line x1="450" y1="386" x2="450" y2="404" class="edge"/>

    <rect x="190" y="406" width="520" height="46" rx="9" fill="#fef3c7" stroke="#d97706"/>
    <text x="210" y="429" class="step">4 · globalLimiter (200 req/min/IP)</text>
    <text x="210" y="446" class="desc">skippar autentiserade, statiska filer, /api/admin, /api/auth/refresh, SSE</text>
    <text x="724" y="433" class="gate">429</text>
    <line x1="450" y1="452" x2="450" y2="470" class="edge"/>

    <rect x="190" y="472" width="520" height="46" rx="9" fill="#fef3c7" stroke="#d97706"/>
    <text x="210" y="495" class="step">5 · platform-html-inject + securityHeaders</text>
    <text x="210" y="512" class="desc">injicerar plattformsskript i HTML; HSTS, X-Frame-Options, CSP (report-only)</text>
    <line x1="450" y1="518" x2="450" y2="538" class="edge"/>
  </g>

  <rect x="150" y="540" width="600" height="34" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="450" y="562" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Endast path som börjar med /api</text>
  <line x1="450" y1="574" x2="450" y2="592" class="edge"/>

  <g>
    <rect x="190" y="594" width="520" height="46" rx="9" fill="#fee2e2" stroke="#dc2626"/>
    <text x="210" y="617" class="step">6 · csrfProtect (double-submit cookie)</text>
    <text x="210" y="634" class="desc">muterande metoder kräver X-CSRF-Token = csrf_token-cookie; undantagslista</text>
    <text x="724" y="621" class="gate">403</text>
    <line x1="450" y1="640" x2="450" y2="658" class="edge"/>

    <rect x="190" y="660" width="520" height="46" rx="9" fill="#fee2e2" stroke="#dc2626"/>
    <text x="210" y="683" class="step">7 · blockImpersonationWrites</text>
    <text x="210" y="700" class="desc">blockar POST/PUT/PATCH/DELETE om JWT har isImpersonation -&gt; audit-log</text>
    <text x="724" y="687" class="gate">403</text>
    <line x1="450" y1="706" x2="450" y2="724" class="edge"/>

    <rect x="190" y="726" width="520" height="46" rx="9" fill="#fee2e2" stroke="#dc2626"/>
    <text x="210" y="749" class="step">8 · childParentApiBlock + apiLimiter</text>
    <text x="210" y="766" class="desc">barn-JWT deny-by-default (whitelist); per-user/IP-limit (100 / 30 oauth)</text>
    <text x="724" y="753" class="gate">403/429</text>
    <line x1="450" y1="772" x2="450" y2="790" class="edge"/>

    <rect x="190" y="792" width="520" height="46" rx="9" fill="#fef3c7" stroke="#d97706"/>
    <text x="210" y="815" class="step">9 · checkMaintenanceMode</text>
    <text x="210" y="832" class="desc">503 för icke-admin vid underhåll; /health, /.well-known, /api/iap/* undantas</text>
    <text x="724" y="819" class="gate">503</text>
    <line x1="450" y1="838" x2="450" y2="856" class="edge"/>
  </g>

  <rect x="190" y="858" width="520" height="58" rx="9" fill="#dcfce7" stroke="#16a34a"/>
  <text x="210" y="881" class="step">10 · registerRoutes()  -&gt;  per-route-skydd</text>
  <text x="210" y="899" class="desc">requireAuth / requireParent / requireChild / requireAdmin · validate (Zod) ·</text>
  <text x="210" y="912" class="desc">authz.requireChildAccess · requireComponent · requireFeature · route-limiters</text>
  <line x1="450" y1="916" x2="450" y2="934" class="edge"/>

  <rect x="190" y="936" width="520" height="46" rx="9" fill="#f1f5f9" stroke="#64748b"/>
  <text x="210" y="959" class="step">11 · static / /uploads / public-pages  -&gt;  404 + global error handler</text>
  <text x="210" y="976" class="desc">statiska assets, uppladdningar, SEO-sidor; sista utväg = felhanteraren</text>
</svg>
