<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" viewBox="0 0 1180 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#475569"/>
    </marker>
    <style>
      .title{font-size:26px;font-weight:700;fill:#0f172a}
      .sub{font-size:13px;fill:#64748b}
      .layer{font-size:13px;font-weight:700;fill:#334155;letter-spacing:1px}
      .box{font-size:13px;fill:#0f172a}
      .boxb{font-size:13px;font-weight:600;fill:#0f172a}
      .small{font-size:11px;fill:#475569}
      .edge{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1180" height="900" fill="#ffffff"/>
  <text x="40" y="46" class="title">Min Stjärndag — Systemarkitektur</text>
  <text x="40" y="68" class="sub">Express.js + PostgreSQL (Neon) · PWA + Capacitor (iOS/Android) · deploy på VPS (systemd) / Render</text>

  <text x="40" y="108" class="layer">KLIENTER</text>
  <g>
    <rect x="40" y="118" width="250" height="92" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="60" y="143" class="boxb">Webb-PWA (browser)</text>
    <text x="60" y="163" class="small">Statiska HTML-sidor i public/</text>
    <text x="60" y="180" class="small">Service Worker (sw.js, cache-version)</text>
    <text x="60" y="197" class="small">Klient-JS: dashboard / schedule / child</text>
  </g>
  <g>
    <rect x="310" y="118" width="250" height="92" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="330" y="143" class="boxb">iOS-app (Capacitor)</text>
    <text x="330" y="163" class="small">Sign in with Apple (native)</text>
    <text x="330" y="180" class="small">APNs push · RevenueCat IAP</text>
    <text x="330" y="197" class="small">Camera (foto-uppladdning)</text>
  </g>
  <g>
    <rect x="580" y="118" width="250" height="92" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="600" y="143" class="boxb">Android-app (Capacitor)</text>
    <text x="600" y="163" class="small">Google Sign In (native)</text>
    <text x="600" y="180" class="small">FCM push · RevenueCat IAP</text>
    <text x="600" y="197" class="small">Camera</text>
  </g>
  <g>
    <rect x="850" y="118" width="290" height="92" rx="10" fill="#fae8ff" stroke="#a21caf" stroke-width="1.5"/>
    <text x="870" y="143" class="boxb">Externa anrop</text>
    <text x="870" y="163" class="small">RevenueCat-webhook (IAP)</text>
    <text x="870" y="180" class="small">Resend-webhook (e-poststatus)</text>
    <text x="870" y="197" class="small">Sökmotorer / landningssidor (SEO)</text>
  </g>

  <line x1="165" y1="210" x2="165" y2="252" class="edge"/>
  <line x1="435" y1="210" x2="435" y2="252" class="edge"/>
  <line x1="705" y1="210" x2="705" y2="252" class="edge"/>
  <line x1="995" y1="210" x2="995" y2="252" class="edge"/>
  <text x="600" y="240" class="small">HTTPS · JWT-cookies (httpOnly) · CSRF double-submit · X-Request-ID</text>

  <text x="40" y="278" class="layer">EXPRESS-APP (app.js) — GLOBAL MIDDLEWARE-PIPELINE (ordning)</text>
  <rect x="40" y="288" width="1100" height="78" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="56" y="312" class="small">timeout 30s -&gt; resend-webhook (raw, före json) -&gt; express.json -&gt; cookieParser -&gt; requestId -&gt; restoreParentSession -&gt; optionalAuth -&gt;</text>
  <text x="56" y="332" class="small">globalLimiter (200/min/IP) -&gt; platform-html-inject -&gt; securityHeaders -&gt;  [ /api ]  csrfProtect -&gt; blockImpersonationWrites -&gt;</text>
  <text x="56" y="352" class="small">childParentApiBlock + apiLimiter -&gt; checkMaintenanceMode -&gt; registerRoutes() -&gt; express.static / public-pages -&gt; 404 + error handler</text>

  <line x1="590" y1="366" x2="590" y2="404" class="edge"/>

  <text x="40" y="430" class="layer">API-ROUTES &amp; DOMÄNER  (src/routes/, ~120 filer · per-route: requireAuth/Parent/Child/Admin, validate (Zod), authz, requireComponent/Feature)</text>
  <g>
    <rect x="40" y="442" width="172" height="86" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="54" y="465" class="boxb">Auth &amp; konto</text>
    <text x="54" y="483" class="small">auth/* login, refresh,</text>
    <text x="54" y="499" class="small">child-login, apple, google</text>
    <text x="54" y="515" class="small">account/*</text>
  </g>
  <g>
    <rect x="222" y="442" width="172" height="86" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="236" y="465" class="boxb">Familj &amp; barn</text>
    <text x="236" y="483" class="small">family/*, children</text>
    <text x="236" y="499" class="small">invites, pedagog, pin</text>
    <text x="236" y="515" class="small">custody (boendeschema)</text>
  </g>
  <g>
    <rect x="404" y="442" width="172" height="86" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="418" y="465" class="boxb">Schema &amp; logg</text>
    <text x="418" y="483" class="small">schedules/*, activities</text>
    <text x="418" y="499" class="small">daily-logs/*</text>
    <text x="418" y="515" class="small">special-day, onboarding</text>
  </g>
  <g>
    <rect x="586" y="442" width="172" height="86" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="600" y="465" class="boxb">Belöning &amp; barn-vy</text>
    <text x="600" y="483" class="small">rewards, goals</text>
    <text x="600" y="499" class="small">child-view, child-universe</text>
    <text x="600" y="515" class="small">reports, observations</text>
  </g>
  <g>
    <rect x="768" y="442" width="172" height="86" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="782" y="465" class="boxb">Tillväxt &amp; betalning</text>
    <text x="782" y="483" class="small">subscription, iap</text>
    <text x="782" y="499" class="small">activation-program</text>
    <text x="782" y="515" class="small">surveys, newsletter</text>
  </g>
  <g>
    <rect x="950" y="442" width="190" height="86" rx="9" fill="#bbf7d0" stroke="#15803d" stroke-width="1.6"/>
    <text x="964" y="465" class="boxb">Admin</text>
    <text x="964" y="483" class="small">admin/* (30 moduler)</text>
    <text x="964" y="499" class="small">requireAdmin · impersonation</text>
    <text x="964" y="515" class="small">analytics, features, content</text>
  </g>

  <line x1="590" y1="528" x2="590" y2="566" class="edge"/>

  <text x="40" y="592" class="layer">DOMÄN- &amp; TJÄNSTELAGER  (src/lib/ ~94 · db/ ~51 namngivna query-moduler)</text>
  <g>
    <rect x="40" y="604" width="262" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
    <text x="54" y="627" class="boxb">Affärslogik (src/lib)</text>
    <text x="54" y="645" class="small">daily-log-generator, custody-resolver</text>
    <text x="54" y="661" class="small">subscription, feature-access, universe-engine</text>
  </g>
  <g>
    <rect x="312" y="604" width="262" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
    <text x="326" y="627" class="boxb">Dataåtkomst (db/)</text>
    <text x="326" y="645" class="small">parent, child, custody, surveys,</text>
    <text x="326" y="661" class="small">features, analytics (parametriserad SQL)</text>
  </g>
  <g>
    <rect x="584" y="604" width="262" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
    <text x="598" y="627" class="boxb">Schedulers (13 st)</text>
    <text x="598" y="645" class="small">midnight, weekly-summary, win-back,</text>
    <text x="598" y="661" class="small">push-reminder, activation*, custody-handoff</text>
  </g>
  <g>
    <rect x="856" y="604" width="284" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
    <text x="870" y="627" class="boxb">Realtid &amp; notiser</text>
    <text x="870" y="645" class="small">SSE-broadcast (events), push-notifications</text>
    <text x="870" y="661" class="small">email (Resend), logger (pino)</text>
  </g>

  <line x1="171" y1="674" x2="171" y2="724" class="edge"/>
  <line x1="443" y1="674" x2="443" y2="724" class="edge"/>
  <line x1="715" y1="674" x2="900" y2="724" class="edge"/>
  <line x1="990" y1="674" x2="1010" y2="724" class="edge"/>

  <text x="40" y="750" class="layer">PERSISTENS &amp; EXTERNA INTEGRATIONER</text>
  <g>
    <rect x="40" y="760" width="360" height="100" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
    <text x="58" y="785" class="boxb">PostgreSQL (Neon / lokal pg)</text>
    <text x="58" y="805" class="small">pg.Pool max 5 · statement_timeout 15s · SSL</text>
    <text x="58" y="822" class="small">~80 tabeller: family, parent, child, parent_child,</text>
    <text x="58" y="839" class="small">scheman, daily_log, reward, custody, surveys</text>
    <text x="58" y="855" class="small">migrate.js + migrations/ (node-pg-migrate-format)</text>
  </g>
  <g>
    <rect x="420" y="760" width="340" height="100" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.3"/>
    <text x="438" y="785" class="boxb">Fil-lagring</text>
    <text x="438" y="805" class="small">Cloudflare R2 (när R2_* satt)</text>
    <text x="438" y="822" class="small">annars lokal disk: data/uploads -&gt; /uploads/</text>
    <text x="438" y="845" class="small">profil-/aktivitetsbilder, bildbibliotek</text>
  </g>
  <g>
    <rect x="780" y="760" width="360" height="100" rx="10" fill="#fae8ff" stroke="#a21caf" stroke-width="1.5"/>
    <text x="798" y="785" class="boxb">Tredjeparts-API</text>
    <text x="798" y="805" class="small">Resend (e-post) · RevenueCat (IAP)</text>
    <text x="798" y="822" class="small">Web Push (VAPID) · Apple APNs · FCM</text>
    <text x="798" y="845" class="small">Apple/Google OAuth · Facebook Graph</text>
  </g>
