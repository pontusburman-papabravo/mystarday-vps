<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1040" viewBox="0 0 1320 1040" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#475569"/></marker>
    <style>
      .title{font-size:24px;font-weight:700;fill:#0f172a}
      .sub{font-size:12px;fill:#64748b}
      .ent{font-size:13px;font-weight:700;fill:#0f172a}
      .col{font-size:10.5px;fill:#475569}
      .rel{stroke:#475569;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .card{font-size:10px;fill:#1e3a8a;font-weight:700}
      .legend{font-size:11px;fill:#334155}
      .dom{font-size:12px;font-weight:700;fill:#334155}
    </style>
  </defs>
  <rect width="1320" height="1040" fill="#ffffff"/>
  <text x="40" y="40" class="title">Logisk datamodell (ER) — kärnentiteter</text>
  <text x="40" y="60" class="sub">Färg = domän. Linje med pil = främmande nyckel (pekar mot förälder-tabell). 1 / N / N:M = kardinalitet.</text>

  <rect x="540" y="92" width="230" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="555" y="113" class="ent">family</text>
  <text x="555" y="130" class="col">timezone, sektionstider</text>
  <text x="555" y="145" class="col">subscription_status, trial_ends_at</text>
  <text x="555" y="160" class="col">is_lifetime_free, rc_customer_id</text>

  <rect x="250" y="230" width="220" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="265" y="251" class="ent">parent</text>
  <text x="265" y="268" class="col">email/pwd, oauth, family_role</text>
  <text x="265" y="283" class="col">account_type, is_admin, pin</text>
  <text x="265" y="298" class="col">push_preferences</text>

  <rect x="840" y="230" width="220" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="855" y="251" class="ent">child</text>
  <text x="855" y="268" class="col">name, emoji/avatar, pin</text>
  <text x="855" y="283" class="col">view_type, child_view_config</text>
  <text x="855" y="298" class="col">username (unik), universe-fält</text>

  <rect x="545" y="232" width="220" height="60" rx="8" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="560" y="253" class="ent">parent_child  (N:M)</text>
  <text x="560" y="270" class="col">role: primary | shared | pedagog</text>
  <text x="560" y="285" class="col">revoked_at, connected_at</text>

  <path d="M555,165 C470,200 420,205 380,228" class="rel"/>
  <text x="430" y="200" class="card">1 : N</text>
  <path d="M755,165 C850,200 905,205 945,228" class="rel"/>
  <text x="860" y="200" class="card">1 : N</text>
  <path d="M470,266 L543,266" class="rel"/>
  <path d="M838,266 L767,266" class="rel"/>

  <rect x="820" y="92" width="240" height="62" rx="8" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
  <text x="835" y="113" class="ent">family_subscriptions  (1:1)</text>
  <text x="835" y="130" class="col">tier: lifetime_free|trial|paid</text>
  <text x="835" y="145" class="col">components JSONB, trial_expires</text>
  <path d="M770,123 L818,123" class="rel"/>
  <text x="785" y="116" class="card">1:1</text>

  <rect x="40" y="92" width="220" height="62" rx="8" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
  <text x="55" y="113" class="ent">features / family_features</text>
  <text x="55" y="130" class="col">slug, status dev|live|off</text>
  <text x="55" y="145" class="col">family_features (N:M, ingen FK)</text>
  <path d="M260,123 C400,110 470,116 538,122" class="rel"/>
  <text x="380" y="106" class="card">N:M</text>

  <text x="40" y="350" class="dom">SCHEMA &amp; AKTIVITETER</text>
  <rect x="40" y="360" width="200" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="55" y="381" class="ent">activity_template</text>
  <text x="55" y="398" class="col">family-scopad, source, image_url</text>
  <text x="55" y="413" class="col">activity_sub_step (delsteg)</text>

  <rect x="300" y="360" width="200" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="315" y="381" class="ent">weekly_schedule</text>
  <text x="315" y="398" class="col">per barn · day_of_week</text>
  <text x="315" y="413" class="col">week_variant, custody_home_id</text>

  <rect x="560" y="360" width="200" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="575" y="381" class="ent">weekly_schedule_item</text>
  <text x="575" y="398" class="col">tid, ordning</text>
  <text x="575" y="413" class="col">FK activity_template</text>

  <rect x="300" y="446" width="200" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="315" y="467" class="ent">special_day_schedule</text>
  <text x="315" y="484" class="col">datum-override (UNIQUE barn+datum)</text>
  <text x="315" y="498" class="col">+ special_day_schedule_item</text>

  <path d="M945,302 C700,330 480,340 400,358" class="rel"/>
  <text x="640" y="332" class="card">child 1 : N</text>
  <path d="M500,392 L558,392" class="rel"/>
  <text x="515" y="385" class="card">1:N</text>
  <path d="M240,392 C260,392 270,392 298,392" class="rel"/>
  <path d="M560,400 C540,420 520,430 500,448" class="rel"/>
  <text x="510" y="438" class="card">ref</text>
  <path d="M945,302 C650,360 470,420 402,446" class="rel"/>

  <text x="820" y="350" class="dom">DAGLIG LOGG &amp; STJÄRNOR</text>
  <rect x="820" y="360" width="200" height="64" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/>
  <text x="835" y="381" class="ent">daily_log</text>
  <text x="835" y="398" class="col">per barn+datum (UNIQUE)</text>
  <text x="835" y="413" class="col">is_paused, generated_from</text>

  <rect x="1080" y="360" width="200" height="64" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/>
  <text x="1095" y="381" class="ent">daily_log_item</text>
  <text x="1095" y="398" class="col">completed, star_value</text>
  <text x="1095" y="413" class="col">completed_date, completed_by</text>

  <rect x="1080" y="446" width="200" height="56" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/>
  <text x="1095" y="467" class="ent">rating / sub_step</text>
  <text x="1095" y="483" class="col">humör per loggrad</text>
  <text x="1095" y="497" class="col">delstegsstatus</text>

  <path d="M945,302 C940,330 930,345 920,358" class="rel"/>
  <text x="905" y="335" class="card">1 : N</text>
  <path d="M1020,392 L1078,392" class="rel"/>
  <text x="1035" y="385" class="card">1:N</text>
  <path d="M1180,424 L1180,444" class="rel"/>
  <path d="M400,424 C500,520 700,430 818,400" stroke="#94a3b8" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="600" y="500" font-size="10" fill="#64748b" font-style="italic">daily-log-generator: schema till daglig snapshot</text>

  <text x="40" y="560" class="dom">BELÖNINGAR &amp; MÅL</text>
  <rect x="40" y="570" width="200" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="55" y="591" class="ent">reward</text>
  <text x="55" y="608" class="col">star_cost, visible_to_children[]</text>
  <text x="55" y="622" class="col">requires_approval</text>

  <rect x="300" y="570" width="210" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="315" y="591" class="ent">reward_redemption</text>
  <text x="315" y="608" class="col">status pending/approved</text>
  <text x="315" y="622" class="col">approved_by FK parent</text>

  <rect x="560" y="570" width="200" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="575" y="591" class="ent">child_reward_goal</text>
  <text x="575" y="608" class="col">aktivt mål per barn</text>
  <text x="575" y="622" class="col">+ change_request (godkänns)</text>

  <rect x="810" y="570" width="180" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="825" y="591" class="ent">streak  (1:1)</text>
  <text x="825" y="608" class="col">child_collectible</text>
  <text x="825" y="622" class="col">child_achievement, child_pet</text>

  <path d="M240,600 L298,600" class="rel"/>
  <text x="255" y="593" class="card">1:N</text>
  <path d="M140,570 C160,500 700,330 818,360" stroke="#94a3b8" stroke-width="1.2" fill="none" stroke-dasharray="4 4"/>
  <path d="M510,600 L558,600" class="rel"/>
  <path d="M945,302 C980,420 980,520 920,568" class="rel"/>
  <text x="958" y="470" class="card">child 1:N / 1:1</text>

  <text x="40" y="690" class="dom">BOENDESCHEMA (custody / FEAT-1)</text>
  <rect x="40" y="700" width="200" height="58" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="55" y="721" class="ent">custody_home</text>
  <text x="55" y="738" class="col">etikett, färg (per family)</text>
  <text x="55" y="752" class="col">custody_parent_home (N:M parent)</text>

  <rect x="300" y="700" width="210" height="58" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="315" y="721" class="ent">custody_pattern  (1:1 child)</text>
  <text x="315" y="738" class="col">A/B-veckomönster</text>
  <text x="315" y="752" class="col">week_a_home_id, week_b_home_id</text>
  <path d="M240,729 L298,729" class="rel"/>
  <text x="255" y="722" class="card">ref</text>

  <text x="560" y="690" class="dom">PEDAGOG &amp; RAPPORTER</text>
  <rect x="560" y="700" width="200" height="58" rx="8" fill="#cffafe" stroke="#0891b2" stroke-width="1.5"/>
  <text x="575" y="721" class="ent">pedagog_invite</text>
  <text x="575" y="738" class="col">token, child_ids[], expires</text>
  <text x="575" y="752" class="col">FK parent_child role=pedagog</text>

  <rect x="810" y="700" width="200" height="58" rx="8" fill="#cffafe" stroke="#0891b2" stroke-width="1.5"/>
  <text x="825" y="721" class="ent">pedagog_notes</text>
  <text x="825" y="738" class="col">UNIQUE child+pedagog+date</text>
  <text x="825" y="752" class="col">child_observation, professional_share_link</text>

  <text x="560" y="800" class="dom">KOMMUNIKATION, ADMIN &amp; ANALYTICS</text>
  <rect x="560" y="810" width="225" height="56" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
  <text x="575" y="831" class="ent">dagens_nyhet / newsletters</text>
  <text x="575" y="848" class="col">email_templates, win_back_email_log</text>
  <text x="575" y="861" class="col">system_messages, notification_log</text>

  <rect x="810" y="810" width="200" height="56" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
  <text x="825" y="831" class="ent">admin_audit_log</text>
  <text x="825" y="848" class="col">impersonation, blockerade writes</text>
  <text x="825" y="861" class="col">push_subscriptions, pin_audit_log</text>

  <rect x="1035" y="810" width="245" height="56" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3"/>
  <text x="1050" y="831" class="ent">analytics_events / snapshots</text>
  <text x="1050" y="848" class="col">family_id UTAN FK · anonymiserat</text>
  <text x="1050" y="861" class="col">survey_* (saknar CREATE i repo)</text>

  <text x="40" y="800" class="dom">AKTIVERING &amp; TILLVÄXT</text>
  <rect x="40" y="810" width="240" height="56" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="55" y="831" class="ent">family_activation_state</text>
  <text x="55" y="848" class="col">parent_activation_program (7-dagar)</text>
  <text x="55" y="861" class="col">referral, retention_reengagement_push</text>

  <rect x="40" y="905" width="1240" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="55" y="928" class="dom">Modellnoteringar (se kodanalysen)</text>
  <text x="55" y="950" class="legend">• Dubbel prenumerationsmodell: family.subscription_status (legacy/RevenueCat) + family_subscriptions.components — kan divergera.</text>
  <text x="55" y="970" class="legend">• Svaga/saknade FK: analytics_events.family_id, family_features.feature_slug, *_invite.child_ids[], reward.visible_to_children[], daily_log.generated_from, schedule_date_exclusion.</text>
  <text x="55" y="990" class="legend">• Schema-drift: surveys/survey_* , landing_news, admin_uploaded_images, pin_notification_log, deletion_job anvands i kod men saknar CREATE i migrations (finns bara i prod).</text>
  <text x="55" y="1008" class="legend">• 1:1-tabeller per barn: streak, pin_lockout, child_pet, custody_pattern. parent_child saknar DB-CHECK på role.</text>
</svg>
