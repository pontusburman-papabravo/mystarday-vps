  <script>
    function fetchWithTimeout(url, ms) {
      const controller = new AbortController();
      const timer = window.setTimeout(function () { controller.abort(); }, ms || 8000);
      return fetch(url, { signal: controller.signal }).finally(function () {
        window.clearTimeout(timer);
      });
    }

    // Script-scope: handleAppleRegister is outside DOMContentLoaded and must
    // never throw ReferenceError when looking up copy.
    function t(key, params) {
      try {
        if (window.authT) return window.authT(key, params);
        if (window.I18n && typeof window.I18n.t === 'function') return window.I18n.t(key, params);
      } catch (_) { /* keep key */ }
      return key;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      // Check if already logged in
      if (Auth.isLoggedIn()) {
        Auth.redirectToDashboard();
        return;
      }

      if (window.RegisterWebSignupGate && RegisterWebSignupGate.shouldClosePublicSignup()) {
        RegisterWebSignupGate.apply();
        return;
      }

      // Check if invite token is present or if open registration is allowed
      const params = new URLSearchParams(window.location.search);
      const inviteToken = params.get('invite');

      if (inviteToken) {
        // Invite-based registration — validate token first
        try {
          const res = await fetchWithTimeout(`/api/family/invite/${encodeURIComponent(inviteToken)}`);
          if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('inviteErrorText').textContent =
              data.error || t('auth.register.inviteInvalid');
            document.getElementById('errorState').classList.remove('hidden');
            return;
          }
          const inviteData = await res.json();
          document.getElementById('loadingState').classList.add('hidden');
          document.getElementById('registerForm').classList.remove('hidden');
          document.getElementById('loginLink').classList.remove('hidden');
          document.getElementById('childLoginLink').classList.remove('hidden');

          // Pre-fill and lock email if invite specifies it
          if (inviteData.email) {
            const emailField = document.getElementById('email');
            emailField.value = inviteData.email;
            emailField.readOnly = true;
            emailField.classList.add('bg-gray-50', 'text-text-soft');
          }
          if (window.AuthLoginPlatform && typeof AuthLoginPlatform.applyAuthSections === 'function') {
            AuthLoginPlatform.applyAuthSections({ page: 'register' });
          }
        } catch {
          document.getElementById('loadingState').classList.add('hidden');
          document.getElementById('inviteErrorText').textContent = t('auth.register.inviteValidateFailed');
          document.getElementById('errorState').classList.remove('hidden');
          return;
        }
      } else {
        // No invite — check if open registration is enabled
        try {
          const res = await fetchWithTimeout('/api/registration-status');
          const data = await res.json();
          if (data.mode === 'maintenance') {
            window.location.href = '/login?reason=registration_closed';
            return;
          }
          document.getElementById('loadingState').classList.add('hidden');
          document.getElementById('registerForm').classList.remove('hidden');
          document.getElementById('loginLink').classList.remove('hidden');
          document.getElementById('childLoginLink').classList.remove('hidden');

          if (window.AuthLoginPlatform && typeof AuthLoginPlatform.applyAuthSections === 'function') {
            AuthLoginPlatform.applyAuthSections({ page: 'register' });
          }
        } catch {
          window.location.href = '/login';
          return;
        }
      }

      if (params.get('method') === 'apple') {
        const hint = document.getElementById('appleRegistrationHint');
        if (hint) hint.classList.remove('hidden');
        if (window.AppleAuthCompletion) AppleAuthCompletion.hideEmailPasswordIdentityFields();
        const countryMount = document.querySelector('[data-country-choice-mount]');
        if (countryMount && typeof countryMount.scrollIntoView === 'function') {
          countryMount.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }

      const form = document.getElementById('registerForm');
      const submitBtn = document.getElementById('submitBtn');
      const nameInput = document.getElementById('name');
      const email = document.getElementById('email');
      const familyName = document.getElementById('familyName');
      const familyNameHint = document.getElementById('familyNameHint');
      const password = document.getElementById('password');
      const confirmPassword = document.getElementById('confirmPassword');
      const successDiv = document.getElementById('registerSuccess');
      const loginLink = document.getElementById('loginLink');

      // Track whether family name has been manually edited
      let familyNameEdited = false;

      // Auto-generate family name from parent name
      function updateFamilyName() {
        const nameVal = nameInput.value.trim();
        if (nameVal && !familyNameEdited) {
          familyName.value = t('auth.register.familyNameSuffix', { name: nameVal });
          familyNameHint.textContent = t('auth.register.familyNameGenerated');
        }
      }

      nameInput.addEventListener('input', () => {
        updateFamilyName();
      });

      familyName.addEventListener('input', () => {
        familyNameEdited = true;
        const val = familyName.value.trim();
        if (!val) {
          familyNameHint.textContent = t('auth.register.familyNameAuto');
          familyNameEdited = false;
          updateFamilyName();
        } else {
          familyNameHint.textContent = t('auth.register.familyNameEdited');
        }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Client-side validation
        if (!document.getElementById('termsAccepted').checked) {
          showError('registerError', t('auth.register.termsRequired'));
          return;
        }

        if (window.LanguageChoice && typeof LanguageChoice.requireSelection === 'function'
            && LanguageChoice.requireSelection() !== true) {
          const choiceMount = document.querySelector('[data-language-choice-mount]');
          if (choiceMount) choiceMount.scrollIntoView({ behavior: 'smooth', block: 'center' });
          return;
        }

        var countryOk = false;
        try {
          countryOk = window.RegistrationCountryGate
            ? RegistrationCountryGate.allow(window.CountryChoice) === true
            : false;
        } catch (_) {
          countryOk = false;
        }
        if (!countryOk) {
          showError('registerError', t('market.choice.required'));
          if (window.RegistrationCountryGate && RegistrationCountryGate.revealCountryError) {
            RegistrationCountryGate.revealCountryError();
          } else {
            const countryMount = document.querySelector('[data-country-choice-mount]');
            if (countryMount) countryMount.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
          return;
        }

        if (!nameInput.value.trim()) {
          showError('registerError', t('auth.errors.nameRequired'));
          return;
        }

        if (!email.value) {
          showError('registerError', t('auth.errors.emailRequired'));
          return;
        }

        // Basic email format validation
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email.value)) {
          showError('registerError', t('auth.errors.emailInvalid'));
          return;
        }

        if (password.value.length < 8) {
          showError('registerError', t('auth.errors.passwordTooShort'));
          return;
        }

        if (password.value !== confirmPassword.value) {
          showError('registerError', t('auth.errors.passwordMismatch'));
          return;
        }

        hideError('registerError');
        setLoading(submitBtn, true);

        try {
          const utm =
            (window.UtmCapture && UtmCapture.toRegisterFields && UtmCapture.toRegisterFields()) ||
            (window.UtmCapture && UtmCapture.get()) ||
            {};
          await Auth.api('/api/auth/register', {
            method: 'POST',
            body: JSON.stringify({
              name: nameInput.value.trim(),
              email: email.value,
              family_name: familyName.value.trim(),
              password: password.value,
              referral_code: (window.ReferralCapture && ReferralCapture.getCode()) || undefined,
              utm_source: utm.utm_source,
              utm_medium: utm.utm_medium,
              utm_campaign: utm.utm_campaign,
              utm_content: utm.utm_content,
              utm_term: utm.utm_term,
              platform: utm.platform,
              first_touch_at: utm.first_touch_at,
              preferred_locale: (window.I18n && I18n.getCurrentLang()) || 'sv-SE',
              country_code: (window.CountryChoice && CountryChoice.getCountryCode()) || 'SE',
            }),
          });
          if (window.ReferralCapture) ReferralCapture.clear();

          // Auto-login and redirect to onboarding for new parents
          const loginData = await Auth.api('/api/auth/login', {
            method: 'POST',
            body: JSON.stringify({
              email: email.value,
              password: password.value,
            }),
          });
          // Token is in httpOnly cookie (set by server). Pass null for token.
          Auth.setAuth(null, loginData.user, loginData.csrfToken, loginData.expiresAt);
          if (window.MarketingEvents) MarketingEvents.trackSignup('email');
          Auth.redirectToDashboard(); // goes to /onboarding for new accounts
        } catch (error) {
          showError('registerError', error.message || t('auth.errors.serverError'));
        } finally {
          setLoading(submitBtn, false);
        }
      });
    });

    // ─── Apple Sign In handlers ───────────────────────────────
    async function handleAppleRegister() {
      var diag = window.AppleSignInDiagnostics;
      const btn = document.getElementById('appleRegisterBtn');
      const orig = btn ? btn.textContent : '';

      try {
        var pre = (window.RegisterAppleAuth && typeof RegisterAppleAuth.preflight === 'function')
          ? RegisterAppleAuth.preflight(window.Platform, window.CountryChoice)
          : { ok: false, reason: 'unavailable', message: t('auth.login.apple.unavailable') };
        if (!pre.ok) {
          if (window.RegisterAppleAuth && typeof RegisterAppleAuth.applyDeniedPreflight === 'function') {
            RegisterAppleAuth.applyDeniedPreflight(pre, function (msg) {
              showError('appleRegisterError', msg);
            });
          } else {
            showError('appleRegisterError', pre.message || t('auth.login.apple.unavailable'));
          }
          return;
        }
        document.getElementById('appleRegisterError').classList.add('hidden');
        if (diag) diag.log('register_step_1');
        if (btn) {
          btn.disabled = true;
          btn.textContent = t('auth.login.appleLoading');
        }
        const result = await window.Platform.appleSignIn.signIn();
        if (diag) diag.log('register_step_2', { hasIdToken: !!(result && result.idToken) });
        if (!result || result.canceled) {
          document.getElementById('appleRegisterError').classList.add('hidden');
          return;
        }
        if (!result.idToken) {
          showError('appleRegisterError', t('auth.login.apple.incomplete'));
          return;
        }

        const credential = window.AppleAuthSession
          ? AppleAuthSession.fromAuthorizeResult(result)
          : { idToken: result.idToken, name: result.name, authorizationCode: result.authorizationCode || null };
        if (window.AppleAuthSession) AppleAuthSession.remember(credential);

        const applePayload = window.AppleAuthSession
          ? AppleAuthSession.buildRequestBody(credential, { intent: 'register' })
          : Object.assign(
            (window.OAuthRegistrationPayload && OAuthRegistrationPayload.withOAuthRegistrationFields)
              ? OAuthRegistrationPayload.withOAuthRegistrationFields({ idToken: result.idToken, name: result.name })
              : { idToken: result.idToken, name: result.name },
            { intent: 'register' }
          );

        const res = await fetch('/api/auth/apple', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(applePayload),
        });
        const data = await res.json().catch(() => ({}));

        if (res.ok && data.user) {
          if (window.AppleAuthSession) AppleAuthSession.applyAuthenticatedSession(data);
          else Auth.setAuth(null, data.user, data.csrfToken, data.expiresAt);
          if (window.MarketingEvents) MarketingEvents.trackSignup('apple');
          setTimeout(() => {
            if (data.user.onboarding_completed === false) window.location.href = '/onboarding';
            else Auth.redirectToDashboard();
          }, 300);
        } else if (window.AppleAuthSession && AppleAuthSession.isCompletionRequired(res.status, data)) {
          if (window.AppleAuthCompletion) {
            AppleAuthCompletion.hideEmailPasswordIdentityFields();
            AppleAuthCompletion.showPanel(data.missing || []);
          }
        } else if (res.status === 409 && (data.error === 'APPLE_EMAIL_EXISTS' || data.error === 'email_conflict')) {
          showError('appleRegisterError', t('auth.register.appleEmailExists'));
        } else {
          showError('appleRegisterError', data.error || t('auth.login.apple.genericError'));
        }
      } catch (err) {
        if (window.AppleAuthCancel && AppleAuthCancel.isAppleAuthCancellation(err)) {
          document.getElementById('appleRegisterError').classList.add('hidden');
          return;
        }
        var appleMsg = (err && err.message) || '';
        if (appleMsg === 'SIGN_IN_UNAVAILABLE') {
          showError('appleRegisterError', t('auth.login.apple.unavailable'));
        } else if (appleMsg === 'APPLE_SIGN_IN_FAILED') {
          showError('appleRegisterError', t('auth.login.apple.failed'));
        } else {
          showError('appleRegisterError', appleMsg || t('auth.login.apple.signInFailed'));
        }
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = orig;
        }
      }
    }

    document.getElementById('appleCompletionSubmitBtn')?.addEventListener('click', async function () {
      var session = window.AppleAuthSession;
      var credential = session && session.current();
      if (!credential) return;
      var missing = window.AppleAuthCompletion ? AppleAuthCompletion.collectMissing() : [];
      if (missing.length) {
        AppleAuthCompletion.showPanel(missing);
        return;
      }
      const applePayload = session.buildRequestBody(credential, { intent: 'register' });
      const res = await fetch('/api/auth/apple', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify(applePayload),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.user) {
        session.applyAuthenticatedSession(data);
        setTimeout(() => {
          if (data.user.onboarding_completed === false) window.location.href = '/onboarding';
          else if (window.Auth) Auth.redirectToDashboard();
        }, 300);
      } else if (session.isCompletionRequired(res.status, data)) {
        AppleAuthCompletion.showPanel(data.missing || []);
      } else {
        showError('appleRegisterError', data.error || t('auth.login.apple.genericError'));
      }
    });
  </script>
