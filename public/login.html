              </div>
              <div style="margin-bottom:16px;">
                <label style="display:block;color:rgba(255,255,255,0.7);font-size:0.75rem;font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em;" data-i18n="auth.login.linking.emailLabel"></label>
                <input type="email" id="googleLinkEmail" readonly style="width:100%;padding:10px 14px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:rgba(255,255,255,0.5);font-size:0.9rem;box-sizing:border-box;">
              </div>
              <div style="margin-bottom:20px;">
                <label style="display:block;color:rgba(255,255,255,0.7);font-size:0.75rem;font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em;" data-i18n="auth.login.linking.passwordLabel"></label>
                <input type="password" id="googleLinkPassword" placeholder="" data-i18n-placeholder="auth.login.linking.passwordPlaceholder" style="width:100%;padding:10px 14px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:10px;color:#fff;font-size:0.9rem;box-sizing:border-box;">
              </div>
              <div id="googleLinkModalError" class="magic-error-box" style="display:none;margin-bottom:12px;"></div>
              <div style="display:flex;gap:10px;">
                <button type="button" id="googleLinkSubmitBtn" onclick="submitGoogleLink()" style="flex:1;padding:12px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1d1d1f;font-weight:700;font-size:0.95rem;border:none;border-radius:10px;cursor:pointer;" data-i18n="auth.login.linking.submit"></button>
                <button type="button" onclick="closeGoogleLinkModal()" style="flex:1;padding:12px;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.7);font-weight:600;font-size:0.95rem;border:1px solid rgba(255,255,255,0.15);border-radius:10px;cursor:pointer;" data-i18n="auth.login.linking.cancel"></button>
              </div>
            </div>
          </div>

          <div class="magic-divider" style="margin:18px 0;"><span data-i18n="auth.login.orDivider"></span></div>
        </div>

        <div class="my-5 flex justify-center" data-locale-switcher-mount></div>

        <!-- Email/password form — always shown unless Apple-only on iOS -->
        <form id="loginForm" class="magic-form-fields" style="width:100%;" novalidate>
          <div>
            <label for="email" data-i18n="auth.login.email"></label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder=""
              required
              autocomplete="email"
              class="magic-input"
              data-i18n-placeholder="auth.login.emailPlaceholder"
            />
          </div>
          <div>
            <label for="password" data-i18n="auth.login.password"></label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              required
              autocomplete="current-password"
              class="magic-input"
              data-i18n-placeholder="auth.login.passwordPlaceholder"
            />
          </div>

          <!-- Error -->
          <div id="loginError" class="magic-error-box" style="display:none;"></div>

          <button type="submit" id="submitBtn" class="magic-submit-btn touch-btn" data-i18n="auth.login.submit"></button>
        </form>

        <!-- Links below form -->
        <div class="magic-footer-link" style="width:100%;margin-top:0;">
          <a href="/forgot-password" style="color:rgba(255,255,255,0.6);text-decoration:none;font-size:0.8rem;border-bottom:1px solid rgba(255,255,255,0.25);padding-bottom:1px;" data-i18n="auth.login.forgotPassword"></a>
        </div>

        <!-- Registration link -->
        <div id="registerLinkSection" class="magic-footer-link" style="display:none;margin-top:4px;">
          <span data-i18n="auth.login.noAccount"></span>
          <a href="/register" id="entryLoginSignupLink" data-i18n="auth.login.createAccount"></a>
        </div>

        <div class="magic-footer-link" style="width:100%;margin-top:12px;">
          <a href="/child-login" id="childLoginFooterLink" class="touch-btn" style="display:inline-block;color:rgba(255,255,255,0.85);text-decoration:none;font-size:0.9rem;font-weight:600;border-bottom:1px solid rgba(255,255,255,0.35);padding-bottom:2px;" data-i18n="auth.login.childLoginLink"></a>
        </div>

      </div>
      <!-- end parent-login-section -->

      <!-- How it works modal -->
      <div id="entry-how-it-works-modal" class="entry-how-modal hidden" role="dialog" aria-modal="true" aria-labelledby="entryHowTitle">
        <div class="entry-how-sheet">
          <h2 id="entryHowTitle" data-i18n="auth.entry.howItWorks.title"></h2>
          <div class="entry-how-card">
            <strong data-i18n="auth.entry.howItWorks.step1Title"></strong>
            <p data-i18n="auth.entry.howItWorks.step1Body"></p>
          </div>
          <div class="entry-how-card">
            <strong data-i18n="auth.entry.howItWorks.step2Title"></strong>
            <p data-i18n="auth.entry.howItWorks.step2Body"></p>
          </div>
          <div class="entry-how-card">
            <strong data-i18n="auth.entry.howItWorks.step3Title"></strong>
            <p data-i18n="auth.entry.howItWorks.step3Body"></p>
          </div>
          <button type="button" id="entryHowItWorksClose" class="magic-submit-btn touch-btn" style="margin-top:6px;" data-i18n="auth.entry.howItWorks.close"></button>
        </div>
      </div>

    </div>
    <!-- end max-width container -->

  </div>
  <!-- end main content -->

  <!-- ── INLINE AUTH SCRIPT ───────────────────────────────────────────────── -->
  <script>
    function t(key, params) {
      return (window.authT || ((k) => k))(key, params);
    }

    function brandName() {
      if (window.authBrandName) return authBrandName();
      if (window.I18n && I18n.t) return I18n.t('app.name');
      return 'My Starday';
    }

    // Platform detection: installed app = Capacitor native OR PWA with display-mode: standalone
    function isInstalledApp() {
      return (
        (typeof Platform !== 'undefined' && typeof Platform.isNative === 'function' && Platform.isNative()) ||
        (typeof window !== 'undefined' && typeof window.matchMedia === 'function' && window.matchMedia('(display-mode: standalone)').matches)
      );
    }

    /** Safe post-login redirect from ?next= (relative path only). */
    function getLoginNextUrl() {
      var params = new URLSearchParams(window.location.search);
      var next = params.get('next');
      if (!next || !next.startsWith('/') || next.startsWith('//')) return null;
      return next;
    }

    function redirectAfterParentLogin() {
      var diag = window.AppleSignInDiagnostics;
      var pending = sessionStorage.getItem('cl_add_child_pending');
      if (pending === 'new') {
        if (diag && diag.logPost) diag.logPost('step_6_redirect_start', { target: '/onboarding?flow=add-child', via: 'add_child_pending' });
        sessionStorage.removeItem('cl_add_child_pending');
        sessionStorage.removeItem('cl_add_child_next');
        if (window.DeviceMode) DeviceMode.enterParent();
        window.location.href = '/onboarding?flow=add-child';
        return;
      }
      var nextUrl = getLoginNextUrl();
      if (nextUrl) {
        if (diag && diag.logPost) diag.logPost('step_6_redirect_start', { target: nextUrl, via: 'next_param' });
        if (window.DeviceMode) DeviceMode.enterParent();
        window.location.href = nextUrl;
        return;
      }
      if (diag && diag.logPost) diag.logPost('step_6_redirect_start', { target: '(via Auth.redirectToDashboard)', via: 'default' });
      setTimeout(function () { Auth.redirectToDashboard(); }, 300);
    }

    document.addEventListener('DOMContentLoaded', async () => {
      var loginNextUrl = getLoginNextUrl();
      var isAddChildReturn = loginNextUrl && loginNextUrl.indexOf('addChild') !== -1;
      if (window.LoginMagic && LoginMagic.setAddChildReturnMode) {
        LoginMagic.setAddChildReturnMode(isAddChildReturn);
      }

      // Redirect already-logged-in users — but VALIDATE the token first
      // to avoid redirect loops when the token is stale/expired.
      if (Auth.isLoggedIn()) {
        try {
          const res = await window.apiFetch('/api/auth/me');
          if (res.ok) {
            const user = Auth.getUser();
            // Child session: stay in child mode (redirect to child-dashboard, NOT dashboard).
            // Exception: add-child flow needs vuxen — don't bounce back to barnets dashboard.
            if (user && user.type === 'child') {
              if (loginNextUrl && loginNextUrl.indexOf('addChild') !== -1) {
                Auth.clearAuth();
              } else {
                if (window.DeviceMode) DeviceMode.enterChild();
                window.location.href = '/child/today';
                return;
              }
            }
            if (window.SessionGate && window.DeviceMode && DeviceMode.isChildMode()) {
              window.location.href = '/child-login';
              return;
            }
            if (user && (user.isAdmin || user.is_admin)) {
              if (window.DeviceMode) DeviceMode.enterParent();
              window.location.href = loginNextUrl || '/admin';
              return;
            }
            if (window.DeviceMode) DeviceMode.enterParent();
            // Native app: stay on login so user can pick language + role (iOS + Android).
            var isNativeApp = document.documentElement.classList.contains('is-native-android')
              || document.documentElement.classList.contains('platform-ios')
              || (typeof Platform !== 'undefined' && typeof Platform.isNative === 'function' && Platform.isNative());
            var nativeStayOnLogin = isNativeApp && !loginNextUrl;
            if (!nativeStayOnLogin) {
              window.location.href = loginNextUrl || '/dashboard';
              return;
            }
            // Native logged-in: fall through — AppEntry.init must run or UI stays blank (logo only).
          } else {
            Auth.clearAuth();
          }
        } catch {
          Auth.clearAuth();
        }
      }

      // Show registration links if registration is open
      fetch('/api/registration-status')
        .then(r => r.json())
        .then(data => {
          if (data.registration_enabled) {
            const el = document.getElementById('registerLinkSection');
            if (el) el.style.display = '';
            const banner = document.getElementById('registerBanner');
            if (banner) banner.style.display = '';
          }
        })
        .catch(() => {});

      // OAuth sections — platform matrix (auth-login-platform.js)
      if (window.AuthLoginPlatform && typeof AuthLoginPlatform.applyAuthSections === 'function') {
        AuthLoginPlatform.applyAuthSections({ page: 'login' });
      }

      if (isAddChildReturn) {
        var parentSectionEarly = document.getElementById('parent-login-section');
        var addBanner = document.getElementById('addChildLoginBanner');
        if (addBanner) addBanner.classList.remove('hidden');
        var backBtn = parentSectionEarly && parentSectionEarly.querySelector('.magic-back-btn');
        if (backBtn) {
          backBtn.id = 'addChildBackBtn';
          backBtn.textContent = t('auth.login.backToChildPicker');
          backBtn.onclick = function () { window.location.href = '/child-login'; };
        }
      }

      if (window.AppEntry && typeof AppEntry.init === 'function') {
        AppEntry.init();
      }

      const childLoginFooterLink = document.getElementById('childLoginFooterLink');
      if (childLoginFooterLink) {
        childLoginFooterLink.addEventListener('click', function () {
          if (window.DeviceMode && typeof DeviceMode.enterChild === 'function') {
            DeviceMode.enterChild();
          }
        });
      }

      const form     = document.getElementById('loginForm');
      const submitBtn = document.getElementById('submitBtn');
      const email    = document.getElementById('email');
      const password = document.getElementById('password');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        if (!email.value || !password.value) {
          showErrorInline('loginError', t('auth.login.fillEmailPassword'));
          return;
        }

        hideErrorInline('loginError');
        if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = t('auth.login.submitting'); }

        try {
          const res = await window.apiFetch('/api/auth/login', {
            method: 'POST',
            body: JSON.stringify(
              (window.LoginLocale && LoginLocale.withLoginLocale)
                ? LoginLocale.withLoginLocale({
                  email: email.value,
                  password: password.value,
                })
                : {
                  email: email.value,
                  password: password.value,
                }
            ),
          });

          const data = await res.json().catch(() => ({}));

          if (res.ok && data.user) {
            Auth.setAuth(null, data.user, data.csrfToken, data.expiresAt);
            if (window.AppEntry) AppEntry.trackAuthSuccess('email');
            redirectAfterParentLogin();
          } else if (res.status === 403 && data.code === 'EMAIL_VERIFICATION_REQUIRED') {
            showVerificationRequired(data.email || email.value);
          } else {
            if (window.AppEntry) AppEntry.trackAuthFailed('email', data.error || 'login_failed');
            showErrorInline('loginError', data.error || t('auth.login.genericError'));
          }
        } catch (error) {
          if (window.AppEntry) AppEntry.trackAuthFailed('email', error.message || 'network');
          showErrorInline('loginError', error.message || t('auth.login.genericError'));
        } finally {
          if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = t('auth.login.submit'); }
        }
      });
    });

    function showErrorInline(id, msg) {
      const el = document.getElementById(id);
      if (el) { el.textContent = msg; el.style.display = ''; }
    }
    function hideErrorInline(id) {
      const el = document.getElementById(id);
      if (el) { el.style.display = 'none'; }
    }

    /**
     * Show the verification-required blocking state.
     * Replaces the login form with a message + resend button.
     */
    function showVerificationRequired(userEmail) {
      const section = document.getElementById('parent-login-section');
      if (!section) return;
      section.innerHTML = `
        <button onclick="(window.AppEntry && AppEntry.goBack) ? AppEntry.goBack() : LoginMagic.backToRoleSelection()" class="magic-back-btn">${t('auth.entry.backWithArrow')}</button>
        <div style="text-align:center;">
          <div style="font-size:3.5rem;margin-bottom:16px;">📧</div>
          <h2 style="font-family:'Outfit',sans-serif;font-size:1.5rem;font-weight:700;color:#fff;margin-bottom:12px;">
            ${t('auth.login.verify.title')}
          </h2>
          <p style="color:rgba(255,255,255,0.65);font-size:0.9rem;margin-bottom:20px;line-height:1.6;">
            ${t('auth.login.verify.body')}
          </p>
          <div style="background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.15);border-radius:12px;padding:14px;margin-bottom:16px;text-align:left;">
            <p style="font-size:0.78rem;color:rgba(255,255,255,0.5);margin-bottom:4px;">${t('auth.login.verify.emailLabel')}</p>
            <p style="font-weight:600;color:#fff;">${userEmail}</p>
          </div>
          <button id="resendVerifyBtn" onclick="resendFromLogin('${userEmail}')"
            class="magic-submit-btn" style="margin-bottom:12px;">
            ${t('auth.login.verify.resendBtn')}
          </button>
          <p id="resendLoginMessage" style="display:none;font-size:0.85rem;margin-bottom:12px;"></p>
          <p style="font-size:0.75rem;color:rgba(255,255,255,0.4);">${t('auth.login.verify.spamHint')}</p>
        </div>
      `;
    }

    async function resendFromLogin(email) {
      const btn = document.getElementById('resendVerifyBtn');
      const msgEl = document.getElementById('resendLoginMessage');
      btn.disabled = true;
      btn.textContent = t('auth.login.verify.resendSending');

      try {
        const res = await fetch('/api/auth/resend-verification', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email }),
        });
        const data = await res.json().catch(() => ({}));
        msgEl.style.display = '';
        if (res.status === 429) {
          msgEl.textContent = data.error || t('auth.verify.resendRateLimit');
          msgEl.style.color = '#fca5a5';
        } else {
          msgEl.textContent = t('auth.login.verify.resendSuccess');
          msgEl.style.color = '#86efac';
        }
      } catch {
        msgEl.style.display = '';
        msgEl.textContent = t('auth.login.verify.resendError');
        msgEl.style.color = '#fca5a5';
      } finally {
        btn.disabled = false;
        btn.textContent = t('auth.login.verify.resendBtn');
      }
    }

    // ─── Apple Sign In handlers ─────────────────────────────────────────────
    let _applePendingEmail = null;
    let _applePendingIdToken = null;

    async function handleAppleLogin(clickedBtn) {
      var diag = window.AppleSignInDiagnostics;
      if (!diag) {
        console.error('[APPLE] diagnostics module missing');
        return;
      }

      diag.log('step_1_button_pressed', {
        parentVisible: diag.isParentLoginVisible(),
        hasPlatform: !!window.Platform,
      });

      if (!window.Platform) {
        diag.showError(t('auth.login.apple.unavailable'));
        return;
      }

      if (window.AppEntry) AppEntry.trackAuthMethod('apple');
      diag.hideErrors();
      diag.hideLinkingPrompts();

      if (Platform.isIOS() && !Platform.appleSignIn.isAvailable()) {
        diag.log('step_1b_plugin_unavailable');
        diag.showError(t('auth.login.apple.notEnabled'));
        return;
      }

      var btn = diag.getActiveAppleButton(clickedBtn);
      var orig = btn ? btn.textContent : '';
      if (btn) {
        btn.disabled = true;
        btn.textContent = t('auth.login.appleLoading');
      }

      try {
        diag.log('step_2_authorize_start');
        const result = await window.Platform.appleSignIn.signIn();
        diag.log('step_2_authorize_done', {
          hasResult: !!result,
          hasIdToken: !!(result && result.idToken),
        });

        if (!result) {
          diag.showError(t('auth.login.apple.cancelled'));
          return;
        }
        if (!result.idToken) {
          diag.showError(t('auth.login.apple.incomplete'));
          return;
        }

        diag.log('step_3_token_received', { hasName: !!result.name });

        const res = await fetch('/api/auth/apple', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(
            (window.LoginLocale && LoginLocale.withLoginLocale)
              ? LoginLocale.withLoginLocale({ idToken: result.idToken, name: result.name })
              : { idToken: result.idToken, name: result.name }
          ),
        });
        const data = await res.json().catch(() => ({}));
        diag.log('step_4_backend_response', { status: res.status, error: data.error || null });

        if (res.ok && data.user) {
          Auth.setAuth(null, data.user, data.csrfToken, data.expiresAt);
          if (window.AppEntry) AppEntry.trackAuthSuccess('apple');
          diag.startPostLoginTrace();
          diag.log('step_5_login_complete', { onboarding_completed: data.user.onboarding_completed });
          diag.logPost('step_5b_session_after_setAuth', {});
          if (data.user.onboarding_completed === false) {
            diag.logPost('step_6_redirect_start', { target: '/onboarding', via: 'onboarding_required' });
            setTimeout(() => { window.location.href = '/onboarding'; }, 300);
          } else {
            redirectAfterParentLogin();
          }
        } else if (res.status === 201 && data.user) {
          Auth.setAuth(null, data.user, data.csrfToken, data.expiresAt);
          if (window.Pixel) window.Pixel.lead();
          if (window.MarketingEvents) MarketingEvents.trackSignup('apple');
          if (window.AppEntry) {
            AppEntry.trackAuthSuccess('apple');
            AppEntry.track('signup_completed', { method: 'apple' });
          }
          diag.startPostLoginTrace();
          diag.log('step_5_login_complete', { scenario: 'created', onboarding_completed: data.user.onboarding_completed });
          diag.logPost('step_5b_session_after_setAuth', {});
          diag.logPost('step_6_redirect_start', { target: '/onboarding', via: 'new_account' });
          setTimeout(() => window.location.href = '/onboarding', 300);
        } else if (res.status === 409 && data.error === 'email_conflict') {
          _applePendingEmail = data.email;
          _applePendingIdToken = result.idToken;
          diag.log('step_4b_email_conflict');
          diag.showLinkingPrompt();
        } else if (res.status === 429) {
          if (window.AppEntry) AppEntry.trackAuthFailed('apple', 'rate_limited');
          diag.showError(data.error || t('auth.login.apple.rateLimited'));
        } else {
          if (window.AppEntry) AppEntry.trackAuthFailed('apple', data.error || 'login_failed');
          diag.showError(data.error || t('auth.login.apple.genericError'));
        }
      } catch (err) {
        var appleMsg = (err && err.message) || '';
        diag.log('step_error', { message: appleMsg });
        if (window.AppEntry) AppEntry.trackAuthFailed('apple', appleMsg || 'exception');
        if (appleMsg === 'APPLE_SIGN_IN_FAILED') {
          diag.showError(t('auth.login.apple.failed'));
        } else {
          diag.showError(appleMsg || t('auth.login.apple.signInFailed'));
        }
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = orig;
        }
      }
    }

    function openAppleLinkModal() {
      if (!_applePendingEmail) return;
      document.getElementById('appleLinkEmail').value = _applePendingEmail;
      document.getElementById('appleLinkPassword').value = '';
      document.getElementById('appleLinkModalError').style.display = 'none';
      document.getElementById('appleLinkModal').classList.remove('hidden');
      setTimeout(() => document.getElementById('appleLinkPassword').focus(), 50);
    }

    function closeAppleLinkModal() {
      document.getElementById('appleLinkModal').classList.add('hidden');
    }

    // Allow Enter key in password field
    document.getElementById('appleLinkPassword')?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitAppleLink();
    });

    async function submitAppleLink() {
      if (!_applePendingEmail || !_applePendingIdToken) return;
      const password = document.getElementById('appleLinkPassword').value;
      if (!password) {
        document.getElementById('appleLinkModalError').textContent = t('auth.login.linking.enterPassword');
        document.getElementById('appleLinkModalError').style.display = 'block';
        return;
      }

      const btn = document.getElementById('appleLinkSubmitBtn');
      btn.disabled = true;
      btn.textContent = t('auth.login.linking.submitting');

      try {
        const loginRes = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(
            (window.LoginLocale && LoginLocale.withLoginLocale)
              ? LoginLocale.withLoginLocale({ email: _applePendingEmail, password })
              : { email: _applePendingEmail, password }
          ),
        });
        const loginData = await loginRes.json().catch(() => ({}));
        if (!loginRes.ok) {
          document.getElementById('appleLinkModalError').textContent = loginData.error || t('auth.login.linking.wrongPassword');
          document.getElementById('appleLinkModalError').style.display = 'block';
          return;
        }

        const linkRes = await fetch('/api/auth/apple/link', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRF-Token': loginData.csrfToken,
          },
          credentials: 'include',
          body: JSON.stringify({ idToken: _applePendingIdToken }),
        });
        const linkData = await linkRes.json().catch(() => ({}));
        if (!linkRes.ok) {
          document.getElementById('appleLinkModalError').textContent = linkData.error || t('auth.login.linking.failed');
          document.getElementById('appleLinkModalError').style.display = 'block';
          return;
        }

        Auth.setAuth(null, loginData.user, loginData.csrfToken, loginData.expiresAt);
        closeAppleLinkModal();
        dismissAppleLinking();
        redirectAfterParentLogin();
      } catch {
        document.getElementById('appleLinkModalError').textContent = t('auth.login.linking.failed');
        document.getElementById('appleLinkModalError').style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = t('auth.login.linking.submit');
      }
    }

    function dismissAppleLinking() {
      if (window.AppleSignInDiagnostics) {
        AppleSignInDiagnostics.hideLinkingPrompts();
      } else {
        document.getElementById('appleLinkingPrompt')?.classList.add('hidden');
      }
      _applePendingEmail = null;
      _applePendingIdToken = null;
    }
  </script>
