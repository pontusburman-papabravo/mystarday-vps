<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta property="og:title" content="My Starday">
    <meta property="og:description" content="Visual schedules, activities and rewards for families">
    <meta property="og:type" content="website">
    <meta property="og:image" content="[REDACTED]/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="[REDACTED]/og-image.png">
  <title>My Starday</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/tailwind.build.css?v=1">
    <script src="/js/auth.js?v=2.13.0"></script>
  <script src="/js/auth-entry-failsafe.js?v=3"></script>
  <script src="/js/i18n.js?v=2.12.0"></script>
  <script src="/js/locale-switcher.js?v=4"></script>
  <script src="/js/auth-entry-i18n.js?v=2"></script>
  <!-- PWA / Favicon -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F5A623">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="[REDACTED]">
  <style>
    .auth-reset-shell {
      min-height: 100dvh;
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 8rem);
    }
    .auth-reset-input:focus {
      scroll-margin-top: 5rem;
      scroll-margin-bottom: 10rem;
    }
  </style>
  <!-- Cookie banner -->
  <script src="/js/cookie-banner.js?v=2.12.0"></script>
</head>
<body class="bg-white font-body text-navy" data-i18n-title="auth.resetPassword.pageTitle" data-i18n-manual-init="true">
  <noscript>
    <p class="auth-entry-noscript" data-i18n="auth.entry.noscript">JavaScript required — enable JavaScript to use sign-in. / JavaScript krävs — aktivera JavaScript för att logga in.</p>
  </noscript>
  <div id="auth-entry-fallback" hidden class="auth-entry-fallback" role="alert" aria-live="assertive">
    <div>
      <p><strong>Page did not load fully</strong></p>
      <p>Refresh the page or <a href="javascript:location.reload()">try again</a>.</p>
    </div>
  </div>

  <div class="auth-reset-shell flex items-start justify-center px-4 pt-8 sm:items-center sm:py-8">
    <div class="w-full max-w-md">
      <!-- Header -->
      <div class="text-center mb-8">
        <div class="text-4xl mb-3">⭐</div>
        <h1 class="text-3xl font-heading font-bold text-navy mb-2">[REDACTED]</h1>
        <p class="text-text-soft" data-i18n="auth.resetPassword.subtitle"></p>
        <div class="mt-4 flex justify-center" data-locale-switcher-mount></div>
      </div>

      <!-- Form Card -->
      <div id="resetCard" class="bg-sky rounded-2xl p-8 shadow-sm">
        <form id="resetForm" class="space-y-8" novalidate>
          <!-- New Password Field -->
          <div>
            <label for="password" class="block text-sm font-semibold text-navy mb-2" data-i18n="auth.resetPassword.password"></label>
            <input
              type="password"
              id="password"
              name="new-password"
              placeholder=""
              data-i18n-placeholder="auth.resetPassword.passwordPlaceholder"
              required
              minlength="8"
              autocomplete="new-password"
              enterkeyhint="next"
              class="auth-reset-input w-full px-4 py-3 rounded-lg border-2 border-lavender focus:border-gold focus:outline-none bg-white text-navy placeholder-text-soft transition-colors min-h-[44px]"
            />
            <p class="text-xs text-text-soft mt-1" data-i18n="auth.resetPassword.passwordHelp"></p>
          </div>

          <!-- Confirm Password Field -->
          <div>
            <label for="confirmPassword" class="block text-sm font-semibold text-navy mb-2" data-i18n="auth.resetPassword.confirmPassword"></label>
            <input
              type="password"
              id="confirmPassword"
              name="confirm-password"
              placeholder="••••••••"
              required
              autocomplete="new-password"
              enterkeyhint="done"
              class="auth-reset-input w-full px-4 py-3 rounded-lg border-2 border-lavender focus:border-gold focus:outline-none bg-white text-navy placeholder-text-soft transition-colors min-h-[44px]"
            />
          </div>

          <!-- Error Message -->
          <div id="resetError" class="hidden bg-coral border-l-4 border-red-500 p-4 rounded">
            <p id="resetErrorText" class="text-sm text-navy"></p>
            <a id="resetNewLink" href="/forgot-password" class="hidden mt-2 inline-block text-gold font-semibold hover:underline text-sm" data-i18n="auth.resetPassword.requestNewLink"></a>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            id="submitBtn"
            class="w-full bg-gold hover:bg-yellow-500 text-white font-semibold py-3 rounded-lg transition-colors duration-200 min-h-[44px]"
            data-i18n="auth.resetPassword.submit"
          ></button>
        </form>

        <!-- Success Message -->
        <div id="resetSuccess" class="hidden bg-mint border-l-4 border-green-500 p-4 rounded text-center">
          <p class="text-sm text-navy mb-4" data-i18n="auth.resetPassword.successRedirect"></p>
          <a id="resetLoginBtn" href="/login?reset=1" class="inline-flex items-center justify-center min-h-[44px] px-6 py-3 bg-gold hover:bg-yellow-500 text-white font-semibold rounded-lg transition-colors" data-i18n="auth.resetPassword.loginLink"></a>
        </div>

        <!-- Used-link Message -->
        <div id="resetUsed" class="hidden bg-mint border-l-4 border-green-500 p-4 rounded text-center">
          <p class="text-sm text-navy mb-4" data-i18n="auth.resetPassword.alreadyUsed"></p>
          <a href="/login?reset=1" class="inline-flex items-center justify-center min-h-[44px] px-6 py-3 bg-gold hover:bg-yellow-500 text-white font-semibold rounded-lg transition-colors" data-i18n="auth.resetPassword.loginLink"></a>
        </div>

        <!-- Back to Login Link -->
        <div id="resetBackLink" class="text-center mt-6">
          <p class="text-text-soft text-sm">
            <span data-i18n="auth.resetPassword.rememberPassword"></span>
            <a href="/login" class="text-gold font-semibold hover:underline" data-i18n="auth.resetPassword.goToLoginInline"></a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const RESET_DONE_KEY = 'sd_password_reset_done';
    const LOGIN_URL = '/login?reset=1';

    function t(key, params) {
      return (window.authT || ((k) => k))(key, params);
    }

    function redirectToLogin() {
      try {
        sessionStorage.setItem(RESET_DONE_KEY, '1');
      } catch (_) { /* ignore */ }
      window.location.replace(LOGIN_URL);
    }

    function resumeAfterReset() {
      try {
        if (sessionStorage.getItem(RESET_DONE_KEY) === '1') {
          sessionStorage.removeItem(RESET_DONE_KEY);
          window.location.replace(LOGIN_URL);
          return true;
        }
      } catch (_) { /* ignore */ }
      return false;
    }

    window.addEventListener('pageshow', () => {
      resumeAfterReset();
    });

    function showError(elementId, message, showNewLink) {
      const el = document.getElementById(elementId);
      const textEl = document.getElementById('resetErrorText');
      if (textEl) textEl.textContent = message;
      const newLinkEl = document.getElementById('resetNewLink');
      if (newLinkEl) {
        if (showNewLink) newLinkEl.classList.remove('hidden');
        else newLinkEl.classList.add('hidden');
      }
      if (el) el.classList.remove('hidden');
    }

    function hideError(elementId) {
      const el = document.getElementById(elementId);
      if (el) el.classList.add('hidden');
      const newLinkEl = document.getElementById('resetNewLink');
      if (newLinkEl) newLinkEl.classList.add('hidden');
    }

    function hideForm() {
      const form = document.getElementById('resetForm');
      if (form) form.classList.add('hidden');
      const back = document.getElementById('resetBackLink');
      if (back) back.classList.add('hidden');
    }

    function showUsedLinkState() {
      hideForm();
      hideError('resetError');
      const used = document.getElementById('resetUsed');
      if (used) used.classList.remove('hidden');
    }

    function showSuccessState() {
      hideForm();
      hideError('resetError');
      const success = document.getElementById('resetSuccess');
      if (success) success.classList.remove('hidden');
    }

    function setLoading(button, isLoading) {
      if (!button) return;
      button.disabled = isLoading;
      if (!button.dataset.defaultLabel) {
        button.dataset.defaultLabel = button.textContent || t('auth.resetPassword.submit');
      }
      button.textContent = isLoading
        ? t('auth.resetPassword.submitting')
        : button.dataset.defaultLabel;
    }

    function bindFocusScroll() {
      document.querySelectorAll('.auth-reset-input').forEach((input) => {
        input.addEventListener('focus', () => {
          window.requestAnimationFrame(() => {
            try {
              input.scrollIntoView({ block: 'center', behavior: 'smooth' });
            } catch (_) {
              input.scrollIntoView(true);
            }
          });
        });
      });
    }

    function initResetPasswordForm() {
      if (resumeAfterReset()) return;

      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');

      if (!token) {
        showError('resetError', t('auth.resetPassword.invalidLink'), true);
        hideForm();
        return;
      }

      const form = document.getElementById('resetForm');
      const submitBtn = document.getElementById('submitBtn');
      bindFocusScroll();

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password.length < 8) {
          showError('resetError', t('auth.errors.passwordTooShort'));
          return;
        }

        if (password !== confirmPassword) {
          showError('resetError', t('auth.errors.passwordMismatch'));
          return;
        }

        hideError('resetError');
        setLoading(submitBtn, true);

        try {
          const response = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              token,
              password,
            }),
          });

          const data = await response.json().catch(() => ({}));

          if (!response.ok) {
            const err = new Error(data.error || data.message || t('auth.resetPassword.resetFailed'));
            err.code = data.code;
            throw err;
          }

          showSuccessState();
          redirectToLogin();
        } catch (error) {
          if (error.code === 'INVALID_RESET_LINK') {
            showUsedLinkState();
            return;
          }
          showError('resetError', error.message);
        } finally {
          setLoading(submitBtn, false);
        }
      });
    }

    function startResetPasswordForm() {
      if (window.authEntryI18nBootstrapped) {
        initResetPasswordForm();
        return;
      }
      window.setTimeout(startResetPasswordForm, 50);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startResetPasswordForm);
    } else {
      startResetPasswordForm();
    }
  </script>
  <!-- Support bubble for logged-out users -->
  <script src="/js/support-bubble.js?v=2.13.0"></script>
  <!-- Service Worker Registration (update detection in /js/sw-register.js) -->
  <script src="/js/sw-register.js?v=2.12.0"></script>
</body>
</html>
