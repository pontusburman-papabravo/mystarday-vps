<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Svara oss</title>
  <link rel="stylesheet" href="/css/landing.css?v=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    body { background: var(--cream); }
    .kontakt-page { max-width: 560px; margin: 0 auto; padding: 6rem 1.5rem 4rem; }
    .kontakt-page h1 { font-size: 2.2rem; color: var(--navy); margin-bottom: 0.5rem; }
    .kontakt-page .intro { color: var(--text-2); margin-bottom: 2rem; line-height: 1.65; }
    .contact-form-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 2rem;
      box-shadow: 0 8px 32px rgba(28, 35, 64, 0.06);
    }
    .contact-form-card label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: 0.4rem;
    }
    .contact-form-card textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 2px solid rgba(28, 35, 64, 0.1);
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      margin-bottom: 1rem;
      background: var(--cream);
      min-height: 140px;
      resize: vertical;
    }
    .contact-form-card textarea:focus {
      outline: none;
      border-color: var(--amber);
    }
    .contact-error {
      display: none;
      background: #FDEAE7;
      border-left: 4px solid #ef4444;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.88rem;
      color: var(--navy);
      margin-bottom: 1rem;
    }
    .contact-success { display: none; text-align: center; padding: 2rem 1rem; }
  </style>
</head>
<body>
  <div class="kontakt-page">
    <h1>Svara oss</h1>
    <p class="intro">Skriv här så hamnar svaret i samma ärende. Ett vanligt mejlsvar till vår supportadress syns inte i inkorgen.</p>
    <div class="contact-form-card">
      <div class="contact-error" id="followUpError"></div>
      <form id="followUpForm" novalidate>
        <input type="hidden" id="followUpToken" name="token">
        <label for="followUpMessage">Ditt svar</label>
        <textarea id="followUpMessage" name="message" required minlength="10" placeholder="Skriv vad som händer…"></textarea>
        <button type="submit" class="btn-primary" id="followUpSubmit" style="width:100%;min-height:44px;">Skicka</button>
      </form>
      <div class="contact-success" id="followUpSuccess">
        <h2 style="font-family:'Fraunces',serif;font-size:1.3rem;color:var(--navy);margin-bottom:0.5rem;">Tack!</h2>
        <p style="color:var(--text-2);font-size:0.92rem;">Vi har tagit emot svaret i samma ärende.</p>
      </div>
    </div>
  </div>
  <script src="/js/support-follow-up.js?v=1"></script>
</body>
</html>
