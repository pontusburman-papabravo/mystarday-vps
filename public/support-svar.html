<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Ditt ärende</title>
  <link rel="stylesheet" href="/css/landing.css?v=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    body { background: var(--cream); }
    .kontakt-page { max-width: 560px; margin: 0 auto; padding: 6rem 1.5rem 4rem; }
    .kontakt-page h1 { font-size: 2.2rem; color: var(--navy); margin-bottom: 0.5rem; }
    .kontakt-page .intro { color: var(--text-2); margin-bottom: 1.5rem; line-height: 1.65; }
    .contact-form-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 1.5rem;
      box-shadow: 0 8px 32px rgba(28, 35, 64, 0.06);
    }
    .thread { display: flex; flex-direction: column; gap: 0.85rem; margin-bottom: 1.5rem; }
    .thread-empty { color: var(--text-2); font-size: 0.92rem; }
    .thread-msg { border-radius: 16px; padding: 0.85rem 1rem; }
    .thread-msg--you { background: var(--cream); border: 1px solid rgba(28, 35, 64, 0.08); }
    .thread-msg--us { background: var(--amber-lt); border: 1px solid rgba(196, 133, 26, 0.18); }
    .thread-meta { font-size: 0.75rem; font-weight: 600; color: var(--text-2); margin: 0 0 0.35rem; }
    .thread-body { color: var(--navy); font-size: 0.95rem; line-height: 1.55; white-space: pre-wrap; }
    .contact-form-card label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: 0.4rem;
    }
    .contact-form-card textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 2px solid rgba(28, 35, 64, 0.1);
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      margin-bottom: 1rem;
      background: var(--cream);
      min-height: 120px;
      resize: vertical;
    }
    .contact-form-card textarea:focus {
      outline: none;
      border-color: var(--amber);
    }
    .contact-error {
      display: none;
      background: #FDEAE7;
      border-left: 4px solid #ef4444;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.88rem;
      color: var(--navy);
      margin-bottom: 1rem;
    }
    .contact-success {
      display: none;
      color: var(--navy);
      font-size: 0.9rem;
      margin: 0 0 0.85rem;
    }
  </style>
</head>
<body>
  <div class="kontakt-page">
    <h1>Ditt ärende</h1>
    <p class="intro">Här är hela konversationen. Skriv under om du vill fortsätta. Ett vanligt mejlsvar syns inte här.</p>
    <div class="contact-error" id="followUpError"></div>
    <div id="supportThread" class="thread" hidden></div>
    <div class="contact-form-card" id="supportComposer" hidden>
      <p class="contact-success" id="followUpSuccess">Skickat. Vi ser det i samma ärende.</p>
      <form id="followUpForm" novalidate>
        <input type="hidden" id="followUpToken" name="token">
        <label for="followUpMessage">Skriv till oss</label>
        <textarea id="followUpMessage" name="message" required minlength="10" placeholder="Skriv vad som händer…"></textarea>
        <button type="submit" class="btn-primary" id="followUpSubmit" style="width:100%;min-height:44px;">Skicka</button>
      </form>
    </div>
  </div>
  <script src="/js/support-follow-up.js?v=2"></script>
</body>
</html>
