<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="canonical" href="__SITE_URL__/en/contact">
  <link rel="alternate" hreflang="sv" href="__SITE_URL__/kontakt">
  <link rel="alternate" hreflang="en" href="__SITE_URL__/en/contact">
  <link rel="alternate" hreflang="x-default" href="__SITE_URL__/">
  <title>Contact us — My Starday</title>
  <meta name="description" content="Questions about My Starday? Write to us and we'll get back to you.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/landing.css?v=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/js/cookie-banner.js?v=2.13.2"></script>
  <script src="/js/public-lang-switcher.js?v=2"></script>
  <style>
    body { background: var(--cream); }
    .kontakt-page { max-width: 560px; margin: 0 auto; padding: 6rem 1.5rem 4rem; }
    .kontakt-page h1 { font-size: 2.2rem; color: var(--navy); margin-bottom: 0.5rem; }
    .kontakt-page .intro { color: var(--text-2); margin-bottom: 2rem; line-height: 1.65; }
    .contact-form-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 2rem;
      box-shadow: 0 8px 32px rgba(28, 35, 64, 0.06);
    }
    .contact-form-card label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: 0.4rem;
    }
    .contact-form-card input,
    .contact-form-card textarea {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 2px solid rgba(28, 35, 64, 0.1);
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      margin-bottom: 1rem;
      background: var(--cream);
    }
    .contact-form-card input:focus,
    .contact-form-card textarea:focus {
      outline: none;
      border-color: var(--amber);
    }
    .contact-form-card textarea { min-height: 140px; resize: vertical; }
    .contact-error {
      display: none;
      background: #FDEAE7;
      border-left: 4px solid #ef4444;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.88rem;
      color: var(--navy);
      margin-bottom: 1rem;
    }
    .contact-success {
      display: none;
      text-align: center;
      padding: 2rem 1rem;
    }
    .contact-success-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-2);
      text-decoration: none;
      margin-bottom: 1.5rem;
    }
    .back-home:hover { color: var(--amber-dk); }
  </style>
</head>
<body>
  <div class="kontakt-page">
    <a href="/en" class="back-home">← Back to home</a>
    <h1>Contact us</h1>
    <p class="intro">Have questions, feedback, or want to know more about My Starday? Write to us and we'll get back to you as soon as we can.</p>

    <div class="contact-form-card">
      <div class="contact-error" id="contactError"></div>
      <form id="contactForm" novalidate>
        <label for="contactName">Name</label>
        <input type="text" id="contactName" name="name" placeholder="Your name" required autocomplete="name">

        <label for="contactEmail">Email</label>
        <input type="email" id="contactEmail" name="email" placeholder="you@email.com" required autocomplete="email">

        <label for="contactMessage">Message</label>
        <textarea id="contactMessage" name="message" placeholder="Write your message here…" required></textarea>

        <button type="submit" class="btn-primary" id="contactSubmitBtn" style="width:100%;">Send</button>
      </form>
      <div class="contact-success" id="contactSuccess">
        <div class="contact-success-icon">✅</div>
        <h2 style="font-family:'Fraunces',serif;font-size:1.3rem;color:var(--navy);margin-bottom:0.5rem;">Thanks for your message!</h2>
        <p style="color:var(--text-2);font-size:0.92rem;">We've received your message and will get back to you as soon as we can.</p>
      </div>
    </div>

    <p style="text-align:center;margin-top:2rem;font-size:0.85rem;color:var(--text-3);">
      You can also email us directly at <a href="__SITE_URL__" style="color:var(--amber-dk);font-weight:600;">__SITE_URL__</a>
    </p>
  </div>
  <script src="/js/contact-form.js?v=1"></script>
  <script src="/js/sw-register.js?v=2.13.0"></script>
</body>
</html>
