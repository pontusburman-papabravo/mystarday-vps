<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Program och paket — My Starday</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/theme.css?v=2.12.0">
  <link rel="stylesheet" href="/css/program-catalog.css?v=1.0.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body class="font-body text-navy program-catalog-page px-4 py-8 pb-16">
  <div class="max-w-3xl mx-auto">
    <a href="/#program" id="backLink" class="inline-flex items-center gap-2 text-text-soft hover:text-navy text-sm mb-6 no-underline">
      ← Tillbaka till startsidan
    </a>

    <header class="text-center mb-10">
      <div class="w-16 h-16 bg-gold rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl shadow-lg">⭐</div>
      <h1 id="pageTitle" class="font-heading font-bold text-2xl md:text-3xl leading-tight mb-3">Program och paket</h1>
      <p id="pageIntro" class="text-text-soft text-base leading-relaxed max-w-2xl mx-auto">Laddar…</p>
    </header>

    <p id="founderNote" class="program-founder-note mb-8"></p>

    <div id="programCards" class="grid gap-5 mb-10"></div>

    <section class="program-matrix-section mb-10" aria-labelledby="matrixTitle">
      <h2 id="matrixTitle" class="font-heading font-bold text-xl mb-4 text-center">Vad ingår var?</h2>
      <div class="program-matrix-scroll">
        <table id="comparisonMatrix" class="program-matrix w-full text-sm">
          <thead>
            <tr id="matrixHeadRow"></tr>
          </thead>
          <tbody id="matrixBody"></tbody>
        </table>
      </div>
    </section>

    <p id="addonNote" class="text-text-soft text-sm text-center leading-relaxed mb-8"></p>

    <div class="text-center">
      <a href="/register" id="ctaRegister" class="inline-block w-full max-w-md py-4 px-6 bg-gold hover:bg-yellow-500 text-navy font-bold text-lg rounded-xl shadow-lg no-underline mb-3">
        Skapa konto gratis
      </a>
      <a href="/login" class="block text-text-soft hover:text-navy text-sm no-underline">
        Har du redan konto? Logga in
      </a>
    </div>
  </div>

  <script src="/js/platform.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/program-catalog-render.js?v=1.0.0"></script>
  <script src="/js/preview-guest.js?v=1.0.0"></script>
  <script src="/js/pricing-info.js?v=2.0.0"></script>
  <script src="/js/landing-newsletter.js?v=1.0.0"></script>
</body>
</html>
