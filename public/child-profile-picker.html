<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Välj profil | My Starday</title>
  <link rel="stylesheet" href="/css/tailwind.build.css?v=1">
  <link rel="stylesheet" href="/css/child-login-magic.css?v=154">
  <link rel="stylesheet" href="/css/theme.css?v=2.12.0">
  <script src="/js/platform.js?v=1.0.0"></script>
  <script src="/js/auth.js?v=2.23.0"></script>
  <script src="/js/child-session-context.js?v=1.0.0"></script>
  <script src="/js/trusted-device-bootstrap.js?v=1.0.0"></script>
  <script src="/js/app-entry-orchestrator.js?v=1.0.0"></script>
  <script src="/js/app-entry-analytics.js?v=284"></script>
  <script src="/js/member-avatar.js?v=1.0.0"></script>
  <script src="/js/adult-pin-gate-ui.js?v=1.0.0"></script>
  <script src="/js/trusted-select-parent-diag.js?v=1.0.0"></script>
  <script src="/js/adult-privilege.js?v=1.2.1"></script>
  <script src="/js/child-profile-picker.js?v=1.4.0"></script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    .cpp-picker-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
      width: 100%;
      max-width: 24rem;
      margin: 0 auto;
      padding: 0 1rem 2rem;
    }
    .cpp-profile-card {
      min-height: 11rem;
      border-radius: 1.25rem;
      border: 3px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 1.25rem 1rem;
      font-weight: 700;
      font-size: 1.125rem;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .cpp-profile-card-parent {
      border-color: rgba(255, 215, 0, 0.45);
      background: rgba(255, 255, 255, 0.08);
    }
    .cpp-profile-name {
      text-align: center;
      line-height: 1.2;
    }
    .cpp-profile-hint {
      font-size: 0.75rem;
      font-weight: 600;
      opacity: 0.85;
    }
    .cpp-profile-card:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }
    .cpp-profile-card:active { transform: scale(0.98); }
    .cpp-avatar {
      font-size: 3.5rem;
      line-height: 1;
    }
    .cpp-avatar-adult {
      font-size: 2.75rem;
    }
    .cpp-avatar-img {
      width: 4.5rem;
      height: 4.5rem;
      border-radius: 0.75rem;
      object-fit: cover;
    }
    .cpp-fallback-link {
      display: block;
      margin-top: 2rem;
      text-align: center;
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.75);
      text-decoration: underline;
    }
    .cpp-fallback-btn {
      background: none;
      border: none;
      cursor: pointer;
      font: inherit;
      width: 100%;
      min-height: 44px;
      padding: 0.5rem 1rem;
    }
  </style>
</head>
<body class="child-login-magic-bg safe-area-top safe-area-bottom">
  <main class="child-login-layout" role="main">
    <header class="child-login-header">
      <div style="width:80px;"></div>
      <div class="cl-logo"><span class="cl-logo-star">⭐</span><span>My Starday</span></div>
      <div style="width:80px;"></div>
    </header>
    <section class="cl-step active" aria-labelledby="cppTitle">
      <h1 id="cppTitle" class="cl-select-title">Vem använder appen?</h1>
      <p id="cppSub" class="cl-select-sub">Tryck på din profil</p>
      <div id="cppError" class="cl-error-box hidden" role="alert"></div>
      <div id="cppGrid" class="cpp-picker-grid" role="list"></div>
      <a id="cppLegacyLink" class="cpp-fallback-link hidden" href="/child-login">Logga in med användarnamn och PIN</a>
      <button type="button" id="cppParentBackupLink" class="cpp-fallback-link cpp-fallback-btn">
        Logga in som vuxen med e-post eller Apple/Google
      </button>
    </section>
  </main>
</body>
</html>
