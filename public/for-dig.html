<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>För dig</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="/js/dom-utils.js?v=2.12.0"></script>
    <link rel="stylesheet" href="/css/tailwind.build.css?v=1">
    <link rel="stylesheet" href="/css/theme.css?v=2.13.0">
  <link rel="stylesheet" href="/css/mobile-nav.css?v=2.13.0">
  <link rel="stylesheet" href="/css/parent-bottom-nav.css?v=12">
  <link rel="stylesheet" href="/css/parent-magic-3d.css?v=1">
  <link rel="stylesheet" href="/css/parent-magic-common.css?v=12">
  <link rel="stylesheet" href="/css/app-view-toggle.css?v=12">
  <link rel="stylesheet" href="/css/dashboard-warmth.css?v=2026-06-10-copy">
  <link rel="stylesheet" href="/css/for-dig.css?v=2">
  <link rel="stylesheet" href="/css/for-dig-goal-badge.css?v=1">
  <script src="/js/theme.js?v=2.12.0"></script>
  <script src="/js/auth.js?v=2.13.0"></script>
  <script src="/js/toast.js?v=2.12.0"></script>
  <style>
    html, body { overflow-x: clip; max-width: 100%; }
    .sidebar-nav a { display: block; padding: 10px 16px; min-height: 44px; }
  </style>
</head>
<body class="font-body bg-sky min-h-screen flex flex-col md:flex-row for-dig-page" data-magic-page="for-dig">
  <nav id="sidebar" class="hidden md:block w-full md:w-64 bg-navy text-white p-4 md:p-6 md:min-h-screen parent-magic-legacy-hide">
    <a href="/dashboard" class="hidden md:flex items-center gap-3 mb-8 no-underline text-white hover:text-white">
      <span class="text-2xl">⭐</span>
      <h1 class="text-xl font-heading font-bold">Min Stjärndag</h1>
    </a>
    <ul class="space-y-2"></ul>
    <div class="mt-8 pt-4 border-t border-navy-soft">
      <button id="logoutBtn" class="w-full px-4 py-2 bg-coral hover:bg-red-200 text-navy rounded-lg font-semibold transition-colors">Logga ut</button>
    </div>
  </nav>

  <main class="flex-1 flex flex-col min-h-screen pb-20 md:pb-4">
    <div id="appViewToggleMount" class="app-view-toggle-wrap"></div>
    <div id="parentMagicPageMount" class="hidden" aria-live="polite"></div>
    <div class="bg-sky border-b border-lavender p-4 md:p-6 parent-magic-legacy-hide">
      <p id="forDigGreeting" class="for-dig-greeting">Hej 👋</p>
      <p class="for-dig-focus">Vad vill du fokusera på just nu?</p>
    </div>

    <div class="flex-1 p-4 md:p-8 overflow-auto">
      <div id="forDigFavorites" class="mb-4"></div>
      <div id="forDigMostInstalled"></div>
      <div id="forDigRecommendations"></div>
      <div id="forDigGoals" class="space-y-4 mt-4">
        <p class="text-text-soft text-center py-8">Laddar…</p>
      </div>
      <p class="text-center mt-8">
        <a href="/library" id="forDigLibraryLink" class="text-gold font-semibold underline">Visa hela biblioteket →</a>
      </p>
    </div>
  </main>

  <script src="/js/sw-register.js?v=2.12.0"></script>
  <script src="/js/mobile-nav.js?v=2.13.0"></script>
  <script src="/js/nav-config.js?v=1"></script>
  <script src="/js/app-view-mode.js?v=4"></script>
  <script src="/js/parent-magic-page-hubs.js?v=1"></script>
  <script src="/js/parent-magic-auto.js?v=12"></script>
  <script src="/js/parent-magic-shell.js?v=1"></script>
  <script src="/js/parent-magic-bootstrap.js?v=12"></script>
  <script src="/js/for-dig.js?v=2.7"></script>
  <script src="/js/parent-nav-sidebar.js?v=1"></script>
  <script>
    document.getElementById('logoutBtn')?.addEventListener('click', () => Auth.logout());
    Auth.requireAuth();
  </script>
</body>
</html>
