<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>För dig</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="/js/dom-utils.js?v=2.12.0"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gold: '#F5A623', 'gold-light': '#FFF3D6', navy: '#1B2340', 'navy-soft': '#2A3458',
            sky: '#E8F0FE', lavender: '#EDE7F6', mint: '#E0F5EC', coral: '#FDEAE7', 'text-soft': '#5A6178',
          },
          fontFamily: { heading: ['Outfit', 'sans-serif'], body: ['Plus Jakarta Sans', 'sans-serif'] },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="/css/theme.css?v=2.13.0">
  <link rel="stylesheet" href="/css/mobile-nav.css?v=2.13.0">
  <link rel="stylesheet" href="/css/parent-bottom-nav.css?v=2">
  <link rel="stylesheet" href="/css/parent-magic-3d.css?v=1">
  <link rel="stylesheet" href="/css/parent-magic-common.css?v=4">
  <link rel="stylesheet" href="/css/app-view-toggle.css?v=5">
  <link rel="stylesheet" href="/css/dashboard-warmth.css?v=2026-06-10-copy">
  <link rel="stylesheet" href="/css/for-dig.css?v=2">
  <script src="/js/theme.js?v=2.12.0"></script>
  <script src="/js/auth.js?v=2.13.0"></script>
  <script src="/js/toast.js?v=2.12.0"></script>
  <style>
    html, body { overflow-x: clip; max-width: 100%; }
    .sidebar-nav a { display: block; padding: 10px 16px; min-height: 44px; }
  </style>
</head>
<body class="font-body bg-sky min-h-screen flex flex-col md:flex-row for-dig-page" data-magic-page="for-dig">
  <nav id="sidebar" class="hidden md:block w-full md:w-64 bg-navy text-white p-4 md:p-6 md:min-h-screen parent-magic-legacy-hide">
    <a href="/dashboard" class="hidden md:flex items-center gap-3 mb-8 no-underline text-white hover:text-white">
      <span class="text-2xl">⭐</span>
      <h1 class="text-xl font-heading font-bold">[REDACTED]</h1>
    </a>
    <ul class="space-y-2">
      <li><a href="/dashboard" class="sidebar-nav block px-4 py-3 text-white hover:bg-navy-soft rounded-lg transition-colors">Översikt</a></li>
      <li><a href="/daily-log" class="sidebar-nav block px-4 py-3 text-white hover:bg-navy-soft rounded-lg transition-colors">Daglig logg</a></li>
      <li><a href="/schedule" class="sidebar-nav block px-4 py-3 text-white hover:bg-navy-soft rounded-lg transition-colors">Veckoschema</a></li>
      <li><a href="/for-dig" data-feature="for_dig" class="sidebar-nav block px-4 py-3 rounded-lg bg-gold text-navy font-semibold">✨ För dig</a></li>
      <li><a href="/reports" data-feature="klinisk_rapportering" class="sidebar-nav block px-4 py-3 text-white hover:bg-navy-soft rounded-lg transition-colors">📊 Rapporter</a></li>
      <li><a href="/library" class="sidebar-nav block px-4 py-3 text-white hover:bg-navy-soft rounded-lg transition-colors text-sm opacity-80">📚 Bibliotek (avancerat)</a></li>
      <li><a href="/skattkammaren" class="sidebar-nav block px-4 py-3 text-white hover:bg-navy-soft rounded-lg transition-colors" style="color:#F5A623;font-weight:600;">🏆 Skattkammaren</a></li>
      <li><a href="/family" class="sidebar-nav block px-4 py-3 text-white hover:bg-navy-soft rounded-lg transition-colors">Familjen &amp; inställningar</a></li>
    </ul>
    <div class="mt-8 pt-4 border-t border-navy-soft space-y-2">
      <button onclick="Theme.toggleDark()" class="w-full px-4 py-2 text-white hover:bg-navy-soft rounded-lg transition-colors text-left flex items-center gap-2">
        <span>🌙</span> Mörkt läge
      </button>
      <button id="logoutBtn" class="w-full px-4 py-2 bg-coral hover:bg-red-200 text-navy rounded-lg font-semibold transition-colors">Logga ut</button>
    </div>
  </nav>

  <main class="flex-1 flex flex-col min-h-screen pb-20 md:pb-4">
    <div id="appViewToggleMount" class="app-view-toggle-wrap"></div>
    <div id="parentMagicPageMount" class="hidden" aria-live="polite"></div>
    <div class="bg-sky border-b border-lavender p-4 md:p-6 parent-magic-legacy-hide">
      <p id="forDigGreeting" class="for-dig-greeting">Hej 👋</p>
      <p class="for-dig-focus">Vad vill du fokusera på just nu?</p>
    </div>

    <div class="flex-1 p-4 md:p-8 overflow-auto">
      <div id="forDigFavorites" class="mb-4"></div>
      <div id="forDigMostInstalled"></div>
      <div id="forDigRecommendations"></div>
      <div id="forDigGoals" class="space-y-4 mt-4">
        <p class="text-text-soft text-center py-8">Laddar…</p>
      </div>
      <p class="text-center mt-8">
        <a href="/library" id="forDigLibraryLink" class="text-gold font-semibold underline">Visa hela biblioteket →</a>
      </p>
    </div>
  </main>

  <nav id="parentBottomNav" class="parent-bottom-nav" aria-label="Huvudnavigering">
    <a href="/dashboard" class="parent-bottom-nav-btn">
      <span class="parent-bottom-nav-icon" aria-hidden="true">🏠</span>
      <span>Hem</span>
    </a>
    <a href="/schedule" class="parent-bottom-nav-btn">
      <span class="parent-bottom-nav-icon" aria-hidden="true">📅</span>
      <span>Schema</span>
    </a>
    <a href="/for-dig" class="parent-bottom-nav-btn is-active" data-feature="for_dig">
      <span class="parent-bottom-nav-icon" aria-hidden="true">✨</span>
      <span>För dig</span>
    </a>
    <a href="/family" class="parent-bottom-nav-btn">
      <span class="parent-bottom-nav-icon" aria-hidden="true">👨‍👩‍👧</span>
      <span>Familj</span>
    </a>
    <a href="/settings" class="parent-bottom-nav-btn">
      <span class="parent-bottom-nav-icon" aria-hidden="true">⚙️</span>
      <span>Inställn.</span>
    </a>
  </nav>

  <script src="/js/sw-register.js?v=2.12.0"></script>
  <script src="/js/feature-check.js?v=2.14.0"></script>
  <script src="/js/mobile-nav.js?v=2.13.0"></script>
  <script src="/js/app-view-mode.js?v=4"></script>
  <script src="/js/parent-magic-page-hubs.js?v=1"></script>
  <script src="/js/parent-magic-shell.js?v=1"></script>
  <script src="/js/parent-magic-bootstrap.js?v=1"></script>
  <script src="/js/for-dig.js?v=2.2"></script>
  <script>
    document.getElementById('logoutBtn')?.addEventListener('click', () => Auth.logout());
  </script>
</body>
</html>
