  <style>
    html, body { overflow-x: clip; max-width: 100%; }
    * { box-sizing: border-box; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.3s ease forwards; }

    /* Day column */
    .day-col {
      min-width: 0;
      border-radius: 12px;
      background: white;
      border: 1px solid #E5E7EB;
      overflow: hidden;
      transition: box-shadow 0.15s;
    }
    .dark .day-col {
      background: #2A3458;
      border-color: #374166;
    }
    .day-col.today {
      border-color: #F5A623;
      border-width: 2px;
      box-shadow: 0 0 0 2px rgba(245,166,35,0.15);
    }
    .day-col.past-day {
      opacity: 0.85;
    }
    .day-col.special-day-col {
      border-color: #F59E0B;
      border-width: 2px;
    }
    .dark .day-col.special-day-col {
      border-color: #D97706;
    }

    /* Day cards = always light surface (even on magic/dark shell) */
    .day-col .day-name,
    .day-col .day-date,
    .day-col .day-star-progress,
    .day-col .act-name,
    .day-col .section-label,
    .day-col .empty-day {
      color: #1b2340;
    }
    .day-col .day-date,
    .day-col .day-star-progress.is-soft,
    .day-col .section-label,
    .day-col .empty-day {
      color: #5a6178 !important;
    }
    .day-col .day-name.is-today {
      color: #c88400 !important;
    }
    .day-col .day-star-progress.is-complete {
      color: #16a34a !important;
    }
    html.dark .day-col .day-name,
    html.dark .day-col .act-name {
      color: #1b2340 !important;
    }
    html.dark .day-col .day-date,
    html.dark .day-col .day-star-progress.is-soft,
    html.dark .day-col .section-label,
    html.dark .day-col .empty-day {
      color: #5a6178 !important;
    }
    html.dark .day-col .day-name.is-today {
      color: #c88400 !important;
    }
    html.dark .day-col .day-star-progress.is-complete {
      color: #16a34a !important;
    }

    /* Day header */
    .day-header {
      padding: 10px 12px 8px;
      border-bottom: 1px solid #E5E7EB;
    }
    .dark .day-header {
      border-bottom-color: #374166;
    }
    .today .day-header {
      background: #FFF3D6;
    }
    .dark .today .day-header {
      background: rgba(245,166,35,0.15);
    }

    /* Activity item */
    .act-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 13px;
    }
    .act-item.completed-item .act-name {
      text-decoration: line-through;
      color: #9CA3AF;
    }
    .dark .act-item.completed-item .act-name {
      color: #6B7280;
    }

    /* Section label */
    .section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 4px 8px 2px;
      color: #9AA0B8;
    }

    /* Completion dot */
    .status-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .status-dot.done { background: #22c55e; }
    .status-dot.not-done { background: #FCA5A5; }
    .status-dot.planned { background: #BFDBFE; }

    /* Child tab */
    .child-tab {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .child-tab.active {
      background: #F5A623;
      color: #1B2340;
      font-weight: 600;
    }
    .child-tab:not(.active) {
      background: white;
      color: #5A6178;
      border-color: #E5E7EB;
    }
    .dark .child-tab:not(.active) {
      background: #2A3458;
      color: #CBD5E1;
      border-color: #374166;
    }
    .child-tab:not(.active):hover {
      border-color: #F5A623;
      color: #1B2340;
    }
    .dark .child-tab:not(.active):hover {
      color: #F5A623;
    }

    /* Nav button */
    .nav-btn {
      min-width: 40px;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      border: 1px solid #E5E7EB;
      background: white;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      color: #1B2340;
    }
    .dark .nav-btn {
      background: #2A3458;
      border-color: #374166;
      color: white;
    }
    .nav-btn:hover {
      background: #FFF3D6;
      border-color: #F5A623;
    }
    .dark .nav-btn:hover {
      background: rgba(245,166,35,0.15);
    }

    /* Progress bar */
    .prog-bar {
      height: 4px;
      border-radius: 2px;
      background: #E5E7EB;
      overflow: hidden;
    }
    .dark .prog-bar {
      background: #374166;
    }
    .prog-fill {
      height: 100%;
      border-radius: 2px;
      background: #22c55e;
      transition: width 0.4s ease;
    }

    /* Paused day badge */
    .paused-badge {
      font-size: 11px;
      background: #FEF3C7;
      color: #92400E;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
    }
    .dark .paused-badge {
      background: rgba(251,191,36,0.2);
      color: #FCD34D;
    }

    /* Mobile swipe area */
    @media (max-width: 640px) {
      .cal-grid {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .day-col {
        min-width: 100%;
      }
    }

    @media (min-width: 641px) {
      .cal-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 8px;
        align-items: start;
      }
    }

    /* Empty state */
    .empty-day {
      padding: 12px 8px;
      text-align: center;
      font-size: 12px;
      color: #9AA0B8;
    }
  </style>

<body class="bg-white font-body text-navy dark:bg-navy dark:text-white" data-magic-page="calendar" data-i18n-manual-init="true" data-i18n-title="schedule.calendar.pageTitle">
  <div class="min-h-screen flex flex-col md:flex-row">

    <!-- Sidebar -->
    <nav id="sidebar" class="hidden md:block w-full md:w-64 bg-navy text-white p-4 md:p-6 md:min-h-screen parent-magic-legacy-hide">
      <a href="/dashboard" class="hidden md:flex items-center gap-3 mb-8 no-underline text-white hover:text-white">
        <span class="text-2xl">⭐</span>
        <h1 class="text-xl font-heading font-bold">Min Stjärndag</h1>
      </a>
      <ul class="space-y-2"></ul>
      <div class="mt-8 pt-4 border-t border-navy-soft space-y-2">
        <button id="darkModeToggle" onclick="toggleDarkMode()" class="w-full px-4 py-2 text-white hover:bg-navy-soft rounded-lg transition-colors text-left flex items-center gap-2">
          <span id="darkModeIcon">🌙</span> <span id="darkModeLabel">Mörkt läge</span>
        </button>
        <button id="logoutBtn" class="w-full px-4 py-2 text-white hover:bg-navy-soft rounded-lg transition-colors text-left">
          Logga ut
        </button>
      </div>
    </nav>

    <!-- Main content -->
    <main class="flex-1 p-4 md:p-8 overflow-x-hidden">
      <div id="appViewToggleMount" class="app-view-toggle-wrap"></div>
      <div id="parentMagicPageMount" class="hidden" aria-live="polite"></div>

      <!-- Page title (hidden in magic — hero in #parentMagicPageMount) -->
      <div class="mb-6 parent-magic-hide-header flex flex-wrap items-end justify-between gap-2">
        <div>
          <h2 class="text-2xl font-heading font-bold text-navy dark:text-white" data-i18n="schedule.calendar.legacyTitle">📅 Kalender</h2>
          <p class="text-text-soft dark:text-slate-400 text-sm mt-1" data-i18n="schedule.calendar.legacySub">Se ditt barns schema vecka för vecka</p>
        </div>
        <!-- Phase 4 — Kalender is the primary place to SEE special days/periods, but the
             create/edit/delete UI for them still lives in Weekly Schedule's "Specialdagar"
             (Visa ▾) tab (Calendar itself is a read-only week view, not a CRUD surface). This is
             an explicit secondary bridge to that surface — see
             docs/schedule-canonical-architecture.md "Phase 4" "Specialdagar final placement". -->
        <a id="calendarManageSpecialDaysLink" href="/schedule?view=special-days" class="min-h-[44px] px-3 py-2 text-sm font-semibold text-navy border-2 border-lavender hover:border-gold rounded-xl transition-colors flex items-center gap-1.5 no-underline whitespace-nowrap" data-i18n="schedule.calendar.manageSpecialDays">🌟 Hantera specialdagar &amp; lov</a>
      </div>

      <!-- Loading state -->
      <div id="loadingState" class="text-center py-12">
        <div class="text-4xl mb-4 animate-pulse">📅</div>
        <p class="text-text-soft dark:text-slate-400" data-i18n="schedule.calendar.loading">Laddar kalender…</p>
      </div>

      <!-- Error state -->
      <div id="errorState" class="hidden text-center py-12">
        <div class="text-4xl mb-4">😕</div>
        <p class="text-text-soft dark:text-slate-400" id="errorMsg" data-i18n="schedule.calendar.errorGeneric">Något gick fel. Försök igen.</p>
        <button onclick="loadCalendar()" class="mt-4 px-4 py-2 bg-gold text-navy font-semibold rounded-lg text-sm" data-i18n="schedule.calendar.retry">Försök igen</button>
      </div>

      <!-- Calendar UI -->
      <div id="calendarUI" class="hidden">

        <!-- Child selector -->
        <div id="childTabs" class="flex flex-wrap gap-2 mb-5"></div>

        <!-- Week nav -->
        <div class="flex items-center justify-between mb-5 gap-3 flex-wrap">
          <div class="flex items-center gap-2">
            <button class="nav-btn" onclick="changeWeek(-1)" data-i18n-title="schedule.calendar.prevWeek" title="Föregående vecka">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
              </svg>
            </button>
            <div class="text-center">
              <div id="weekLabel" class="font-semibold text-navy text-sm md:text-base whitespace-nowrap"></div>
              <div id="weekSubLabel" class="text-xs text-text-soft"></div>
            </div>
            <button class="nav-btn" onclick="changeWeek(1)" data-i18n-title="schedule.calendar.nextWeekNav" title="Nästa vecka">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
              </svg>
            </button>
          </div>
          <button id="calendarTodayBtn" onclick="goToToday()" class="px-4 py-2 text-sm font-semibold rounded-lg border border-gold text-gold hover:bg-gold-light transition-colors whitespace-nowrap" data-i18n="schedule.calendar.today">
            Idag
          </button>
        </div>

        <!-- Calendar grid -->
        <div class="cal-grid" id="calGrid"></div>

      </div>
    </main>
  </div>
