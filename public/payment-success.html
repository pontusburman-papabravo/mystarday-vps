<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title data-i18n="family.paymentSuccess.pageTitle">Betalning genomförd – Min Stjärndag</title> <!-- pragma: allowlist secret -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/tailwind.build.css?v=1">
    <link rel="stylesheet" href="/css/theme.css?v=2.12.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- Cookie-banner med GCM v2 + Meta Pixel + granulära val -->
  <script src="/js/cookie-banner.js?v=2.12.0"></script>
  <script src="/js/i18n.js?v=2.12.0"></script>
  <script src="/js/parent-app-i18n.js?v=1"></script>
</head>
<body data-i18n-manual-init="true" data-i18n-title="family.paymentSuccess.pageTitle" class="bg-white font-body text-navy min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-md text-center">
    <div class="text-6xl mb-6">🎉</div>
    <h1 class="font-heading text-3xl font-bold text-navy mb-4" data-i18n="family.paymentSuccess.title">Betalning genomförd!</h1>
    <p class="text-text-soft text-lg mb-8">
      <span data-i18n="family.paymentSuccess.body">Tack för ditt köp. Ditt konto är nu aktiverat. Välkommen till Min Stjärndag!</span> <!-- pragma: allowlist secret -->
    </p>
    <a href="/settings#prenumeration"
       class="inline-block bg-gold text-white font-heading font-bold px-8 py-3 rounded-xl hover:opacity-90 transition">
      <span data-i18n="family.paymentSuccess.settings">Gå till inställningar</span>
    </a>
  </div>

  <script>
    // Fire Meta Pixel Purchase event with verified payment data injected server-side
    (function () {
      var paymentData = __PIXEL_PAYMENT_DATA__;
      if (window.Pixel && paymentData && paymentData.amount) {
        window.Pixel.purchase(paymentData.amount, paymentData.currency || 'SEK');
      }
    })();
  </script>

  <!-- Service Worker Registration (update detection in /js/sw-register.js) -->
  <script src="/js/sw-register.js?v=2.12.0"></script>
  <script>document.addEventListener('DOMContentLoaded',function(){if(window.initParentAppI18n)initParentAppI18n();});</script>
</body>
</html>
