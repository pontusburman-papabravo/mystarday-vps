<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta property="og:title" content="My Starday">
    <meta property="og:description" content="Visual schedules, activities and rewards for families">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://mystarday.se/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://mystarday.se/og-image.png">
  <title>My Starday</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
    <link rel="stylesheet" href="/css/tailwind.build.css?v=1">
  
  <style>
    body {
      background-color: #FAFBFF;
    }

    .star-animation {
      animation: twinkle 2s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
  <!-- PWA / Favicon -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F5A623">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My Starday"><!-- Cookie banner -->
  <script src="/js/cookie-banner.js?v=2.12.0"></script>
  <script src="/js/auth-entry-failsafe.js?v=1"></script>
  <script src="/js/i18n.js?v=2.12.0"></script>
  <script src="/js/locale-switcher.js?v=3"></script>
  <script src="/js/auth-entry-i18n.js?v=1"></script>
</head>
<body class="font-body" data-i18n-title="auth.forgotPassword.pageTitle">
  <noscript>
    <p class="auth-entry-noscript"><strong>JavaScript required</strong> — enable JavaScript to use sign-in. / <strong>JavaScript krävs</strong> — aktivera JavaScript för att logga in.</p>
  </noscript>
  <div id="auth-entry-fallback" hidden class="auth-entry-fallback" role="alert" aria-live="assertive">
    <div>
      <p><strong>Page did not load fully</strong></p>
      <p>Refresh the page or <a href="javascript:location.reload()">try again</a>.</p>
    </div>
  </div>

  <!-- Star Logo Home Link -->
  <a href="/" class="fixed top-6 left-6 z-10 hover:scale-110 transition-transform duration-200">
    <span class="text-4xl star-animation">⭐</span>
  </a>

  <!-- Background decorative stars -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden">
    <div class="absolute top-20 right-10 text-3xl star-animation" style="animation-delay: 0.3s">✨</div>
    <div class="absolute top-1/3 left-12 text-2xl star-animation" style="animation-delay: 0.6s">⭐</div>
    <div class="absolute bottom-24 right-16 text-3xl star-animation" style="animation-delay: 0.9s">✨</div>
    <div class="absolute top-2/3 left-1/4 text-2xl star-animation" style="animation-delay: 1.2s">⭐</div>
  </div>

  <div class="min-h-screen flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md">
      <!-- Header Section -->
      <div class="text-center mb-10">
        <div class="mb-4 flex justify-center">
          <span class="text-6xl">🔑</span>
        </div>
        <h1 class="font-heading text-3xl md:text-4xl font-bold text-navy mb-3" data-i18n="auth.forgotPassword.heading"></h1>
        <p class="text-lg text-text-soft" data-i18n="auth.forgotPassword.lead"></p>
        <div class="mt-4 flex justify-center" data-locale-switcher-mount></div>
      </div>

      <!-- Error Message -->
      <div id="errorAlert" class="hidden mb-6 p-4 bg-coral rounded-lg border-2 border-red-300">
        <div class="flex items-start gap-3">
          <span class="text-2xl">⚠️</span>
          <p class="font-heading font-semibold text-navy" id="errorMessage"></p>
        </div>
      </div>

      <!-- Loading Spinner -->
      <div id="loadingSpinner" class="hidden mb-6 flex justify-center">
        <div class="w-12 h-12 border-4 border-gold-light border-t-gold rounded-full animate-spin"></div>
      </div>

      <!-- Success Message -->
      <div id="successAlert" class="hidden mb-6 p-4 bg-mint rounded-lg border-2 border-teal-300">
        <div class="flex items-start gap-3">
          <span class="text-2xl">✅</span>
          <div>
            <p class="font-heading font-semibold text-navy mb-2" data-i18n="auth.forgotPassword.successTitle"></p>
            <p class="text-sm text-text-soft" data-i18n="auth.forgotPassword.successBody"></p>
          </div>
        </div>
      </div>

      <!-- Form -->
      <form id="forgotPasswordForm" class="bg-white rounded-2xl shadow-lg p-8 md:p-10 border-2 border-sky space-y-6">
        <!-- Email Field -->
        <div>
          <label for="email" class="block font-heading font-semibold text-navy text-lg mb-3" data-i18n="auth.forgotPassword.email"></label>
          <input
            id="email"
            type="email"
            placeholder="din@epost.se"
            data-i18n-placeholder="auth.forgotPassword.emailPlaceholder"
            required
            class="w-full px-4 py-3 text-lg rounded-lg border-2 border-sky focus:border-gold focus:outline-none transition-colors duration-200 bg-sky/30 placeholder-text-soft"
          >
          <p class="text-xs text-text-soft mt-2" data-i18n="auth.forgotPassword.emailHint"></p>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="w-full bg-gradient-to-r from-gold to-yellow-400 hover:from-gold/90 hover:to-yellow-400/90 text-navy font-heading font-bold text-lg py-3 px-6 rounded-lg transition-all duration-200 shadow-md hover:shadow-lg active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed"
          data-i18n="auth.forgotPassword.submit"
        ></button>
      </form>

      <!-- Divider -->
      <div class="my-8 flex items-center gap-4">
        <div class="flex-1 h-px bg-sky"></div>
        <span class="text-text-soft text-sm" data-i18n="auth.forgotPassword.orDivider"></span>
        <div class="flex-1 h-px bg-sky"></div>
      </div>

      <!-- Back to Login Link -->
      <div class="text-center">
        <p class="text-text-soft mb-3" data-i18n="auth.forgotPassword.rememberPassword"></p>
        <a
          href="/login"
          class="inline-block px-6 py-2 border-2 border-navy text-navy font-heading font-semibold rounded-lg hover:bg-navy hover:text-white transition-colors duration-200"
          data-i18n="auth.forgotPassword.backToLogin"
        ></a>
      </div>

      <!-- Help Section -->
      <div class="mt-12 p-6 bg-lavender rounded-lg border-2 border-lavender">
        <h3 class="font-heading font-semibold text-navy mb-2 flex items-center gap-2">
          <span>💡</span> <span data-i18n="auth.forgotPassword.helpTitle"></span>
        </h3>
        <ul class="text-sm text-text-soft space-y-2">
          <li>• <span data-i18n="auth.forgotPassword.helpItem1"></span></li>
          <li>• <span data-i18n="auth.forgotPassword.helpItem2"></span></li>
          <li>• <span data-i18n="auth.forgotPassword.helpItem3"></span></li>
          <li>• <a href="javascript:void(0)" onclick="var t=document.getElementById('sbTrigger');if(t)t.click();" class="text-gold font-semibold hover:underline" data-i18n="auth.forgotPassword.contactSupport"></a> <span data-i18n="auth.forgotPassword.helpItem4Suffix"></span></li>
        </ul>
      </div>
    </div>
  </div>

  <script src="/js/i18n.js?v=2.12.0"></script>
  <script src="/js/auth.js?v=2.13.0"></script>

  <script>
    const form = document.getElementById('forgotPasswordForm');
    const emailInput = document.getElementById('email');

    function t(key, params) {
      return (window.authT || ((k) => k))(key, params);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = emailInput.value.trim();

      if (!email) {
        showError(t('auth.errors.emailRequired'));
        return;
      }

      // Basic email validation
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showError(t('auth.errors.emailInvalid'));
        return;
      }

      setLoading(true);
      hideError();

      try {
        const response = await Auth.api('/api/auth/forgot-password', {
          method: 'POST',
          body: JSON.stringify({ email }),
        });

        // Always show success message (prevent email enumeration)
        showSuccess();
        setLoading(false);

        if (!response.ok) {
          console.log('Server response:', response.status);
        }
      } catch (error) {
        // Still show success message to prevent email enumeration
        showSuccess();
        console.error('Forgot password error:', error);
        setLoading(false);
      }
    });

    function showSuccess() {
      document.getElementById('forgotPasswordForm').classList.add('hidden');
      document.getElementById('errorAlert').classList.add('hidden');
      document.getElementById('successAlert').classList.remove('hidden');
    }

    function showError(message) {
      document.getElementById('errorMessage').textContent = message;
      document.getElementById('errorAlert').classList.remove('hidden');
    }

    function hideError() {
      document.getElementById('errorAlert').classList.add('hidden');
    }

    function setLoading(isLoading) {
      const button = form.querySelector('button[type="submit"]');
      const spinner = document.getElementById('loadingSpinner');
      const formInputs = form.querySelectorAll('input');

      if (isLoading) {
        button.disabled = true;
        spinner.classList.remove('hidden');
        formInputs.forEach(input => input.disabled = true);
      } else {
        button.disabled = false;
        spinner.classList.add('hidden');
        formInputs.forEach(input => input.disabled = false);
      }
    }

    // Email input: auto-focus trimming
    emailInput.addEventListener('blur', (e) => {
      e.target.value = e.target.value.trim();
    });

    emailInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        form.dispatchEvent(new Event('submit'));
      }
    });
  </script>
  <!-- Support bubble for logged-out users -->
  <script src="/js/support-bubble.js?v=2.12.0"></script>
  <!-- Service Worker Registration (update detection in /js/sw-register.js) -->
  <script src="/js/sw-register.js?v=2.12.0"></script>
</body>
</html>
