<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="canonical" href="__SITE_URL__/en/news/archive">
  <link rel="alternate" hreflang="sv" href="__SITE_URL__/nyheter/arkiv">
  <link rel="alternate" hreflang="en" href="__SITE_URL__/en/news/archive">
  <link rel="alternate" hreflang="x-default" href="__SITE_URL__/">
  <title>News archive — My Starday</title>
  <meta name="description" content="Archived news and updates from My Starday.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/landing.css?v=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/js/cookie-banner.js?v=2.13.2"></script>
  <script src="/js/public-lang-switcher.js?v=2"></script>
  <style>
    body { background: var(--cream); }
    .archive-page { max-width: 640px; margin: 0 auto; padding: 6rem 1.5rem 4rem; }
    .archive-page h1 { font-size: 2rem; color: var(--navy); margin-bottom: 0.5rem; line-height: 1.25; }
    .archive-page .intro { color: var(--text-2); margin-bottom: 2rem; line-height: 1.6; }
    .archive-empty { color: var(--text-2); font-style: italic; }
    .archive-card {
      background: var(--white);
      border: 1px solid rgba(28, 35, 64, 0.1);
      border-radius: var(--radius-xl);
      overflow: hidden;
      margin-bottom: 1.25rem;
      box-shadow: 0 4px 20px rgba(28, 35, 64, 0.06);
    }
    .archive-card__media img { width: 100%; display: block; max-height: 220px; object-fit: cover; }
    .archive-card__content { padding: 1.25rem 1.35rem 1.35rem; }
    .archive-card__date { font-size: 0.78rem; font-weight: 600; color: var(--amber-dk); margin: 0 0 0.35rem; text-transform: uppercase; letter-spacing: 0.06em; }
    .archive-card__title { font-family: 'Fraunces', serif; font-size: 1.15rem; color: var(--navy); margin: 0 0 0.5rem; line-height: 1.3; }
    .archive-card__body { color: var(--text-2); font-size: 0.92rem; line-height: 1.55; margin: 0 0 0.75rem; white-space: pre-wrap; }
    .archive-card__link {
      display: inline-block;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--amber-dk);
      text-decoration: none;
    }
    .archive-card__link:hover { text-decoration: underline; }
    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-2);
      text-decoration: none;
      margin-bottom: 1.5rem;
    }
    .back-home:hover { color: var(--amber-dk); }
  </style>
</head>
<body>
  <div class="archive-page">
    <a href="/en" class="back-home">← Back to home</a>
    <h1>News archive</h1>
    <p class="intro">Older news and updates from My Starday. Current announcements appear on the <a href="/en">home page</a>.</p>
    <div id="archiveList">
      __ARCHIVE_LIST__
    </div>
  </div>
</body>
</html>
