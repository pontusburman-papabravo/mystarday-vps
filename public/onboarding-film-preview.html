<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Förhandsvisning — Onboardingfilm</title>
  <link rel="stylesheet" href="/css/tailwind.build.css?v=1">
  <link rel="stylesheet" href="/css/onboarding-handoff-film.css?v=1.0.2">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    html, body { margin: 0; min-height: 100%; background: #0f172a; }
  </style>
</head>
<body>
  <script src="/js/onboarding-handoff-film.js?v=1.0.2"></script>
  <script>
    (function bootFilmPreview() {
      if (window.OnboardingHandoffFilm && OnboardingHandoffFilm.showPreview) {
        OnboardingHandoffFilm.showPreview();
        return;
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootFilmPreview);
      } else {
        setTimeout(bootFilmPreview, 0);
      }
    })();
  </script>
</body>
</html>
