<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F5A623">
  <title>Förhandsvisning — Onboardingfilm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tailwind.build.css?v=1">
  <link rel="stylesheet" href="/css/theme.css?v=2.12.0">
  <link rel="stylesheet" href="/css/onboarding-handoff-film.css?v=1.4.1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    html, body { margin: 0; min-height: 100%; background: #1B2340; }
  </style>
</head>
<body>
  <script src="/js/onboarding-handoff-film.js?v=1.4.1"></script>
  <script>
    (function bootFilmPreview() {
      if (window.OnboardingHandoffFilm && OnboardingHandoffFilm.showPreview) {
        OnboardingHandoffFilm.showPreview();
        return;
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootFilmPreview);
      } else {
        setTimeout(bootFilmPreview, 0);
      }
    })();
  </script>
</body>
</html>
