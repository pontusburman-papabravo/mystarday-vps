<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Barnprofil — Min Stjärndag</title>
  <script src="/js/dom-utils.js?v=2.12.0"></script>
  <script src="/js/member-avatar.js?v=1"></script>
    <link rel="stylesheet" href="/css/tailwind.build.css?v=1">
    <link rel="stylesheet" href="/css/theme.css?v=2.13.0">
  <link rel="stylesheet" href="/css/mobile-nav.css?v=2.13.0">
  <link rel="stylesheet" href="/css/app-view-toggle.css?v=10">
  <link rel="stylesheet" href="/css/parent-magic-common.css?v=15">
  <link rel="stylesheet" href="/css/parent-bottom-nav.css?v=12">
  <style>
    html, body { overflow-x: clip; max-width: 100%; }
    #childProfileMount,
    #childProfileTabBody,
    #childProfileSetupBody { overflow-x: clip; max-width: 100%; min-width: 0; }
    #profilePinBlock { max-width: 100%; }
    #childProfileTabBar { top: 0; }
    html.platform-native #childProfileTabBar,
    html.is-native #childProfileTabBar {
      top: max(0px, env(safe-area-inset-top, 0px));
    }
    .toggle-track { position:relative;width:44px;height:24px;background:#EDE7F6;border-radius:12px;cursor:pointer;transition:background .2s; }
    .toggle-track.on { background:#F5A623; }
    .toggle-thumb { position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.15); }
    .toggle-track.on .toggle-thumb { transform:translateX(20px); }
    body.parent-magic-view main,
    main.flex-1 { padding-bottom: max(96px, calc(env(safe-area-inset-bottom, 0px) + 96px)); }
    #childProfileMount { scroll-padding-bottom: 120px; }
    #childProfileSetupBody .profile-setup-toggle,
    #childProfileSetupBody .profile-reward-toggle { scroll-margin-bottom: 120px; }
    #childProfileSetupBody > .space-y-4 > div { scroll-margin-bottom: 16px; }
    .profile-birthday-select {
      min-height: 44px;
      font-size: 16px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: rgba(245,166,35,0.2);
    }
    html.platform-tablet .child-profile-setup-row {
      min-height: 48px;
      align-items: center;
    }
    html.platform-tablet .profile-setup-toggle,
    html.platform-tablet .profile-reward-toggle {
      min-width: 52px;
      min-height: 32px;
    }
    html.platform-tablet .profile-setup-toggle .toggle-thumb,
    html.platform-tablet .profile-reward-toggle .toggle-thumb {
      width: 28px;
      height: 28px;
      top: 2px;
      left: 2px;
    }
    html.platform-tablet .profile-setup-toggle.on .toggle-thumb,
    html.platform-tablet .profile-reward-toggle.on .toggle-thumb {
      transform: translateX(20px);
    }
    html.platform-tablet .profile-setup-toggle,
    html.platform-tablet .profile-reward-toggle {
      height: 32px;
      border-radius: 16px;
    }
  </style>
  <script src="/js/theme.js?v=2.12.0"></script>
  <script src="/js/auth.js?v=2.13.0"></script>
  <script src="/js/i18n.js?v=2.12.0"></script>
  <script src="/js/locale-datetime.js?v=1"></script>
  <script src="/js/parent-app-i18n.js?v=1"></script>
  <script src="/js/toast.js?v=2.12.0"></script>
</head>
<body class="font-body bg-sky min-h-screen flex flex-col md:flex-row" data-magic-page="family-child" data-i18n-manual-init="true" data-i18n-title="family.childProfile.pageTitle">
  <nav id="sidebar" class="hidden md:block w-full md:w-64 bg-navy text-white p-4 md:p-6 md:min-h-screen">
    <a href="/dashboard" class="hidden md:flex items-center gap-3 mb-8 no-underline text-white">
      <span class="text-2xl">⭐</span>
      <span class="text-xl font-heading font-bold">Min Stjärndag</span>
    </a>
    <ul class="space-y-2"></ul>
    <div class="mt-8 pt-4 border-t border-navy-soft">
      <button id="logoutBtn" class="w-full px-4 py-2 bg-coral text-navy rounded-lg font-semibold" data-i18n="nav.avatar.logout">Logga ut</button>
    </div>
  </nav>
  <main class="flex-1 flex flex-col min-h-screen pb-20 md:pb-4">
    <div id="appViewToggleMount" class="app-view-toggle-wrap"></div>
    <div id="parentMagicPageMount" class="hidden" aria-live="polite"></div>
    <div id="childProfileMount" class="p-4 md:p-8 max-w-2xl mx-auto w-full">
      <p class="text-text-soft text-center py-12" data-i18n="family.childProfile.loadingProfile">Laddar barnprofil…</p>
    </div>
  </main>
  <div id="deleteChildModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-[9100] p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl">
      <div class="text-center">
        <p class="text-5xl mb-4" aria-hidden="true">⚠️</p>
        <h3 id="deleteChildModalTitle" class="text-xl font-heading font-bold text-navy mb-2"></h3>
        <p id="deleteChildTargetMessage" class="text-sm text-text-soft mb-6">Alla aktiviteter, scheman och belöningshistorik för detta barn raderas permanent.</p>
        <div class="flex gap-3">
          <button type="button" id="deleteChildCancelBtn"
            class="flex-1 px-4 py-2 border border-gray-200 text-text-soft rounded-xl font-semibold hover:bg-gray-50 transition-colors min-h-[44px]">
            Avbryt
          </button>
          <button type="button" id="deleteChildConfirmBtn"
            class="flex-1 px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-xl font-heading font-bold transition-colors min-h-[44px]">
            Ta bort
          </button>
        </div>
      </div>
    </div>
  </div>
  <div id="manualStarModal" class="hidden fixed inset-0 bg-black/60 flex items-end sm:items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl p-5 w-full max-w-sm shadow-2xl">
      <h3 id="manualStarModalTitle" class="text-lg font-heading font-bold text-navy mb-3">Ge extra stjärnor</h3>
      <input id="manualStarCount" type="number" min="1" max="100" value="1" class="w-full border border-lavender rounded-xl px-3 py-2 mb-3">
      <textarea id="manualStarReason" rows="3" required placeholder="Varför? (syns för barnet)" class="w-full border border-lavender rounded-xl px-3 py-2 mb-4"></textarea>
      <div class="flex gap-2">
        <button type="button" id="manualStarCancel" class="flex-1 py-3 border rounded-xl font-semibold">Avbryt</button>
        <button type="button" id="manualStarSubmit" class="flex-1 py-3 bg-gold text-white rounded-xl font-bold">Ge ⭐</button>
      </div>
    </div>
  </div>
  <script src="/js/sw-register.js?v=2.12.0"></script>
  <script src="/js/mobile-nav.js?v=2.13.0"></script>
  <script src="/js/nav-config.js?v=1"></script>
  <script src="/js/platform.js?v=2.13.0"></script>
  <script src="/js/pending-approvals.js?v=1"></script>
  <script src="/js/avatar-image-crop.js?v=1"></script>
  <script src="/js/avatar-upload-flow.js?v=1"></script>
  <script src="/js/birthday-picker.js?v=2.15.0"></script>
  <script src="/js/child-profile-setup.js?v=2.5"></script>
  <script src="/js/child-profile.js?v=1.4.0"></script>
  <script src="/js/app-view-mode.js?v=4"></script>
  <script src="/js/parent-magic-page-hubs.js?v=1"></script>
  <script src="/js/parent-magic-shell.js?v=1"></script>
  <script src="/js/parent-magic-bootstrap.js?v=13"></script>
  <script src="/js/parent-nav-sidebar.js?v=1"></script>
  <script src="/js/parent-magic-i18n.js?v=1"></script>
  <script>
    document.getElementById('logoutBtn')?.addEventListener('click', function () { Auth.logout(); });
  </script>
</body>
</html>
