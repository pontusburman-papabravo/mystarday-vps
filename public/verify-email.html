<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta property="og:title" content="My Starday">
    <meta property="og:description" content="Visual schedules, activities and rewards for families">
    <meta property="og:type" content="website">
    <meta property="og:image" content="[REDACTED]/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="[REDACTED]/og-image.png">
  <title>My Starday</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
    <link rel="stylesheet" href="/css/tailwind.build.css?v=1">
  
  <style>
    body {
      background-color: #FAFBFF;
    }

    .star-animation {
      animation: twinkle 2s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
  <!-- PWA / Favicon -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F5A623">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="[REDACTED]">
  <!-- Cookie banner -->
  <script src="/js/cookie-banner.js?v=2.12.0"></script>
  <script src="/js/auth-entry-failsafe.js?v=3"></script>
  <script src="/js/i18n.js?v=2.12.0"></script>
  <script src="/js/locale-switcher.js?v=4"></script>
  <script src="/js/auth-entry-i18n.js?v=2"></script>
</head>
<body class="font-body" data-i18n-title="auth.verify.pageTitle" data-i18n-manual-init="true">
  <noscript>
    <p class="auth-entry-noscript"><strong>JavaScript required</strong> — enable JavaScript to use sign-in. / <strong>JavaScript krävs</strong> — aktivera JavaScript för att logga in.</p>
  </noscript>
  <div id="auth-entry-fallback" hidden class="auth-entry-fallback" role="alert" aria-live="assertive">
    <div>
      <p><strong>Page did not load fully</strong></p>
      <p>Refresh the page or <a href="javascript:location.reload()">try again</a>.</p>
    </div>
  </div>

  <!-- Star Logo Home Link -->
  <a href="/" class="fixed top-6 left-6 z-10 hover:scale-110 transition-transform duration-200" data-i18n-aria-label="common.back">
    <span class="text-4xl star-animation">⭐</span>
  </a>

  <!-- Background decorative stars -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden">
    <div class="absolute top-20 right-10 text-3xl star-animation" style="animation-delay: 0.3s">✨</div>
    <div class="absolute top-1/3 left-12 text-2xl star-animation" style="animation-delay: 0.6s">⭐</div>
    <div class="absolute bottom-24 right-16 text-3xl star-animation" style="animation-delay: 0.9s">✨</div>
  </div>

  <div class="min-h-screen flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md">
      <div class="mb-6 flex justify-center" data-locale-switcher-mount></div>

      <!-- Loading State -->
      <div id="loadingState" class="text-center">
        <div class="mb-8 flex justify-center">
          <div class="w-16 h-16 border-4 border-gold-light border-t-gold rounded-full animate-spin"></div>
        </div>
        <h1 class="font-heading text-3xl md:text-4xl font-bold text-navy mb-3" data-i18n="auth.verify.checkingTitle"></h1>
        <p class="text-lg text-text-soft" data-i18n="auth.verify.checkingBody"></p>
      </div>

      <!-- Success State -->
      <div id="successState" class="hidden text-center">
        <div class="mb-8 flex justify-center">
          <span class="text-8xl animate-bounce" style="animation-delay: 0s">✅</span>
        </div>
        <h1 class="font-heading text-3xl md:text-4xl font-bold text-navy mb-3" data-i18n="auth.verify.successTitle"></h1>
        <p id="welcomeMessage" class="text-lg text-text-soft mb-4"></p>
        <p class="text-sm text-text-soft mb-6">
          <span data-i18n="auth.verify.redirectCountdownPrefix"></span>
          <span id="countdown">3</span>
          <span data-i18n="auth.verify.redirectCountdownSuffix"></span>
        </p>
        <a
          href="/login"
          class="inline-block px-8 py-3 bg-gradient-to-r from-gold to-yellow-400 hover:from-gold/90 hover:to-yellow-400/90 text-navy font-heading font-bold text-lg rounded-lg transition-all duration-200 shadow-md hover:shadow-lg"
          data-i18n="auth.verify.loginLink"
        ></a>
      </div>

      <!-- Error State -->
      <div id="errorState" class="hidden text-center">
        <div class="mb-8 flex justify-center">
          <span class="text-8xl">⚠️</span>
        </div>
        <h1 class="font-heading text-3xl md:text-4xl font-bold text-navy mb-3" data-i18n="auth.verify.errorTitle"></h1>
        <p id="errorMessage" class="text-lg text-text-soft mb-4"></p>

        <!-- Resend form -->
        <div id="resendSection" class="bg-sky rounded-xl p-6 mb-6">
          <p class="text-sm text-text-soft mb-3" data-i18n="auth.verify.resendPrompt"></p>
          <div class="flex gap-2">
            <input
              type="email"
              id="resendEmail"
              placeholder="din@epost.se"
              data-i18n-placeholder="auth.forgotPassword.emailPlaceholder"
              class="flex-1 px-4 py-3 rounded-lg border-2 border-lavender focus:border-gold focus:outline-none bg-white text-navy placeholder-text-soft text-sm"
            />
            <button
              id="resendBtn"
              onclick="resendVerification()"
              class="px-4 py-3 bg-gold hover:bg-yellow-500 text-white font-semibold rounded-lg transition-colors text-sm whitespace-nowrap"
              data-i18n="auth.verify.resendBtn"
            ></button>
          </div>
          <p id="resendMessage" class="hidden text-sm mt-3 text-navy font-medium"></p>
        </div>

        <!-- Error Actions -->
        <div class="space-y-3">
          <a
            href="/login"
            class="block px-8 py-3 bg-gradient-to-r from-gold to-yellow-400 hover:from-gold/90 hover:to-yellow-400/90 text-navy font-heading font-bold text-lg rounded-lg transition-all duration-200 shadow-md hover:shadow-lg"
            data-i18n="auth.verify.loginLink"
          ></a>
        </div>
      </div>

      <!-- Footer -->
      <div class="mt-12 text-center">
        <p class="text-sm text-text-soft">
          <span data-i18n="auth.verify.needHelpPrefix"></span>
          <a href="javascript:void(0)" onclick="var t=document.getElementById('sbTrigger');if(t)t.click();" class="text-gold font-semibold hover:underline" data-i18n="auth.verify.contactUs"></a>
        </p>
      </div>
    </div>
  </div>

  <script src="/js/auth.js?v=2.13.0"></script>

  <script>
    function t(key, params) {
      return (window.authT || ((k) => k))(key, params);
    }

    function brandName() {
      if (typeof window.authBrandName === 'function') return authBrandName();
      if (window.I18n) return I18n.t('app.name');
      return '';
    }

    function applyWelcomeMessage() {
      const el = document.getElementById('welcomeMessage');
      if (el) el.textContent = t('auth.verify.welcomeMessage', { brand: brandName() });
    }

    async function verifyEmail() {
      if (window.I18n) await I18n.init();
      applyWelcomeMessage();

      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      if (!token) {
        showErrorState(t('auth.verify.noToken'));
        return;
      }

      try {
        const res = await window.apiFetch('/api/auth/verify-email', {
          method: 'POST',
          body: JSON.stringify({ token }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          showErrorState(err.error || t('auth.verify.verifyFailed'));
          return;
        }

        showSuccessState();
      } catch (error) {
        showErrorState(t('auth.verify.genericError'));
        console.error('Verification error:', error);
      }
    }

    function showSuccessState() {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('errorState').classList.add('hidden');
      document.getElementById('successState').classList.remove('hidden');
      applyWelcomeMessage();

      let sec = 3;
      const cdEl = document.getElementById('countdown');
      const iv = setInterval(() => {
        sec--;
        if (cdEl) cdEl.textContent = sec;
        if (sec <= 0) { clearInterval(iv); window.location.href = '/login'; }
      }, 1000);
    }

    function showErrorState(message) {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('successState').classList.add('hidden');
      document.getElementById('errorState').classList.remove('hidden');
      document.getElementById('errorMessage').textContent = message || t('auth.verify.verifyFailed');
    }

    async function resendVerification() {
      const emailInput = document.getElementById('resendEmail');
      const msgEl = document.getElementById('resendMessage');
      const btn = document.getElementById('resendBtn');
      const email = emailInput.value.trim();

      if (!email || !email.includes('@')) {
        msgEl.textContent = t('auth.verify.resendEmailInvalid');
        msgEl.className = 'text-sm mt-3 text-red-600 font-medium';
        msgEl.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = t('auth.verify.resendSending');
      msgEl.classList.add('hidden');

      try {
        const res = await fetch('/api/auth/resend-verification', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email }),
        });

        const data = await res.json().catch(() => ({}));

        if (res.status === 429) {
          msgEl.textContent = data.error || t('auth.verify.resendRateLimit');
          msgEl.className = 'text-sm mt-3 text-red-600 font-medium';
        } else {
          msgEl.textContent = t('auth.verify.resendSuccess');
          msgEl.className = 'text-sm mt-3 text-green-700 font-medium';
        }
        msgEl.classList.remove('hidden');
      } catch {
        msgEl.textContent = t('auth.verify.genericError');
        msgEl.className = 'text-sm mt-3 text-red-600 font-medium';
        msgEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = t('auth.verify.resendBtn');
      }
    }

    document.addEventListener('locale-changed', () => {
      applyWelcomeMessage();
    });

    window.addEventListener('DOMContentLoaded', verifyEmail);
  </script>
  <!-- Support bubble for logged-out users -->
  <script src="/js/support-bubble.js?v=2.13.0"></script>
  <!-- Service Worker Registration (update detection in /js/sw-register.js) -->
  <script src="/js/sw-register.js?v=2.12.0"></script>
</body>
</html>
