<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Min Stjärndag — Feature Graphic</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1024px;
      height: 500px;
      overflow: hidden;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #1B2340 0%, #2A3458 45%, #F5A623 100%);
      display: flex;
      align-items: center;
      padding: 0 72px;
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 85% 20%, rgba(255,255,255,0.12) 0%, transparent 40%),
        radial-gradient(circle at 10% 90%, rgba(245,166,35,0.25) 0%, transparent 45%);
    }
    .stars {
      position: absolute;
      inset: 0;
      opacity: 0.35;
      background-image:
        radial-gradient(2px 2px at 120px 80px, #fff, transparent),
        radial-gradient(1.5px 1.5px at 280px 140px, #fff, transparent),
        radial-gradient(2px 2px at 900px 60px, #fff, transparent),
        radial-gradient(1px 1px at 820px 380px, #fff, transparent),
        radial-gradient(1.5px 1.5px at 960px 200px, #fff, transparent);
    }
    .content {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 40px;
      max-width: 720px;
    }
    .icon {
      width: 128px;
      height: 128px;
      border-radius: 28px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
      flex-shrink: 0;
    }
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 56px;
      font-weight: 800;
      color: #fff;
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    p {
      font-size: 26px;
      font-weight: 500;
      color: rgba(255,255,255,0.92);
      line-height: 1.35;
      max-width: 560px;
    }
    .badge {
      display: inline-block;
      margin-top: 18px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.15);
      color: #FFF3D6;
      font-size: 15px;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .phone-preview {
      position: absolute;
      right: 48px;
      bottom: -20px;
      width: 220px;
      height: 440px;
      border-radius: 32px;
      border: 4px solid rgba(255,255,255,0.2);
      background: linear-gradient(180deg, #0f1528 0%, #1B2340 40%, #2A3458 100%);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      overflow: hidden;
    }
    .phone-preview::after {
      content: '⭐';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 64px;
      filter: drop-shadow(0 4px 12px rgba(245,166,35,0.5));
    }
    .phone-notch {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 72px;
      height: 18px;
      background: #0f1528;
      border-radius: 0 0 12px 12px;
    }
  </style>
</head>
<body>
  <div class="stars"></div>
  <div class="content">
    <img class="icon" src="../../public/icon-512.png" alt="">
    <div>
      <h1>Min Stjärndag</h1>
      <p>Dagliga scheman, stjärnor och belöningar — en lugnare vardag för hela familjen.</p>
      <span class="badge">För barn 3–10 år · Föräldrar &amp; pedagoger</span>
    </div>
  </div>
  <div class="phone-preview"><div class="phone-notch"></div></div>
</body>
</html>
